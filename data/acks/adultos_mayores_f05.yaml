ACK_ID: LOAPAM_14
CLASE: ACK_OBLIGACION
TIPO: prohibicion
NOMBRE: Exoneración impuestos municipales obligatoria — personas ≥65 años con ingresos ≤5 RBU

FUENTE:
  norma: Ley Orgánica de las Personas Adultas Mayores
  sigla: LOAPAM
  jerarquia: 1
  articulo: "14"
  inciso: ""
  fecha_vigencia: "2019-05-09"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Estado

ACTOR_BENEFICIARIO:
  - Personas de 65 años o más con ingresos ≤ 5 RBU o patrimonio ≤ 500 RBU

OBLIGACION: >
  Toda persona que ha cumplido 65 años de edad, con ingresos mensuales estimados
  en un máximo de 5 remuneraciones básicas unificadas (RBU) o con un patrimonio
  que no exceda de 500 RBU, está exonerada del pago de impuestos fiscales y municipales.
  Para la aplicación de este beneficio no se requerirá declaración administrativa previa,
  provincial o municipal. Si renta o patrimonio excede el umbral, solo se pagan impuestos
  por la diferencia o excedente.

EVIDENCIA:
  - Ordenanza municipal de exoneraciones — debe recoger el mandato LOAPAM_14
  - Catastro municipal — padrón de contribuyentes con exoneración aplicada
  - Registros del Departamento de Rentas Municipales
  - LOTAIP_19_6 — ejecución presupuestaria (impacto en ingresos tributarios)

CONSECUENCIA:
  descripcion: >
    La negativa a aplicar la exoneración constituye violación directa del derecho de
    la persona adulta mayor. Activable por acción constitucional (CE Art. 88 — acción
    de protección) y dictamen de Defensoría del Pueblo.
    El GAD no puede requerir trámite previo para otorgar la exoneración.
  tipo: accion-constitucional
  organo_sancionador:
    - DPE
    - Judicatura

APLICABILIDAD:
  nacional: false
  municipal: true
  condicion:
    - ninguna
  # Aplica a todos los GAD Municipales — es mandato de ley orgánica

DOMINIOS_QUIRA:
  - Dom12
  - Dom02

RELACIONES:
  - CE_35
  - CE_36
  - LOAPAM_84
  - CE_11_3

VIGENCIA:
  estado: vigente

