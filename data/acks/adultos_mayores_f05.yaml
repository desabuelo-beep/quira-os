ACK_ID: LOAPAM_84
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Atribuciones del GAD Municipal — sistema de protección integral adultos mayores

FUENTE:
  norma: Ley Orgánica de las Personas Adultas Mayores
  sigla: LOAPAM
  jerarquia: 1
  articulo: "84"
  inciso: ""
  fecha_vigencia: "2019-05-09"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde

ACTOR_BENEFICIARIO:
  - Personas adultas mayores (≥65 años)

OBLIGACION: >
  Los municipios y distritos metropolitanos deben:
  (1) Garantizar el funcionamiento de los consejos cantonales, juntas cantonales
  y redes de protección de derechos de políticas y servicios especializados a favor
  de las personas adultas mayores.
  (2) Dotar a los consejos cantonales de protección de derechos y a las juntas cantonales
  de protección de derechos los recursos y la infraestructura necesaria para asegurar
  los servicios especializados a favor de personas adultas mayores.
  (3) A través de las juntas de protección de derechos conocerán, de oficio o a petición
  de parte, los casos de amenaza o vulneración de derechos de adultos mayores dentro
  de la jurisdicción cantonal, y dispondrán las medidas administrativas de protección.
  (4) De acuerdo al nivel de gobierno y a las competencias asignadas, implementarán el
  Sistema Nacional Especializado de Protección Integral de los Derechos de Adultos Mayores.

EVIDENCIA:
  - Resolución de constitución de Consejo Cantonal de Adultos Mayores
  - Ordenanza Municipal — reglamento de protección adultos mayores
  - Presupuesto — línea de inversión para adultos mayores (Patronato Municipal si aplica)
  - Actas de Junta Cantonal de Protección de Derechos — casos atendidos
  - LOTAIP_19_6 — ejecución presupuestaria servicios adultos mayores

CONSECUENCIA:
  descripcion: >
    El incumplimiento del mandato de garantizar el funcionamiento del sistema cantonal
    activa acción de protección (CE Art. 88) por violación de CE Art. 35-38.
    La Defensoría del Pueblo puede actuar de oficio. Si el incumplimiento implica
    perjuicio presupuestario verificable, aplica responsabilidad administrativa LOC-CGE_45.
  tipo: accion-constitucional
  organo_sancionador:
    - DPE
    - Judicatura
    - CGE

APLICABILIDAD:
  nacional: false
  municipal: true
  condicion:
    - ninguna

DOMINIOS_QUIRA:
  - Dom12
  - Dom08
  - Dom01

RELACIONES:
  - CE_35
  - CE_36
  - CE_37
  - CE_38
  - COOTAD_55
  - COOTAD_249
  - LOAPAM_14
  - CONA_207

VIGENCIA:
  estado: vigente

IMPLEMENTACION_TERRITORIAL:
  funcion_publica: >
    Protección integral de derechos de personas adultas mayores en el cantón —
    incluye: sistema de consejos cantonales, juntas cantonales, redes de protección,
    atención especializada y medidas administrativas de protección.
  actor_local: >
    Montecristi: Patronato Municipal (si incluye adultos mayores en su mandato).
    Verificar Resolución Orgánica 040-2025 — si el Patronato tiene competencia expresa
    sobre adultos mayores. Si no existe instrumento específico, el GAD incumple LOAPAM_84.
  instrumento: Servicio-público-municipal
  evidencia:
    - Ordenanza Patronato Municipal (verificar cobertura adultos mayores)
    - Presupuesto asignado (LOTAIP_19_6)
  indicador:
    - pendiente — TGI Dom12 debe incluir indicador de operatividad sistema protección PAM

