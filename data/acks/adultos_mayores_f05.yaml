ACK_ID: LOAPAM_19
CLASE: ACK_OBLIGACION
TIPO: competencia_concurrente
NOMBRE: Derecho a la cultura — GADs crean programas para adultos mayores en ámbito de competencias

FUENTE:
  norma: Ley Orgánica de las Personas Adultas Mayores
  sigla: LOAPAM
  jerarquia: 1
  articulo: "19"
  inciso: ""
  fecha_vigencia: "2019-05-09"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Estado (a través de entidades del Sistema Nacional de Cultura)

ACTOR_BENEFICIARIO:
  - Personas adultas mayores

OBLIGACION: >
  Las entidades del Sistema Nacional de Cultura y los gobiernos autónomos descentralizados,
  dentro del ámbito de sus competencias, deberán diseñar e implementar medidas que garanticen
  el derecho de los adultos mayores a acceder, aportar, participar y disfrutar de las actividades
  culturales, artísticas y espirituales, en el marco de la diversidad.
  Ver también Art. 20: los GADs crearán programas para estimular el desarrollo de potencialidades
  en deporte, recreación y turismo para adultos mayores.

EVIDENCIA:
  - POA — programas culturales para adultos mayores
  - Convenios con MCYP (Ministerio de Cultura) u otras entidades
  - Informe de actividades del Patronato Municipal / Dirección de cultura
  - LOTAIP_19_6 — ejecución de partidas culturales/recreativas adultos mayores

CONSECUENCIA:
  descripcion: >
    El incumplimiento activa responsabilidad administrativa del servidor público.
    Si hay presupuesto asignado no ejecutado, aplica LOC-CGE_45 (sub-ejecución).
    La Defensoría del Pueblo puede observar la omisión.
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - DPE
    - CGE

