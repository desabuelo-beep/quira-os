CLASE: ACK_PRINCIPIO
TIPO: principio
NOMBRE: Deber de garantizar derechos sin discriminación
FUENTE:
  norma: Constitución de la República del Ecuador
  sigla: CE
  jerarquia: 0
  articulo: "3"
  inciso: "1"
  fecha_vigencia: "2008-10-20"
ACTOR_OBLIGADO:
  - Estado ecuatoriano
  - GAD-Municipal
ACTOR_BENEFICIARIO:
  - Habitantes del Ecuador
OBLIGACION: >
  Garantizar sin discriminación alguna el efectivo goce de los derechos establecidos en
  la Constitución y en los instrumentos internacionales, en particular la educación, la
  salud, la alimentación, la seguridad social y el agua para sus habitantes.
EVIDENCIA:
  - POA
  - Presupuesto
  - LOTAIP
  - Informes sectoriales
CONSECUENCIA:
  descripcion: >
    La omisión del Estado en garantizar derechos fundamentales activa la acción de
    protección y responsabilidad estatal.
  tipo: accion-constitucional
  organo_sancionador:
