ACK_ID: CE_1
CLASE: ACK_PRINCIPIO
TIPO: principio
NOMBRE: Estado constitucional plurinacional descentralizado
FUENTE:
  norma: Constitución de la República del Ecuador
  sigla: CE
  jerarquia: 0
  articulo: "1"
  inciso: ""
  fecha_vigencia: "2008-10-20"
ACTOR_OBLIGADO:
  - Estado ecuatoriano
  - GAD-Municipal
ACTOR_BENEFICIARIO:
  - Ciudadanía ecuatoriana
OBLIGACION: >
  El Ecuador es un Estado constitucional de derechos y justicia, social, democrático,
  soberano, independiente, unitario, intercultural, plurinacional y laico. Se organiza
  en forma de república y se gobierna de manera descentralizada.
EVIDENCIA:
  - Ordenanzas municipales
  - Actos administrativos
  - PDOT
CONSECUENCIA:
  descripcion: >
    Todo acto que contradiga la naturaleza descentralizada, plurinacional o de derechos
    del Estado es nulo de pleno derecho.
  tipo: nulidad
  organo_sancionador:
    - Corte-Constitucional
    - PGE
APLICABILIDAD:
  nacional: true
  municipal: true
  condicion:
    - ninguna
DOMINIOS_QUIRA:
  - Dom01
  - Dom04
RELACIONES:
  - COOTAD
  - COA
META:
