ACK_ID: CE_35
CLASE: ACK_PRINCIPIO
TIPO: principio
NOMBRE: Grupos de Atención Prioritaria — Artículo Fundacional Dom12
FUENTE:
  norma: Constitución de la República del Ecuador
  sigla: CE
  jerarquia: 0
  articulo: "35"
  inciso: ""
  fecha_vigencia: "2008-10-20"
ACTOR_OBLIGADO:
  - Estado (todos los niveles — público y privado)
  - GAD-Municipal
  - Alcalde
  - Unidad responsable de servicios sociales (verificar orgánico)
ACTOR_BENEFICIARIO:
  - Adultos mayores
  - Niñas, niños y adolescentes (NNA)
  - Mujeres embarazadas
  - Personas con discapacidad
  - Personas privadas de libertad
  - Personas con enfermedades catastróficas o de alta complejidad
  - Personas en situación de riesgo
  - Víctimas de violencia doméstica y sexual, maltrato infantil
  - Afectados por desastres naturales o antropogénicos
  - Personas en condición de doble vulnerabilidad
OBLIGACION: >
  Los Grupos de Atención Prioritaria (GAP) recibirán atención PRIORITARIA
  Y ESPECIALIZADA en los ámbitos público y privado. El GAD Municipal debe
  garantizar esta atención en todos los servicios que presta y en los
  programas que gestiona, independientemente de qué unidad institucional
  los ejecute (según orgánico vigente del cantón).
EVIDENCIA:
  - POA con programas explícitos para cada subgrupo GAP
  - Presupuesto GAP ≥ 10% ingresos no tributarios (COOTAD 249)
  - LOTAIP Numeral 5 (catálogo servicios GAP)
  - LOTAIP Numeral 18 (convenios MIES/MSP/MIDUVI)
  - LOTAIP Numeral 22 (rendición de cuentas GAP)
  - Informe Rendición de Cuentas CPCC (sección GAP)
CONSECUENCIA:
  descripcion: >
    Ausencia de atención prioritaria y especializada a GAP viola Art. 35 CE
    directamente. Activa acción de protección (DPE), dictamen correctivo
    por incumplimiento de funciones COOTAD, y responsabilidad del Alcalde.
    El indicador IGD_GAP de Dom12 mide directamente este cumplimiento.
  tipo: accion-constitucional
  organo_sancionador:
    - DPE
    - CPCCS
    - Corte-Constitucional
DOMINIOS_QUIRA:
  - Dom12
  - Dom02
  - Dom01
APLICABILIDAD:
  nacional: true
  municipal: true
  condicion:
    - ninguna
IMPLEMENTACION_TERRITORIAL:
  funcion_publica: >
    Atención prioritaria y especializada a todos los subgrupos GAP en el territorio
    cantonal — función permanente del GAD independiente de la forma institucional
    que adopte en su orgánico (Patronato / Dirección / Unidad / Convenio MIES-MSP)
  actor_local: >
    pendiente — verificar Resolución Orgánica GADM Montecristi + Gold Master.
    La forma ejecutora varía por cantón: puede ser Patronato, Dirección de
    Desarrollo Social, Unidad de Protección Social, o combinación.
    QNKC-001: la función GAP es permanente; el actor es contingente.
  instrumento: POA-GAP + Convenio-MIES + Convenio-MSP + Convenio-MIDUVI
  evidencia:
    - LOTAIP_05
    - LOTAIP_18
    - LOTAIP_22
  indicador:
    - DOM12_IGD_GAP
    - DOM12_PRESUPUESTO_GAP_PCT
  nota_lac: >
    Equivalentes LAC: Colombia=poblacion-vulnerable-municipio /
    Perú=MIMP-programas-locales / México=DIF-municipal / Chile=programas-SENAME-IND.
    El Art. 35 CE es la expresión más explícita de un principio universal en LAC:
    el municipio como primer responsable de atención a grupos vulnerables.
RELACIONES:
  - COOTAD_249
  - CONA
  - Ley-Discapacidades
  - Ley-Adulto-Mayor
  - Ley-Movilidad-Humana
  - CE_32
  - CE_11_3
  - CE_11_11
  - LOTAIP_19
META:
  estado: v1.2
  fecha_extraccion: "2026-05-30"
  extractor: QLEP-v1.2
