    Colombia=ESP-Ley142 / Perú=EPS / México=SAPAM-ODAPAS / Chile=sanitaria-concesionada.
    La función es la misma; el actor y el marco normativo varían.
  gap_conocido: >
    Parroquia Isabel Muentes (NBI=61.2%) — cobertura no cuantificada aún en Gold Master.
    Pendiente cuantificación en PDOT.
RELACIONES:
