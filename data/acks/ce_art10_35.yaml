ACK_ID: CE_32
CLASE: ACK_DERECHO
TIPO: competencia_concurrente
NOMBRE: Derecho a la Salud — Competencia Concurrente para Servicios GAP
FUENTE:
  norma: Constitución de la República del Ecuador
  sigla: CE
  jerarquia: 0
  articulo: "32"
  inciso: ""
  fecha_vigencia: "2008-10-20"
ACTOR_OBLIGADO:
  - Estado (rector — MSP)
  - GAD-Municipal (a través de unidad habilitada con ordenanza — CE 260 + COOTAD 138)
ACTOR_BENEFICIARIO:
  - Toda la población, con énfasis en GAP
OBLIGACION: >
  La salud es un derecho que garantiza el Estado bajo principios de equidad,
  universalidad y solidaridad. El GAD puede proveer servicios de salud para
  GAP a través de unidad con ordenanza habilitante (competencia concurrente
  CE 260 + COOTAD 138 — confirmado por Pronunciamiento PGE Patronato Manta 2018).
EVIDENCIA:
  - Ordenanza de constitución de la unidad con servicios de salud (si aplica)
  - Registros de atención (Centro del Buen Vivir u equivalente)
  - Presupuesto asignado a salud para GAP (COOTAD 249 vinculado)
  - LOTAIP Numeral 5 (catálogo de servicios)
CONSECUENCIA:
  descripcion: >
    Si la unidad ofrece servicios de salud con ordenanza habilitante y los
    interrumpe sin justificación, viola CE 32 + principio no regresividad
    (CE 11.11). El GAD es responsable (CE 11.13).
  tipo: accion-constitucional
  organo_sancionador:
    - DPE
    - MSP
    - Judicatura
DOMINIOS_QUIRA:
  - Dom12
APLICABILIDAD:
  nacional: true
  municipal: true
  condicion:
    - gad-con-patronato
IMPLEMENTACION_TERRITORIAL:
  funcion_publica: >
    Provisión de servicios de salud básica para Grupos de Atención Prioritaria
    (adultos mayores, NNA, discapacidad, mujeres embarazadas, enfermedades
    catastróficas) a través de la unidad municipal habilitada
  actor_local: >
    pendiente — verificar Resolución Orgánica GADM Montecristi + Gold Master.
    Posible: Patronato Municipal + Centro del Buen Vivir. Verificar si existe
    ordenanza habilitante antes de asignar competencia de salud.
  instrumento: Convenio-MSP-MIES + Ordenanza-habilitante
  evidencia:
    - LOTAIP_05
    - LOTAIP_18
    - LOTAIP_22
  indicador:
    - DOM12_IGD_GAP
    - DOM12_COBERTURA_SALUD_GAP
  nota_lac: >
    Equivalentes LAC: Colombia=Patronatos-municipales-salud /
    Perú=SIS-municipal / México=DIF-municipal. La función de salud para GAP
    por municipio es concurrente en todos los sistemas; el actor varía.
RELACIONES:
