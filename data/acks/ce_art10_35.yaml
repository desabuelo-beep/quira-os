  funcion_publica: >
    Provisión de agua potable domiciliaria segura y continua + alcantarillado +
    tratamiento de aguas residuales + manejo de desechos sólidos
  actor_local: >
    pendiente — verificar Resolución Orgánica GADM Montecristi + Gold Master.
    Nota: No existe EP de agua en Montecristi. Forma de ejecución: municipal directa
