ACK_ID: CE_233
CLASE: ACK_OBLIGACION
TIPO: sancion
NOMBRE: Responsabilidad Servidores y Peculado Imprescriptible
FUENTE:
  norma: Constitución de la República del Ecuador
  sigla: CE
  jerarquia: 0
  articulo: "233"
  inciso: ""
  fecha_vigencia: "2008-10-20"

ACTOR_OBLIGADO:
  - Alcalde
  - Concejales
  - Directores-municipales
  - Todos-los-servidores-públicos

ACTOR_BENEFICIARIO:
  - Estado-ecuatoriano
  - Ciudadanía

OBLIGACION: >
  Ninguna servidora ni servidor público estará exento de responsabilidades por
  los actos realizados en el ejercicio de sus funciones, o por sus omisiones, y
  serán responsables administrativa, civil y penalmente por el manejo y
  administración de fondos, bienes o recursos públicos. Los delitos de peculado,
  cohecho, concusión y enriquecimiento ilícito son imprescriptibles; la acción
  para perseguirlos y las penas correspondientes serán imprescriptibles y los
  juicios se iniciarán y continuarán incluso en ausencia de las personas acusadas.

EVIDENCIA:
  - Informes-CGE-glosas
  - Expedientes-juicios-coactivos-Contraloría
  - Expedientes-penales-Fiscalía
  - Declaraciones-patrimoniales-comparativas

CONSECUENCIA:
  descripcion: >
    Peculado, cohecho, concusión y enriquecimiento ilícito son imprescriptibles.
    Triple responsabilidad: administrativa (destitución), civil (reintegro al
    Estado), penal (prisión). Juicios continúan en ausencia del acusado.
  tipo: sancion-penal
  organo_sancionador:
    - Judicatura
    - CGE
    - Fiscalía

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal, GAD-Provincial, GAD-Parroquial, Nivel-Central]
  condicion: []
  ambito_lac: >
    Responsabilidad pública en toda LAC. La imprescriptibilidad del peculado es
    característica constitucional ecuatoriana reforzada.
    Colombia: Art. 90 CN + Ley 599 Código Penal.
    Perú: Art. 41 Constitución (imprescriptibilidad parcial).

DOMINIOS_QUIRA:
  - Dom01
  - Dom03
  - Dom02

RELACIONES:
  - CE_231
  - LOC-CGE
  - LOSNCP_106
  - LOSEP_42

META:
