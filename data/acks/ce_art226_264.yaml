  - Instituciones-del-Estado
  - GAD-Municipal
  - Todos-los-órganos-públicos

ACTOR_BENEFICIARIO:
  - Ciudadanía

OBLIGACION: >
  Las instituciones del Estado, sus organismos, dependencias, las servidoras o
  servidores públicos y las personas que actúen en virtud de una potestad estatal
  ejercerán solamente las competencias y facultades que les sean atribuidas en la
  Constitución y la ley. Tendrán el deber de coordinar acciones para el
  cumplimiento de sus fines y hacer efectivo el goce y ejercicio de los derechos
  reconocidos en la Constitución.

EVIDENCIA:
  - Actos-administrativos-con-base-legal-expresa
  - Ordenanzas-con-fundamento-en-COOTAD
  - Resoluciones-del-Concejo

CONSECUENCIA:
  descripcion: >
    Los actos administrativos sin base legal expresa son nulos de pleno derecho.
    Responsabilidad administrativa y civil de los servidores que los emitan.
    Principio interpretativo base de todo control institucional QUIRA.
  tipo: nulidad
  organo_sancionador:
    - Judicatura
    - CGE
    - PGE

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal, GAD-Provincial, GAD-Parroquial, Nivel-Central]
  condicion: []
  ambito_lac: >
    Principio de legalidad análogo en toda LAC como base del Estado de Derecho.
    Colombia: Art. 6 + 121 CN. Perú: Art. 43-44 Constitución. México: Art. 16 CPEUM.
    Ecuador es uno de los más explícitos: obliga a ejercer SOLO lo atribuido.

DOMINIOS_QUIRA:
