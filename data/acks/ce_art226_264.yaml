---
ACK_ID: CE_264
CLASE: ACK_OBLIGACION
TIPO: competencia_exclusiva
NOMBRE: Catálogo Completo Competencias Exclusivas GAD Municipal
FUENTE:
  norma: Constitución de la República del Ecuador
  sigla: CE
  jerarquia: 0
  articulo: "264"
  inciso: "1-14"
  fecha_vigencia: "2008-10-20"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Concejo-Municipal

ACTOR_BENEFICIARIO:
  - Ciudadanía-cantonal
  - Territorio-cantonal

OBLIGACION: >
  Los gobiernos municipales tendrán las siguientes competencias exclusivas sin
  perjuicio de otras que determine la ley:
  1. Planificar el desarrollo cantonal y formular los correspondientes planes de
  ordenamiento territorial.
  2. Ejercer el control sobre el uso y ocupación del suelo en el cantón.
  3. Planificar, construir y mantener la vialidad urbana.
  4. Prestar los servicios públicos de agua potable, alcantarillado, depuración
  de aguas residuales, manejo de desechos sólidos, actividades de saneamiento
  ambiental y aquellos que establezca la ley.
  5. Crear, modificar o suprimir mediante ordenanzas, tasas y contribuciones
  especiales de mejoras.
  6. Planificar, regular y controlar el tránsito y el transporte terrestre
  dentro de su circunscripción cantonal.
  7. Planificar, construir y mantener la infraestructura física y los
  equipamientos de salud y educación, así como los espacios públicos destinados
  al desarrollo social, cultural y deportivo.
  8. Preservar, mantener y difundir el patrimonio arquitectónico, cultural y
  natural del cantón y construir los espacios públicos para estos fines.
  9. Formar y administrar los catastros inmobiliarios urbanos y rurales.
  10. Delimitar, regular, autorizar y controlar el uso de las playas de mar,
  riberas y lechos de ríos, lagos y lagunas, sin perjuicio de las limitaciones
  que establezca la ley.
  11. Preservar y garantizar el acceso efectivo de las personas al uso de las
  playas de mar, riberas de ríos, lagos y lagunas.
  12. Regular, autorizar y controlar la explotación de materiales áridos y pétreos.
  13. Gestionar los servicios de prevención, protección, socorro y extinción de
  incendios.
  14. Gestionar la cooperación internacional para el cumplimiento de sus competencias.

EVIDENCIA:
  - POA-con-ejecución-por-competencia
  - LOTAIP-Numeral-6
  - LOTAIP-Numeral-10
  - PDOT-con-metas-por-competencia
  - Presupuesto-institucional-por-programa
  - Gold-Master-TGI-ejecución

CONSECUENCIA:
  descripcion: >
    El incumplimiento de cualquiera de las 14 competencias exclusivas constituye
    omisión institucional que puede activar el DPE (derecho vulnerado en el
    territorio) y la CGE (presupuesto no ejecutado en función pública mandatada).
    Base constitucional de TODOS los indicadores TGI del Holding Municipal de
    Montecristi y de los 222 GADs del Ecuador.
  tipo: observacion-cpccs
  organo_sancionador:
    - DPE
    - CGE
    - CPCCS

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal]
  condicion: []
  ambito_lac: >
    Catálogo de competencias municipales equivalente en LAC aunque con distribución
    diferente según el modelo de Estado (unitario vs federal).
    Colombia: Art. 311-313 CN + Ley 136 (competencias municipales).
    Perú: Ley 27972 LOM Art. 73-80 (ordenamiento territorial, servicios locales).
    México: Art. 115 CPEUM fracción III (agua, alumbrado, mercados, seguridad).
    El catálogo nominal varía; la estructura competencial territorial es análoga.
    QUIRA mapea la función (Capa 3) — el actor local (Capa 5) varía por jurisdicción.

IMPLEMENTACION_TERRITORIAL:
  funcion_publica: >
    Las 14 competencias exclusivas constituyen el catálogo completo de funciones
    públicas permanentes del GAD Municipal. Cada una genera una obligación de
    resultado verificable en el territorio:
    CE_264.1 → PDOT aprobado y metas de desarrollo territorial.
    CE_264.2 → Control uso suelo: permisos, catastro, sanciones.
    CE_264.3 → Vialidad urbana mantenida.
    CE_264.4 → Agua potable en cada parroquia, alcantarillado, residuos sólidos.
    CE_264.5 → Recaudación de tasas y contribuciones.
    CE_264.6 → Tránsito y transporte regulado.
    CE_264.7 → Infraestructura salud/educación/espacios públicos mantenida.
    CE_264.8 → Patrimonio cultural preservado.
    CE_264.9 → Catastro inmobiliario actualizado.
    CE_264.13 → Servicio de bomberos operativo.
    Estas funciones existen aunque cambie la administración o la forma institucional.
  actor_local: >
    pendiente — verificar Resolución Orgánica GADM Montecristi para cada
    competencia. QNKC-001: el actor es contingente; la función es permanente.
    CE_264.4 (agua potable): NO existe EP de agua en Montecristi — actor pendiente
    de verificación en orgánico GADM. NUNCA asumir EP sin fuente documental.
    CE_264.13 (bomberos): Cuerpo de Bomberos Montecristi — entidad autónoma con
    financiamiento propio (recargo factura eléctrica).
  instrumento: >
    Variable por competencia: Dirección-Municipal / EP-Municipal / Concesión /
    Convenio-Mancomunidad / Sistema-comunitario / Delegación-Nivel-Central.
    QNKC-001: el instrumento es Capa 4 (SERVICIO) — contingente.
  evidencia:
    - LOTAIP_Numeral_6
    - LOTAIP_Numeral_7
    - LOTAIP_Numeral_10
    - PDOT-Montecristi
    - Gold-Master-TGI-v5.5
  indicador:
    - DOM04_COBERTURA_AGUA_PCT
    - DOM04_COBERTURA_ALCANTARILLADO_PCT
    - DOM04_RESIDUOS_SOLIDOS_COBERTURA_PCT
    - DOM02_EJECUCION_PRESUPUESTARIA
    - DOM03_CATASTRO_ACTUALIZADO
    - DOM04_VIALIDAD_URBANA_MANTENIDA
  nota_lac: >
    CE_264.4 es análogo a: Colombia — Ley 142/1994 (servicios públicos domiciliarios,
    prestados por ESP pública, mixta o privada). Perú — LOM Art. 80 (saneamiento,
    agua y alcantarillado). México — Art. 115 fracción III a) (agua potable,
    alcantarillado, tratamiento y disposición de aguas residuales).
    El QLEP mapea la función universal. El QTMP mapea el actor local por jurisdicción.
  gap_conocido: >
    CE_264.4 (agua potable): Gold Master v5.5 no registra EP de agua en Montecristi.
    Actor pendiente de verificación en Resolución Orgánica GADM.
    Parroquia Isabel Muentes: NBI estimado 61.2% — brecha cobertura agua según PDOT.
    Estimado: ~3,200 personas sin cobertura de agua potable.

