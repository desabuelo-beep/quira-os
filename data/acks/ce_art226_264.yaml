ACK_ID: CE_238
CLASE: ACK_PRINCIPIO
TIPO: definicion
NOMBRE: GADs Autonomía Política Administrativa Financiera
FUENTE:
  norma: Constitución de la República del Ecuador
  sigla: CE
  jerarquia: 0
  articulo: "238"
  inciso: ""
  fecha_vigencia: "2008-10-20"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - GAD-Provincial
  - GAD-Parroquial

ACTOR_BENEFICIARIO:
  - Territorio-cantonal
  - Ciudadanía

OBLIGACION: >
  Los gobiernos autónomos descentralizados gozarán de autonomía política,
  administrativa y financiera, y se regirán por los principios de solidaridad,
  subsidiariedad, equidad interterritorial, integración y participación ciudadana.
  En ningún caso el ejercicio de la autonomía permitirá la secesión del territorio
  nacional. Constituyen gobiernos autónomos descentralizados las juntas
  parroquiales rurales, los concejos municipales, los concejos metropolitanos,
  los consejos provinciales y los consejos regionales.

EVIDENCIA:
  - Ordenanzas-emitidas-por-el-Concejo
  - Presupuesto-municipal-aprobado
  - POA-institucional
  - Resoluciones-del-Concejo

CONSECUENCIA:
  descripcion: >
    La interferencia inconstitucional del gobierno central en las autonomías
    del GAD puede impugnarse ante la Corte Constitucional. El GAD que no
    ejerza su autonomía financiera compromete su capacidad de cumplir competencias.
  tipo: ninguna
  organo_sancionador:
    - Corte-Constitucional

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal, GAD-Provincial, GAD-Parroquial]
  condicion: []
  ambito_lac: >
    Autonomía municipal constitucional en toda LAC aunque con diferente alcance.
    Colombia: Art. 287 CN (autonomía entidades territoriales).
    Perú: Art. 188-199 Constitución (descentralización).
    México: Art. 115 CPEUM (municipio libre).
    La forma institucional varía; la autonomía territorial es el principio análogo.

DOMINIOS_QUIRA:
  - Dom01

RELACIONES:
  - CE_240
  - CE_241
  - CE_264
  - COOTAD_1
  - COPLAFIP

META:
