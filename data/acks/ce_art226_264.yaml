ACK_ID: CE_230
CLASE: ACK_OBLIGACION
TIPO: prohibicion
NOMBRE: Prohibición Nepotismo Pluriempleo Discriminación
FUENTE:
  norma: Constitución de la República del Ecuador
  sigla: CE
  jerarquia: 0
  articulo: "230"
  inciso: ""
  fecha_vigencia: "2008-10-20"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Concejo-Municipal
  - Director-Municipal

ACTOR_BENEFICIARIO:
  - Ciudadanía
  - Servidores-públicos

OBLIGACION: >
  En el ejercicio del servicio público se prohíbe: el desempeño de más de un
  cargo público remunerado; el nepotismo; y las discriminaciones de cualquier
  tipo. Igualmente está prohibido el ejercicio de funciones en una institución
  administrada o controlada por el servidor o sus familiares hasta el cuarto
  grado de consanguinidad y segundo de afinidad.

EVIDENCIA:
  - Expedientes-RRHH-personal
  - Contratos-y-nombramientos
  - LOTAIP-Numeral-9-contratos-laborales
  - Declaraciones-patrimoniales

CONSECUENCIA:
  descripcion: >
    La violación de estas prohibiciones constituye causa de destitución sin
    perjuicio de las acciones legales correspondientes. El nepotismo puede
    generar responsabilidades penales y civiles.
  tipo: destitucion
  organo_sancionador:
    - LOSEP-sumario-administrativo
    - CGE
    - Judicatura

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal, GAD-Provincial, GAD-Parroquial, Nivel-Central]
  condicion: []
  ambito_lac: >
    Prohibiciones análogas en toda LAC. Colombia: Ley 734/2002 CDU Art. 35.
    Perú: Ley 27588 (incompatibilidades). México: LGRA Art. 29.

DOMINIOS_QUIRA:
  - Dom01
  - Dom07

RELACIONES:
  - CE_226
  - CE_231
  - LOSEP_42
  - LOC-CGE

META:
