ACK_ID: CE_226
CLASE: ACK_PRINCIPIO
TIPO: principio
NOMBRE: Principio de Legalidad Administrativa
FUENTE:
  norma: Constitución de la República del Ecuador
  sigla: CE
  jerarquia: 0
  articulo: "226"
  inciso: ""
  fecha_vigencia: "2008-10-20"

