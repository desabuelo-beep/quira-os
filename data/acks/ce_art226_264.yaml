ACK_ID: CE_240
CLASE: ACK_OBLIGACION
TIPO: competencia_exclusiva
NOMBRE: Facultades Legislativas y Ejecutivas del GAD Municipal
FUENTE:
  norma: Constitución de la República del Ecuador
  sigla: CE
  jerarquia: 0
  articulo: "240"
  inciso: ""
  fecha_vigencia: "2008-10-20"

ACTOR_OBLIGADO:
  - Concejo-Municipal
  - Alcalde

ACTOR_BENEFICIARIO:
  - Ciudadanía-cantonal
  - Territorio-cantonal

OBLIGACION: >
  Los gobiernos autónomos descentralizados de los cantones tendrán facultades
  legislativas en el ámbito de sus competencias y jurisdicciones territoriales
  — expresadas en ordenanzas. El Alcalde ejerce las facultades ejecutivas.
  Las juntas parroquiales rurales tendrán facultades reglamentarias. Todos los
  GADs ejercerán facultades ejecutivas en el ámbito de sus competencias.

EVIDENCIA:
  - Ordenanzas-municipales-registradas
  - Resoluciones-ejecutivas-Alcaldía
  - Registro-oficial-publicaciones-municipales
  - Actas-Concejo-aprobación-ordenanzas

CONSECUENCIA:
  descripcion: >
    Las ordenanzas municipales fuera del ámbito de competencias constitucionales
    son nulas. El Alcalde que ejerza funciones legislativas incurre en
    responsabilidad administrativa.
  tipo: nulidad
  organo_sancionador:
    - Corte-Constitucional
    - PGE

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal]
  condicion: []
  ambito_lac: >
    Facultad normativa municipal (acuerdos/ordenanzas) en toda LAC.
    Colombia: Acuerdos del Concejo Municipal (Ley 136).
    Perú: Ordenanzas municipales (Ley 27972 LOM).
    México: Reglamentos municipales (Art. 115 CPEUM).

IMPLEMENTACION_TERRITORIAL:
  funcion_publica: >
    Ejercicio de la potestad normativa local (ordenanzas) y ejecutiva (actos
    administrativos del Alcalde) para regular y gestionar las 14 competencias
    exclusivas del cantón. Función permanente: el Concejo Municipal siempre
    existe; su composición y la estructura interna de ejecución son contingentes.
  actor_local: >
    pendiente — verificar Resolución Orgánica GADM Montecristi.
    QNKC-001: Concejo Municipal (facultad legislativa) y Alcalde (facultad
    ejecutiva) son constantes constitucionales; la estructura interna de
    direcciones y unidades es contingente.
  instrumento: Ordenanzas + Resoluciones + Actos-administrativos
  evidencia:
    - LOTAIP_Numeral_8
    - Registro-oficial-sección-municipal
  indicador:
    - DOM01_ORDENANZAS_APROBADAS
    - DOM01_RESOLUCIONES_ALCALDIA

DOMINIOS_QUIRA:
  - Dom01

RELACIONES:
