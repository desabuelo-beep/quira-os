ACK_ID: CE_241
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Planificación Territorial Obligatoria Base Constitucional PDOT
FUENTE:
  norma: Constitución de la República del Ecuador
  sigla: CE
  jerarquia: 0
  articulo: "241"
  inciso: ""
  fecha_vigencia: "2008-10-20"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Concejo-Municipal
  - Alcalde

ACTOR_BENEFICIARIO:
  - Ciudadanía-cantonal
  - Territorio-cantonal

OBLIGACION: >
  La planificación garantizará el ordenamiento territorial y será obligatoria en
  todos los gobiernos autónomos descentralizados. El PDOT (Plan de Desarrollo y
  Ordenamiento Territorial) es el instrumento de planificación mandatado.

EVIDENCIA:
  - PDOT-aprobado-y-vigente
  - Informes-seguimiento-PDOT-SENPLADES
  - POA-alineado-al-PDOT
  - Presupuesto-articulado-al-PDOT

CONSECUENCIA:
  descripcion: >
    La ausencia de PDOT vigente es incumplimiento constitucional que activa la
    Secretaría de Planificación y el CPCCS. El presupuesto sin alineación al
    PDOT puede ser observado por la CGE. Base de todos los indicadores Dom04
    y Dom09 del TGI.
  tipo: observacion-cpccs
  organo_sancionador:
    - Secretaría-de-Planificación-del-Estado
    - CPCCS
    - CGE

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal, GAD-Provincial, GAD-Parroquial]
  condicion: []
  ambito_lac: >
    Planificación territorial obligatoria en toda LAC aunque con nombre e
    instrumento diferente. Colombia: POT municipal obligatorio (Ley 388/1997).
    Perú: PDC — Plan de Desarrollo Concertado (Ley 28867 LOM).
    México: Plan Municipal de Desarrollo. El PDOT ecuatoriano es uno de los
    más completos en cuanto a obligatoriedad de seguimiento.

IMPLEMENTACION_TERRITORIAL:
  funcion_publica: >
    Planificación territorial cantonal con ordenamiento del uso del suelo,
    articulación del presupuesto al PDOT y seguimiento de metas de desarrollo.
    Función permanente del GAD Municipal: independiente de la administración
    política de turno — el PDOT trasciende los períodos de gobierno.
  actor_local: >
    pendiente — verificar Resolución Orgánica GADM Montecristi.
    Típicamente: Dirección de Planificación o unidad equivalente.
    QNKC-001: la planificación es obligación permanente; la unidad interna es contingente.
  instrumento: PDOT + POA + Presupuesto-alineado
  evidencia:
    - LOTAIP_Numeral_7
    - PDOT-Montecristi-aprobado
    - Informes-seguimiento-SENPLADES
  indicador:
    - DOM04_PDOT_APROBADO
    - DOM04_METAS_PDOT_PCT
    - DOM09_ALINEACION_POA_PDOT
  gap_conocido: >
    PDOT Montecristi es fuente canónica para datos de brechas territoriales
    parroquiales. Parroquia Isabel Muentes: NBI=61.2% (estimado).
    Verificar fecha actualización PDOT vigente y estado de aprobación formal.

DOMINIOS_QUIRA:
  - Dom04
  - Dom02
  - Dom09

RELACIONES:
