OBLIGACION: >
  Las servidoras y servidores públicos sin excepción presentarán, al iniciar y
  al finalizar su gestión y con periodicidad anual, una declaración patrimonial
  jurada que incluirá activos y pasivos, así como la autorización para que, de
  ser necesario, se levante el sigilo de sus cuentas bancarias; quienes
  incumplan serán destituidos del cargo.

EVIDENCIA:
  - Declaraciones-patrimoniales-juradas-registradas-CGE
  - LOTAIP-Numeral-9
  - Registro-declaraciones-Contraloría

CONSECUENCIA:
  descripcion: >
    El incumplimiento es causa directa e inmediata de destitución del cargo.
    La falsedad en la declaración activa responsabilidad penal (falsedad
    instrumental). La CGE lleva el registro y puede comparar año a año.
  tipo: destitucion
  organo_sancionador:
    - CGE
    - LOSEP-sumario-administrativo
    - Judicatura-si-falsedad

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal, GAD-Provincial, GAD-Parroquial, Nivel-Central]
  condicion: [inicio-gestión, anual, fin-gestión]
  ambito_lac: >
    Declaración patrimonial obligatoria en toda LAC como herramienta anticorrupción.
    Colombia: Ley 190/1995 + formulario CGR. Perú: Ley 27482.
    México: Declaración 3de3 SFP. Costa Rica: DJBR-CGHR.

DOMINIOS_QUIRA:
