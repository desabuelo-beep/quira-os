    - CE_35
  nota_historica: >
    Derogado por Ley No. 0 (RO Suplemento 283, 07-jul-2014).
    También derogados: Arts. 298, 299, 300, 301, 303, 304 CONA (financiamiento NNA).
    El régimen de financiamiento municipal para NNA migró a COOTAD_249 (10% GAP).
    Igualmente derogados: Arts. 194, 198-204 (Concejo Nacional NNA — organismo suprimido).

