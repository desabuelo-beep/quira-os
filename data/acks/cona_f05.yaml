ACK_ID: CONA_302
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Fondos municipales para NNA — DEROGADO (RO 283 / 2014)

FUENTE:
  norma: Código de la Niñez y Adolescencia
  sigla: CONA
  jerarquia: 1
  articulo: "302"
  inciso: ""
  fecha_vigencia: "2003-01-03"

ACTOR_OBLIGADO:
  - GAD-Municipal

ACTOR_BENEFICIARIO:
  - Niñas, niños y adolescentes del cantón

OBLIGACION: >
  [DEROGADO] Los municipios debían constituir fondos específicos para el financiamiento
  de programas de protección integral de NNA. El artículo fue derogado por Ley No. 0
  (RO Suplemento 283, 07-jul-2014). La obligación de financiar se mantiene a través
  del mandato general de COOTAD_249 (10% para GAP) y CE Art. 35.

EVIDENCIA:
  - No aplica — átomo histórico para trazabilidad de auditorías
  - Referencia histórica: presupuestos GAD anteriores a 2014

CONSECUENCIA:
  descripcion: >
    Norma derogada. Sin consecuencia activa. Referencia solo para auditorías históricas
    (períodos 2003-2014) o para el Patronato que pueda alegar fondos bajo la norma anterior.
  tipo: ninguna
  organo_sancionador: []

