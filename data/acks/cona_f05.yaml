ACK_ID: CONA_12
CLASE: ACK_PRINCIPIO
TIPO: principio
NOMBRE: Prioridad absoluta NNA en políticas públicas y recursos del Estado

FUENTE:
  norma: Código de la Niñez y Adolescencia
  sigla: CONA
  jerarquia: 1
  articulo: "12"
  inciso: ""
  fecha_vigencia: "2003-01-03"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Estado
  - Sociedad

ACTOR_BENEFICIARIO:
  - Niñas, niños y adolescentes (0-18 años)
  - Menores de 6 años (prioridad especial)

OBLIGACION: >
  En la formulación y ejecución de las políticas públicas y en la provisión de recursos
  se debe asignar prioridad absoluta a la niñez y adolescencia. Se les asegurará acceso
  preferente a los servicios públicos y a cualquier clase de atención que requieran.
  Se dará prioridad especial a la atención de niños y niñas menores de seis años.
  En caso de conflicto, los derechos de los NNA prevalecen sobre los derechos de los demás.

EVIDENCIA:
  - POA — componente de atención a niñez y adolescencia
  - Presupuesto — asignación a programas NNA
  - COOTAD_249 — 10% GAP (complemento obligacional)
  - LOTAIP_19_6 — publicación mensual de ejecución presupuestaria
  - Patronato Municipal — informes de servicio a NNA

CONSECUENCIA:
  descripcion: >
    La omisión de prioridad absoluta a NNA activa acción de protección (CE Art. 88).
    Si la omisión genera perjuicio económico al Estado, aplica glosa CGE.
    Responsabilidad administrativa del servidor público que omita asignar prioridad.
  tipo: accion-constitucional
  organo_sancionador:
    - DPE
    - Corte Constitucional
    - CGE

APLICABILIDAD:
  nacional: true
  municipal: true
  condicion:
    - ninguna

DOMINIOS_QUIRA:
  - Dom12
  - Dom02
  - Dom08

RELACIONES:
  - CE_35
  - CE_11_3
  - COOTAD_249
  - CONA_207
  - LOAPAM_84

VIGENCIA:
  estado: vigente

CADENA_TERRITORIAL:
  capa: 1
  circuito_id: GAP_10PCT
  activa:
    - COOTAD_249
    - CONA_207
  mide_en: "TGI Dom12"

