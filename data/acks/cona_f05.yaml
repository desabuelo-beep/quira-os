ACK_ID: CONA_207
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Junta Cantonal de Protección de Derechos — constitución por Concejo Cantonal NNA

FUENTE:
  norma: Código de la Niñez y Adolescencia
  sigla: CONA
  jerarquia: 1
  articulo: "207"
  inciso: ""
  fecha_vigencia: "2003-01-03"

ACTOR_OBLIGADO:
  - Concejo-Municipal
  - GAD-Municipal

ACTOR_BENEFICIARIO:
  - Niñas, niños y adolescentes del cantón
  - Ciudadanía en general

OBLIGACION: >
  La Junta Cantonal de Protección de Derechos (JCPD) se integrará con tres miembros
  principales y sus respectivos suplentes, elegidos por el Concejo Cantonal de la Niñez
  y Adolescencia. El GAD Municipal es responsable de constituir, financiar y sostener
  la operación de la JCPD en su jurisdicción. Los miembros deben acreditar formación
  técnica para las responsabilidades del cargo.

EVIDENCIA:
  - Acta de Concejo — resolución de conformación JCPD
  - Ordenanza Municipal — regulación de la JCPD
  - Presupuesto — asignación para operación JCPD
  - LOTAIP_19_6 — ejecución presupuestaria JCPD
  - Informe de gestión JCPD

CONSECUENCIA:
  descripcion: >
    La no constitución de la JCPD viola CE Art. 35 (grupos prioritarios) y CE Art. 88
    (acción de protección). La Defensoría del Pueblo puede actuar de oficio.
    Responsabilidad administrativa del Alcalde por omisión de garantía institucional.
  tipo: accion-constitucional
  organo_sancionador:
    - DPE
    - Judicatura

APLICABILIDAD:
  nacional: false
  municipal: true
  condicion:
    - ninguna
  # Aplica a todos los GAD Municipales — cada cantón debe tener su JCPD

DOMINIOS_QUIRA:
  - Dom12
  - Dom08
  - Dom01

RELACIONES:
  - CONA_12
  - CE_35
  - CE_264
  - COOTAD_55
  - COOTAD_249

VIGENCIA:
  estado: vigente

IMPLEMENTACION_TERRITORIAL:
  funcion_publica: >
    Protección administrativa de derechos de NNA en el cantón — tribunal administrativo
    especializado que conoce y resuelve amenazas o violaciones de derechos en sede
    extrajudicial antes de acudir a los juzgados de niñez.
  actor_local: >
    Montecristi: JCPD Montecristi — pendiente verificar si se constituyó conforme al CONA.
    Resolución Orgánica 040-2025 debe indicar si existe como unidad administrativa.
  instrumento: Servicio-público-municipal
  evidencia:
    - Ordenanza que regula la JCPD en el cantón
    - Presupuesto asignado (LOTAIP_19_6)
  indicador:
    - pendiente — verificar si TGI Dom12 incluye indicador de operatividad JCPD

META:
  estado: v1.4
  fecha_extraccion: "2026-05-30"
  extractor: QLEP-v1.4
  revisado_por_experto: true

