# F0.3 — COOTAD — Código Orgánico de Organización Territorial, Autonomía y Descentralización
# Bloque: Principios + Funciones + Competencias + Presupuesto + Equidad
# QLEP v1.2 | Extracción: 2026-05-30
# Átomos: 10 | Estado: completo (núcleo)
# Fuente: COOTAD (Suplemento RO 303 — 19-oct-2010, con reformas 2026)
#
# NOTA ARQUITECTÓNICA (QNKC-001):
# Los átomos COOTAD desarrollan las Capas 1-2 de la cadena canónica.
# COOTAD_3 → principios interpretativos de TODA la acción del GAD.
# COOTAD_54 → funciones permanentes del GAD (análogo a funcion_publica en IMPLEMENTACION_TERRITORIAL).
# COOTAD_192/198/215/228 → la cadena presupuestaria que conecta derechos con territorio.
# IRS=79.7 viola simultáneamente COOTAD_215 + COOTAD_228 → base legal de las alertas Dom04.

---
ACK_ID: COOTAD_3
CLASE: ACK_PRINCIPIO
TIPO: principio
NOMBRE: Principios COOTAD — Solidaridad Equidad Interterritorial Subsidiariedad
FUENTE:
  norma: Código Orgánico de Organización Territorial, Autonomía y Descentralización
  sigla: COOTAD
  jerarquia: 1
  articulo: "3"
  inciso: ""
  fecha_vigencia: "2010-10-19"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Concejo-Municipal

ACTOR_BENEFICIARIO:
  - Ciudadanía-cantonal
  - Parroquias-rurales
  - Comunidades-con-NBI-alto

OBLIGACION: >
  El ejercicio de la autoridad y las potestades públicas de los gobiernos autónomos
  descentralizados se regirán por los siguientes principios:
  UNIDAD: los distintos niveles de gobierno observarán la unidad del ordenamiento
  jurídico y la igualdad de trato, evitando que la distribución de competencias y
  recursos produzca inequidades territoriales.
  SOLIDARIDAD: todos los niveles de gobierno tienen como obligación compartida
  construir el desarrollo justo, equilibrado y equitativo de las distintas
  circunscripciones territoriales, redistributibuyendo y reorientando recursos y
  bienes públicos para compensar las inequidades entre circunscripciones.
  COORDINACIÓN: los niveles de gobierno armonizarán sus planes y gestión para
  cumplir los objetivos del buen vivir.
  SUBSIDIARIEDAD: se privilegiará la gestión por el nivel de gobierno más cercano
  a la población, para mejorar calidad, eficacia y democratización.
  COMPLEMENTARIEDAD: los gobiernos cooperarán entre sí.
  EQUIDAD INTERTERRITORIAL: la organización territorial garantizará el desarrollo
  equilibrado, la igualdad de oportunidades y el acceso a servicios públicos
  en todos los territorios.
  PARTICIPACIÓN CIUDADANA: los GADs promoverán el desarrollo de formas
  participativas de gestión.
  SUSTENTABILIDAD DEL DESARROLLO: los GADs priorizarán las potencialidades
  de sus circunscripciones para mejorar el bienestar de la población.

EVIDENCIA:
  - IRS-Índice-de-Regresividad-Territorial
  - Distribución-presupuestaria-por-parroquia
  - Informes-CGE-equidad-territorial
  - PDOT-con-territorialización-de-inversiones

CONSECUENCIA:
  descripcion: >
    El incumplimiento del principio de solidaridad y equidad interterritorial no
    tiene una sanción directa pero es la base legal de las alertas QUIRA.
    IRS=79.7 viola el principio de solidaridad (Art. 3) + equidad interior (Art. 228).
    Base jurídica para reclamaciones ante DPE y CPCCS por distribución inequitativa.
  tipo: observacion-cpccs
  organo_sancionador:
    - DPE
    - CPCCS
    - Corte-Constitucional

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal, GAD-Provincial, GAD-Parroquial]
  condicion: []
  ambito_lac: >
    Principios de solidaridad, subsidiariedad y equidad territorial en toda LAC.
    Colombia: Art. 1 + 287 CN + Art. 2 Ley 136 (principios municipales).
    Perú: Ley 27783 LBDP (bases descentralización) Art. 8 (principios).
    México: Art. 115 CPEUM + Ley de Coordinación Fiscal (equidad distributiva).

DOMINIOS_QUIRA:
  - Dom04
  - Dom01
  - Dom02

RELACIONES:
  - CE_238
  - CE_264
  - COOTAD_215
  - COOTAD_228
  - COOTAD_192

META:
  estado: v1.2
  fecha_extraccion: "2026-05-30"
  extractor: QLEP-v1.2
  revisado_por_experto: false

