ACK_ID: COOTAD_198
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Regla 70 Pct Inversión Destino Transferencias
FUENTE:
  norma: Código Orgánico de Organización Territorial, Autonomía y Descentralización
  sigla: COOTAD
  jerarquia: 1
  articulo: "198"
  inciso: ""
  fecha_vigencia: "2010-10-19"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Director-Financiero-GADM

ACTOR_BENEFICIARIO:
  - Ciudadanía-cantonal
  - Parroquias-rurales

OBLIGACION: >
  Las transferencias que efectúa el Gobierno Central a los gobiernos autónomos
  descentralizados podrán financiar hasta el treinta por ciento (30%) de gastos
  permanentes, y un mínimo del setenta por ciento (70%) de gastos no permanentes
  necesarios para el ejercicio de sus competencias exclusivas con base en la
  planificación de cada GAD. Las transferencias provenientes del 10% de los
  ingresos no permanentes deberán financiar egresos no permanentes exclusivamente.
  [Reforma 2026: Art. 198.1 establece que los egresos no financieros totales
  deben ser ≥68% en gasto de inversión para 2027, y ≥70% desde 2028].

EVIDENCIA:
  - Presupuesto-ejecutado-gasto-permanente-vs-no-permanente
  - Cédulas-presupuestarias-por-tipo-gasto
  - Informes-CGE-cumplimiento-regla-70-30
  - Gold-Master-TGI-D3-ejecución-inversión

CONSECUENCIA:
  descripcion: >
    El incumplimiento de la regla 70/30 es observable en la ejecución presupuestaria.
    D3=59.85% de ejecución total — si la sub-ejecución se concentra en gasto no
    permanente (inversión), el GADM podría violar tanto el Art. 198 original como
    el Art. 198.1 de la Reforma 2026. La CGE puede detectarlo en auditoría.
    Consecuencia: observación de auditoría + riesgo de glosa al Director Financiero.
  tipo: glosa-cge
  organo_sancionador:
    - CGE
    - Ministerio-de-Finanzas

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal, GAD-Provincial, GAD-Parroquial]
  condicion: []
  ambito_lac: >
    Reglas de uso de transferencias intergubernamentales en toda LAC.
    Colombia: SGP con usos específicos por sector (salud, educación, etc.).
    Perú: Foncomun — libre disponibilidad pero con control de inversión mínima.
    México: Fondo de Aportaciones — uso sectorial específico por ley.
    La regla de inversión mínima es el mecanismo anti-burocracia estándar en LAC.

DOMINIOS_QUIRA:
