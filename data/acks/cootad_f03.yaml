ACK_ID: COOTAD_137
CLASE: ACK_OBLIGACION
TIPO: competencia_exclusiva
NOMBRE: Agua Potable OCSAS Alianzas Comunitarias Parroquias Rurales
FUENTE:
  norma: Código Orgánico de Organización Territorial, Autonomía y Descentralización
  sigla: COOTAD
  jerarquia: 1
  articulo: "137"
  inciso: ""
  fecha_vigencia: "2010-10-19"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde

ACTOR_BENEFICIARIO:
  - Ciudadanía-parroquias-rurales
  - Comunidades-rurales-sin-cobertura

OBLIGACION: >
  Las competencias de prestación de servicios públicos de agua potable, en todas
  sus fases, las ejecutarán los gobiernos autónomos descentralizados municipales
  con sus respectivas normativas y dando cumplimiento a las regulaciones y
  políticas nacionales. Los servicios en las parroquias rurales se deberán
  coordinar con los GADs parroquiales y las organizaciones comunitarias del agua
  (OCSAS) existentes en el cantón.
  Los GADs municipales planificarán y operarán la gestión integral del servicio
  de agua potable en sus respectivos territorios.
  Se fortalecerá la gestión de las iniciativas comunitarias en torno al agua,
  mediante el incentivo de alianzas entre lo público y lo comunitario.
  La provisión de los servicios responderá a los principios de solidaridad,
  obligatoriedad, generalidad, uniformidad, eficiencia, universalidad,
  accesibilidad, regularidad, continuidad y calidad.
  Los precios y tarifas serán equitativos, a través de tarifas diferenciadas a
  favor de los sectores con menores recursos económicos.

EVIDENCIA:
  - Convenios-GADM-OCSAS-firmados
  - Cobertura-agua-potable-por-parroquia
  - PDOT-con-metas-cobertura-agua
  - Tarifas-diferenciadas-publicadas

CONSECUENCIA:
  descripcion: >
    El GADM que no garantice agua potable "en todas sus fases" en parroquias
    rurales viola el Art. 137 + CE_264.4. Isabel Muentes con agua=1.02% representa
    una emergencia constitucional: triple violación (CE_12 + CE_264.4 + COOTAD_137).
    El DPE puede activar acciones de protección por vulneración del derecho humano
    al agua en comunidades con NBI alto.
  tipo: observacion-cpccs
  organo_sancionador:
    - DPE
    - CPCCS
    - Corte-Constitucional

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal]
  condicion: []
  ambito_lac: >
    Competencia municipal de agua potable con enfoque comunitario en toda LAC.
    Colombia: Ley 142/1994 (servicios públicos domiciliarios) + Decreto 1575/2007.
    Perú: LOM 27972 Art. 80 num.4 + Reglamento de calidad del agua.
    México: Art. 115 fracción III.a CPEUM + Ley de Aguas Nacionales.
    Las OCSAS (SAPAM México, JASS Perú, Acueductos comunitarios Colombia) son
    el equivalente de las organizaciones comunitarias de agua mencionadas en COOTAD_137.

IMPLEMENTACION_TERRITORIAL:
  funcion_publica: >
    Garantizar agua potable en TODAS sus fases en TODAS las parroquias del cantón,
    incluyendo las rurales, con coordinación obligatoria con OCSAS comunitarias.
    Función permanente: existe independientemente de si hay EP de agua o no.
    En Montecristi: sin EP de agua — la función debe ejecutarse a través del
    orgánico municipal o alianzas con OCSAS existentes en cada parroquia.
  actor_local: >
    pendiente — verificar Resolución Orgánica GADM Montecristi.
    QNKC-001: NO existe EP de agua en Montecristi. La función es del GAD;
    el mecanismo de ejecución (Dirección / Convenio / OCSAS) debe verificarse
    en el orgánico GADM. NUNCA asumir actor sin fuente documental.
  instrumento: Dirección-Agua-GAD / Convenio-OCSAS / Sistema-comunitario
  evidencia:
    - PDOT-Montecristi-cobertura-agua-por-parroquia
    - Convenios-OCSAS-firmados
    - LOTAIP_19_6-presupuesto-agua
  indicador:
