ACK_ID: COOTAD_55
CLASE: ACK_OBLIGACION
TIPO: competencia_exclusiva
NOMBRE: Competencias Exclusivas COOTAD GAD Municipal — Desarrollo Operativo CE_264
FUENTE:
  norma: Código Orgánico de Organización Territorial, Autonomía y Descentralización
  sigla: COOTAD
  jerarquia: 1
  articulo: "55"
  inciso: "a-n"
  fecha_vigencia: "2010-10-19"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde

ACTOR_BENEFICIARIO:
  - Ciudadanía-cantonal
  - Territorio-cantonal

OBLIGACION: >
  Los gobiernos autónomos descentralizados municipales tendrán las siguientes
  competencias exclusivas sin perjuicio de otras que determine la ley (en
  desarrollo de CE_264):
  a) Planificar el desarrollo cantonal y formular el PDyOT.
  b) Ejercer el control sobre el uso y ocupación del suelo en el cantón.
  c) Planificar, construir y mantener la vialidad urbana.
  d) Prestar los servicios públicos de agua potable, alcantarillado, depuración
  de aguas residuales, manejo de desechos sólidos, actividades de saneamiento
  ambiental y aquellos que establezca la ley.
  e) Crear, modificar o suprimir mediante ordenanzas, tasas y contribuciones.
  f) Planificar, regular y controlar el tránsito y el transporte terrestre.
  g) Planificar, construir y mantener la infraestructura física y equipamientos
  de salud y educación (con autorización previa del ente rector nacional por convenio).
  h) Preservar, mantener y difundir el patrimonio arquitectónico, cultural y natural.
  i) Elaborar y administrar los catastros inmobiliarios urbanos y rurales.
  j) Delimitar, regular, autorizar y controlar el uso de playas de mar, riberas y
  lechos de ríos, lagos y lagunas.
  k) Preservar y garantizar el acceso efectivo de personas al uso de playas y riberas.
  l) Regular, autorizar y controlar la explotación de materiales áridos y pétreos.
  m) Gestionar los servicios de prevención, protección, socorro y extinción de incendios.
  n) Gestionar la cooperación internacional para el cumplimiento de sus competencias.

EVIDENCIA:
  - POA-por-competencia
  - LOTAIP-Numeral-6-ejecución-por-competencia
  - Gold-Master-TGI-v5.5
  - Informes-CGE-auditoría-competencias

CONSECUENCIA:
  descripcion: >
    Omisión en cualquier competencia exclusiva constituye incumplimiento institucional.
    COOTAD_55.d (agua potable) + COOTAD_137 son la base legal de las alertas Dom04
    por cobertura deficiente en parroquias rurales (Isabel Muentes agua=1.02%).
    Literal g) tiene condición especial: requiere convenio previo con el ente rector.
  tipo: observacion-cpccs
  organo_sancionador:
    - DPE
    - CGE
    - CPCCS

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal]
  condicion: []
  ambito_lac: >
    COOTAD_55 es el desarrollo operativo de CE_264. En LAC, la ley orgánica
    municipal desarrolla las competencias constitucionales con el mismo patrón.
    Colombia: Ley 136/1994 Art. 3 (funciones municipales).
    Perú: LOM 27972 Art. 73 (materias de competencia municipal).
    México: Art. 115 fracción III CPEUM.

IMPLEMENTACION_TERRITORIAL:
  funcion_publica: >
    Las 14 competencias exclusivas del COOTAD desarrollan operativamente las
    de CE_264. Son el mapa de funciones públicas permanentes del GAD Municipal.
    Cada competencia genera una brecha territorial verificable cuando no se cumple.
    COOTAD_55.d es la competencia más crítica para Montecristi: agua potable
    con cobertura del 1.02% en Isabel Muentes — emergencia constitucional.
  actor_local: >
    pendiente — verificar Resolución Orgánica GADM Montecristi por cada competencia.
    COOTAD_55.m (bomberos): Cuerpo de Bomberos Montecristi — autónomo con
    financiamiento propio. COOTAD_55.d (agua): actor pendiente de verificación.
    QNKC-001: el actor es contingente; la competencia es permanente.
  instrumento: Varía por competencia (EP / Dirección / Convenio / Sistema-comunitario)
  evidencia:
    - LOTAIP_19_6
    - LOTAIP_19_8
    - PDOT-Montecristi
    - Gold-Master-TGI-v5.5
  indicador:
    - DOM04_COBERTURA_AGUA_PCT
    - DOM04_COBERTURA_ALCANTARILLADO_PCT
    - DOM04_RESIDUOS_SOLIDOS_COBERTURA_PCT
  gap_conocido: >
    COOTAD_55.d (agua potable): Isabel Muentes agua=1.02% — violación directa.
    Gold Master v5.5 + PDOT Montecristi son fuentes canónicas de esta brecha.
    Actor local pendiente: no existe EP de agua en Montecristi (QNKC-001).

DOMINIOS_QUIRA:
  - Dom04
  - Dom02
  - Dom12
  - Dom01

RELACIONES:
  - CE_264
  - COOTAD_54
  - COOTAD_137
  - CE_241
