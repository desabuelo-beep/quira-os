ACK_ID: COOTAD_54
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Funciones del GAD Municipal — 20 Funciones Permanentes
FUENTE:
  norma: Código Orgánico de Organización Territorial, Autonomía y Descentralización
  sigla: COOTAD
  jerarquia: 1
  articulo: "54"
  inciso: ""
  fecha_vigencia: "2010-10-19"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Concejo-Municipal

ACTOR_BENEFICIARIO:
  - Ciudadanía-cantonal
  - Territorio-cantonal

OBLIGACION: >
  Son funciones del gobierno autónomo descentralizado municipal las siguientes
  (selección de funciones con mayor impacto territorial):
  a) Promover el desarrollo sustentable del cantón para garantizar la realización
  del buen vivir a través de la implementación de políticas públicas cantonales.
  b) Diseñar e implementar políticas de promoción y construcción de equidad e
  inclusión en su territorio, en el marco de sus competencias constitucionales
  y legales.
  e) Elaborar y ejecutar el plan cantonal de desarrollo, el de ordenamiento
  territorial y las políticas públicas en el ámbito de sus competencias y en su
  circunscripción territorial, de manera coordinada con la planificación nacional,
  regional, provincial y parroquial, y realizar en forma permanente el seguimiento
  y rendición de cuentas sobre el cumplimiento de las metas establecidas.
  f) Ejecutar las competencias exclusivas y concurrentes reconocidas por la
  Constitución y la ley, y en dicho marco prestar los servicios públicos y
  construir la obra pública cantonal correspondiente con criterios de calidad,
  eficacia y eficiencia, observando los principios de universalidad,
  accesibilidad, regularidad, continuidad, solidaridad, interculturalidad,
  subsidiariedad, participación y equidad.
  i) Implementar el derecho al hábitat y a la vivienda y desarrollar planes y
  programas de vivienda de interés social en el territorio cantonal.
  k) Regular, prevenir y controlar la contaminación ambiental en el territorio
  cantonal de manera articulada con las políticas ambientales nacionales.
  r) Fomentar actividades orientadas a cuidar, proteger y conservar el patrimonio
  cultural y memoria social en el campo de la interculturalidad y diversidad.

EVIDENCIA:
  - POA-con-ejecución-por-función
  - Informes-rendición-de-cuentas
  - PDOT-con-seguimiento-de-metas
  - LOTAIP-Numeral-10

CONSECUENCIA:
  descripcion: >
    El incumplimiento de cualquiera de las 20 funciones del Art. 54 constituye
    omisión institucional. El literal e) es especialmente crítico: el seguimiento
    permanente y la rendición de cuentas son obligatorios — no opcionales.
    Base legal de todos los indicadores de gestión del TGI.
  tipo: observacion-cpccs
  organo_sancionador:
    - DPE
    - CPCCS
    - CGE

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal]
  condicion: []
  ambito_lac: >
    Catálogo de funciones municipales en toda LAC. El literal f) (prestar servicios
    con universalidad, accesibilidad, continuidad) es el mandato de servicio público
    territorial que QUIRA mide a través del TGI en cada competencia.

IMPLEMENTACION_TERRITORIAL:
  funcion_publica: >
    Las 20 funciones del Art. 54 son las obligaciones de resultado permanentes
    del GAD Municipal. A diferencia de las competencias (CE_264 / COOTAD_55),
    las funciones describen el CÓMO debe actuar el GAD: con equidad,
    universalidad, accesibilidad, continuidad y rendición de cuentas permanente.
    El literal e) crea la obligación de seguimiento y rendición de cuentas
    que justifica el TGI como instrumento de gobernanza preventiva.
  actor_local: >
    pendiente — verificar Resolución Orgánica GADM Montecristi.
    QNKC-001: las funciones son permanentes; las unidades internas que las ejecutan
    son contingentes.
  instrumento: POA + PDOT + Sistema-rendición-cuentas-permanente
  evidencia:
    - LOTAIP_19_12
    - Informes-seguimiento-PDOT
    - Auditorías-CGE
  indicador:
    - DOM01_FUNCIONES_CUMPLIDAS_PCT
    - DOM07_RENDICION_CUENTAS_REALIZADA

DOMINIOS_QUIRA:
  - Dom01
  - Dom04
  - Dom07
  - Dom02

RELACIONES:
  - CE_264
  - COOTAD_55
  - COOTAD_215
  - LOTAIP_19_12

META:
  estado: v1.2
  fecha_extraccion: "2026-05-30"
  extractor: QLEP-v1.2
  revisado_por_experto: false

