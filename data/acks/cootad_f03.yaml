ACK_ID: COOTAD_215
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Presupuesto Ajustado PDyOT Participativo Territorializado
FUENTE:
  norma: Código Orgánico de Organización Territorial, Autonomía y Descentralización
  sigla: COOTAD
  jerarquia: 1
  articulo: "215"
  inciso: ""
  fecha_vigencia: "2010-10-19"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Concejo-Municipal

ACTOR_BENEFICIARIO:
  - Ciudadanía-cantonal
  - Parroquias-rurales

OBLIGACION: >
  El presupuesto de los gobiernos autónomos descentralizados se ajustará a los
  planes regionales, provinciales, cantonales y parroquiales respectivos, en el
  marco del Plan Nacional de Desarrollo, sin menoscabo de sus competencias y
  autonomía. El presupuesto deberá ser elaborado participativamente, de acuerdo
  con lo prescrito por la Constitución y la ley. Las inversiones presupuestarias
  se ajustarán a los planes de desarrollo de cada circunscripción, los mismos
  que serán TERRITORIALIZADOS para garantizar la equidad a su interior. Todo
  programa o proyecto financiado con recursos públicos tendrá objetivos, metas
  y plazos, al término del cual serán evaluados.

EVIDENCIA:
  - Presupuesto-con-articulación-POA-PDOT
  - Informes-seguimiento-metas-PDOT
  - Territorializacion-inversiones-por-parroquia
  - LOTAIP-Numeral-10-planes-en-ejecución

CONSECUENCIA:
  descripcion: >
    El presupuesto aprobado sin articulación al PDOT viola el Art. 215. La
    territorialización es OBLIGATORIA — el IRS=79.7 que concentra el 79.7%
    de la inversión en Montecristi urbana viola directamente la cláusula de
    "territorializar para garantizar la equidad interior". La CGE puede observar
    el presupuesto y el POA por falta de territorialización. Base jurídica más
    directa de la alerta Dom04 por brecha rural de $1,791,935.
  tipo: glosa-cge
  organo_sancionador:
    - CGE
    - DPE
    - CPCCS

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal, GAD-Provincial, GAD-Parroquial]
  condicion: []
  ambito_lac: >
    Articulación presupuesto-planificación con territorialización en toda LAC.
    Colombia: POT + Plan de Desarrollo Municipal articulados (Ley 388/97).
    Perú: PDC territorializados (MEF + DNPP guías).
    México: Plan Municipal de Desarrollo como rector del presupuesto.

IMPLEMENTACION_TERRITORIAL:
  funcion_publica: >
    El presupuesto DEBE distribuirse con equidad territorial interna.
    La territorialización es la operación que conecta el dinero público con
    las parroquias que lo necesitan — sin territorialización, la planificación
    es un documento sin consecuencia en el territorio.
    IRS=79.7 = violación directa de este mandato de equidad interior.
  actor_local: >
    Alcalde (Art. 60.g elabora proforma) + Concejo Municipal (Art. 57.g aprueba).
    Director Financiero: responsable técnico de la territorialización.
    QNKC-001: la función (territorializar inversiones) es permanente; el actor interno es contingente.
  instrumento: POA-territorializado + PDOT + Sistema-seguimiento-parroquial
  evidencia:
    - Inversión-por-parroquia-reportada
    - IRS-calculado-y-publicado
    - Informes-seguimiento-PDOT
  indicador:
    - DOM04_IRS_INDICE_REGRESIVIDAD
    - DOM02_EJECUCION_PRESUPUESTARIA
    - DOM09_ALINEACION_POA_PDOT
  gap_conocido: >
    IRS=79.7 (Montecristi Mar-2026): 79.7% de la inversión se concentra en la
    cabecera cantonal. Brecha rural estimada: $1,791,935. Fuente: Gold Master v5.5.
    Este valor viola simultáneamente COOTAD_215 + COOTAD_228.

DOMINIOS_QUIRA:
  - Dom02
  - Dom04
  - Dom09

