ACK_ID: COOTAD_192
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Transferencias Automáticas 21 Pct 10 Pct Criterio NBI
FUENTE:
  norma: Código Orgánico de Organización Territorial, Autonomía y Descentralización
  sigla: COOTAD
  jerarquia: 1
  articulo: "192"
  inciso: ""
  fecha_vigencia: "2010-10-19"

ACTOR_OBLIGADO:
  - Gobierno-Central
  - GAD-Municipal

ACTOR_BENEFICIARIO:
  - GAD-Municipal
  - Territorio-cantonal

OBLIGACION: >
  Los gobiernos autónomos descentralizados participarán del veintiún por ciento
  (21%) de ingresos permanentes y del diez por ciento (10%) de los no permanentes
  del presupuesto general del Estado.
  El monto total a transferir se distribuirá: 27% para Consejos Provinciales;
  67% para Municipios y Distritos Metropolitanos; 6% para Juntas Parroquiales.
  El total de recursos se distribuirá conforme a criterios constitucionales:
  tamaño y densidad de la población; necesidades básicas insatisfechas (NBI)
  jerarquizadas en relación con la población residente; logros en el mejoramiento
  de los niveles de vida; esfuerzo fiscal y administrativo; y cumplimiento de
  metas del Plan Nacional de Desarrollo y del plan de desarrollo del GAD.

EVIDENCIA:
  - SIGEF-transferencias-automáticas-recibidas
  - Gold-Master-TGI-presupuesto-ingresos
  - Certificados-SENPLADES-NBI-cantonal

CONSECUENCIA:
  descripcion: >
    El Gobierno Central que retenga o retrase las transferencias automáticas viola
    el Art. 192 + Art. 6 COOTAD (garantía de autonomía). El GAD puede reclamar
    ante la PGE y el Ministerio de Finanzas. El criterio NBI implica que cantones
    con mayor pobreza relativa deben recibir más — base para que Montecristi
    actualice y comunique su NBI parroquial ante SENPLADES.
  tipo: ninguna
  organo_sancionador:
    - PGE
    - Ministerio-de-Finanzas
    - Corte-Constitucional

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal, GAD-Provincial, GAD-Parroquial]
  condicion: []
  ambito_lac: >
    Transferencias intergubernamentales con criterios de equidad en toda LAC.
    Colombia: Sistema General de Participaciones (SGP) — Ley 715/2001.
    Perú: Foncomun (Fondo de Compensación Municipal) — Ley 29062.
    México: Fondo General de Participaciones + Fondo de Aportaciones — LCF.
    El criterio NBI/pobreza como factor redistributivo es análogo en toda la región.

DOMINIOS_QUIRA:
  - Dom02
  - Dom04

RELACIONES:
  - CE_238
  - COOTAD_3
  - COOTAD_193
  - COOTAD_198
  - COPLAFIP

