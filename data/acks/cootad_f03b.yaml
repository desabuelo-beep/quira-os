ACK_ID: COOTAD_304
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Sistema Participación Ciudadana Presupuesto Participativo Obligatorio
FUENTE:
  norma: Código Orgánico de Organización Territorial, Autonomía y Descentralización
  sigla: COOTAD
  jerarquia: 1
  articulo: "304"
  inciso: "1-8"
  fecha_vigencia: "2010-10-19"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Concejo-Municipal

ACTOR_BENEFICIARIO:
  - Ciudadanía-cantonal
  - Comunidades-rurales
  - Parroquias-con-NBI-alto

OBLIGACION: >
  Los gobiernos autónomos descentralizados conformarán un sistema de
  participación ciudadana, que tendrá una estructura y denominación propias,
  para las siguientes finalidades:
  1. Deliberar sobre las prioridades de desarrollo de sus circunscripciones.
  2. Participar en la formulación, ejecución, seguimiento y evaluación del PDOT.
  3. ELABORAR PRESUPUESTOS PARTICIPATIVOS de los gobiernos.
  4. Participar en la definición de políticas públicas.
  5. Generar mecanismos de coordinación para temas sectoriales o sociales.
  6. FORTALECER LA DEMOCRACIA LOCAL con transparencia, rendición de cuentas y
  control social permanente.
  7. Promover el involucramiento ciudadano en decisiones territoriales.
  8. Impulsar mecanismos de formación ciudadana activa.

EVIDENCIA:
  - Ordenanza-sistema-participación-aprobada
  - Actas-asambleas-presupuesto-participativo
  - Presupuesto-participativo-ejecutado-por-parroquia
  - Informes-seguimiento-PDOT-con-participación

CONSECUENCIA:
  descripcion: >
    El GAD que no conforme el Sistema de Participación Ciudadana viola el Art. 304.
    El numeral 3 (presupuesto participativo) es especialmente crítico: el PP
    es la herramienta más directa para reducir el IRS=79.7 — si las parroquias
    rurales definen prioridades, la concentración urbana se corrige.
    El CPCCS y la DPE pueden verificar el cumplimiento del sistema participativo.
  tipo: observacion-cpccs
  organo_sancionador:
    - CPCCS
    - DPE

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal, GAD-Provincial, GAD-Parroquial]
  condicion: []
  ambito_lac: >
    Presupuesto participativo con base legal en toda LAC.
    Colombia: Ley 1757/2015 + Decreto 1082/2015 (mecanismos participación).
    Perú: Ley 28056 Marco del Presupuesto Participativo — obligatorio para
    gobiernos regionales y locales.
    México: Ley de Participación Ciudadana (Ciudad de México + estados) — PP
    municipal en varios estados.
    Ecuador es uno de los más robustos en LAC: PP tiene base en COOTAD + CPFP.

IMPLEMENTACION_TERRITORIAL:
  funcion_publica: >
    Conformar y operar un sistema de participación ciudadana que incluya
    obligatoriamente el presupuesto participativo (PP). El PP es el instrumento
    territorial que conecta la voluntad ciudadana con la inversión pública.
    La corrección del IRS=79.7 requiere PP por parroquia: las comunidades rurales
    deben poder deliberar y decidir sobre la inversión que les corresponde.
  actor_local: >
    pendiente — verificar Resolución Orgánica GADM Montecristi.
    Típicamente: Unidad de Participación Ciudadana o Dirección equivalente.
    Consejo Cantonal de Planificación: órgano participativo con mandato COOTAD_300.
    QNKC-001: la función (PP + participación) es permanente; el actor es contingente.
  instrumento: Ordenanza-participación + PP-por-parroquia + Consejo-Planificación
  evidencia:
    - Actas-PP-por-parroquia
    - Inversión-priorizada-por-PP-ejecutada
    - Informe-sistema-participativo-anual
  indicador:
    - DOM08_PARTICIPACION_CIUDADANA
    - DOM04_IRS_INDICE_REGRESIVIDAD
    - DOM08_PP_EJECUTADO_PCT
  gap_conocido: >
    IRS=79.7: 79.7% de la inversión en cabecera cantonal → evidencia de PP
    ausente o inoperante en parroquias rurales. El PP por parroquia es la
    corrección estructural que QUIRA puede facilitar con datos territoriales.

DOMINIOS_QUIRA:
  - Dom08
  - Dom04
  - Dom02

RELACIONES:
  - COOTAD_300
  - COOTAD_302
  - COOTAD_215
  - COOTAD_228
  - CPFP_45
  - LOPC

