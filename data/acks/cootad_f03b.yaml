ACK_ID: COOTAD_302
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Participación Ciudadana Rendición de Cuentas Permanente GAD
FUENTE:
  norma: Código Orgánico de Organización Territorial, Autonomía y Descentralización
  sigla: COOTAD
  jerarquia: 1
  articulo: "302"
  inciso: ""
  fecha_vigencia: "2010-10-19"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Concejo-Municipal

ACTOR_BENEFICIARIO:
  - Ciudadanía-cantonal
  - Organizaciones-sociales
  - Comunidades-rurales

OBLIGACION: >
  La ciudadanía podrá participar de manera protagónica en la toma de decisiones,
  la planificación y gestión de los asuntos públicos y en el control social de
  las instituciones de los GADs y de sus representantes, en un proceso permanente
  de construcción del poder ciudadano. Las autoridades ejecutivas y legislativas
  de los GADs tendrán la OBLIGACIÓN de establecer un sistema de rendición de
  cuentas a la ciudadanía conforme el mandato de la ley y de sus propias normativas.

EVIDENCIA:
  - Informe-rendición-cuentas-presentado
  - Actas-asambleas-participativas
  - Sistema-participación-ciudadana-activo

CONSECUENCIA:
  descripcion: >
    La omisión del sistema de rendición de cuentas es incumplimiento del Art. 302.
    El CPCCS puede evaluar y sancionar la falta de rendición de cuentas.
    Complementa la obligación del Art. 11 LOTAIP (informe anual DPE).
  tipo: observacion-cpccs
  organo_sancionador:
    - CPCCS
    - DPE

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal, GAD-Provincial, GAD-Parroquial]
  condicion: []
  ambito_lac: >
    Rendición de cuentas obligatoria de autoridades locales en toda LAC.
    Colombia: Ley 850/2003 Veedurías Ciudadanas + Ley 1757/2015 Participación.
    Perú: Ley 26300 (participación ciudadana) + Transparencia Municipal.
    México: Ley General de Contabilidad Gubernamental + Informes de Gobierno.

DOMINIOS_QUIRA:
  - Dom08
  - Dom07
  - Dom01

RELACIONES:
  - COOTAD_304
  - LOTAIP_11
  - LOTAIP_19_12
  - CE_264

