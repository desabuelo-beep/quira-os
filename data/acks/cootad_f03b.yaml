ACK_ID: COOTAD_300
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Consejo Planificación Resolución Favorable Requisito Indispensable PDOT
FUENTE:
  norma: Código Orgánico de Organización Territorial, Autonomía y Descentralización
  sigla: COOTAD
  jerarquia: 1
  articulo: "300"
  inciso: ""
  fecha_vigencia: "2010-10-19"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Concejo-Municipal
  - Consejo-de-Planificación-Cantonal

ACTOR_BENEFICIARIO:
  - Ciudadanía-cantonal
  - Organizaciones-sociales

OBLIGACION: >
  Los consejos de planificación participativa de los gobiernos autónomos
  descentralizados participarán en el proceso de formulación, seguimiento y
  evaluación de sus planes y emitirán RESOLUCIÓN FAVORABLE sobre las prioridades
  estratégicas de desarrollo como REQUISITO INDISPENSABLE para su aprobación
  ante el órgano legislativo correspondiente. Los consejos de planificación
  estarán presididos por sus máximos representantes. Su conformación y
  atribuciones serán definidas por la ley (CPFP).

EVIDENCIA:
  - Resolución-favorable-Consejo-Planificación
  - Acta-Consejo-Planificación-sobre-PDOT
  - PDOT-con-resolución-adjunta

CONSECUENCIA:
  descripcion: >
    El PDOT aprobado por el Concejo sin la resolución favorable previa del Consejo
    de Planificación es legalmente inválido. Este control participativo es la
    primera línea de legitimidad del PDyOT. Un PDOT sin esta resolución puede
    ser impugnado ante la Corte Constitucional o la Contraloría.
  tipo: nulidad
  organo_sancionador:
    - Corte-Constitucional
    - CGE

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal, GAD-Provincial, GAD-Parroquial]
  condicion: []
  ambito_lac: >
    Consejos o instancias de planificación participativa en toda LAC.
    Colombia: Consejo Territorial de Planeación (Ley 152/1994) — concepto
    previo obligatorio sobre el Plan de Desarrollo.
    Perú: Consejo de Coordinación Local (LOM 27972 Art. 98) — participación
    en formulación del PDC.
    México: COPLADEMUN — comité de planeación democrática municipal.
    La resolución/concepto previo participativo es el patrón LAC estándar.

DOMINIOS_QUIRA:
  - Dom09
  - Dom02
  - Dom08

RELACIONES:
  - CE_241
  - COOTAD_57
  - COOTAD_304
  - CPFP_29

