# F0.3b — COOTAD — Artículos Críticos Pendientes
# GAP 10% + Sistema Participativo (Arts. 249 + 300-304)
# QLEP v1.2 | Extracción: 2026-05-30
# Átomos: 4 | Estado: completo
#
# NOTA ARQUITECTÓNICA:
# Arts. 295-299 COOTAD → DEROGADOS por RO 790 (5-jul-2016).
# La planificación participativa técnica migró al CPFP (Arts. 28-50).
# COOTAD conserva los DERECHOS y PRINCIPIOS (Arts. 300-304).
# CPFP regula el PROCEDIMIENTO Y METODOLOGÍA.
# Referencias a COOTAD_295/299 deben leerse como COOTAD_300 + CPFP_28.
#
# CIRCUITO JURÍDICO CLAVE (identificado en auditoría Sprint F0):
# CE_35 (derecho GAP) → CE_11_3 (prioridad) → COOTAD_249 (10% obligatorio) → Dom12
# Este es uno de los circuitos causales más importantes de QUIRA.

---
ACK_ID: COOTAD_249
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Presupuesto 10 Pct Grupos Atención Prioritaria Ingresos No Tributarios
FUENTE:
  norma: Código Orgánico de Organización Territorial, Autonomía y Descentralización
  sigla: COOTAD
  jerarquia: 1
  articulo: "249"
  inciso: ""
  fecha_vigencia: "2010-10-19"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Director-Financiero-GADM
  - Concejo-Municipal

ACTOR_BENEFICIARIO:
  - Grupos-de-Atención-Prioritaria
  - Adultos-mayores
  - Personas-con-discapacidad
  - Niñas-niños-adolescentes
  - Mujeres-embarazadas
  - Pueblos-y-nacionalidades
  - Personas-privadas-de-libertad
  - Personas-en-movilidad-humana

OBLIGACION: >
  Sin perjuicio de las asignaciones que consten en el presupuesto general del Estado,
  los gobiernos autónomos descentralizados municipales y metropolitanos destinarán
  a los grupos de atención prioritaria NO MENOS DEL DIEZ POR CIENTO (10%) del
  presupuesto de sus ingresos no tributarios para el financiamiento de políticas
  sociales locales de los grupos de atención prioritaria, de acuerdo a los planes
  y programas de ejecución y en coordinación con las entidades rectoras.

EVIDENCIA:
  - Presupuesto-con-partida-GAP-10-pct-mínimo
  - Cédulas-presupuestarias-ingresos-no-tributarios
  - POA-con-programas-GAP
  - Gold-Master-TGI-presupuesto-GAP-pct
  - LOTAIP-Numeral-6-presupuesto-ejecutado

CONSECUENCIA:
  descripcion: >
    El GAD que no destine el 10% mínimo a GAP en su presupuesto viola el Art. 249.
    La CGE puede detectarlo en auditoría de ejecución presupuestaria y emitir glosa.
    El DPE puede activar acción por vulneración de derechos de grupos prioritarios.
    El incumplimiento afecta el Patronato Municipal si no recibe el financiamiento
    mínimo constitucional. Base de todos los indicadores Dom12 del TGI.
  tipo: glosa-cge
  organo_sancionador:
    - CGE
    - DPE
    - CPCCS

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal]
  condicion: []
  ambito_lac: >
    Asignación presupuestaria obligatoria a grupos vulnerables en toda LAC.
    Colombia: Ley 1148/2007 (adulto mayor) + Ley 1618/2013 (discapacidad) —
    obligaciones de gasto social municipal pero sin porcentaje fijo universal.
    Perú: Presupuesto por resultados con programas presupuestales para grupos
    vulnerables (PP 0049, 0058, 0080).
    México: Ley General de Inclusión de las Personas con Discapacidad + LGDS —
    mandatos de gasto social sin porcentaje fijo constitucional.
    La regla del 10% ecuatoriana es más explícita que el resto de LAC.

IMPLEMENTACION_TERRITORIAL:
  funcion_publica: >
    Financiar políticas sociales locales para todos los subgrupos GAP del cantón
    con al menos el 10% de los ingresos no tributarios del GADM.
    La función es permanente: existe independientemente de si el instrumento
    ejecutor es el Patronato, una Dirección de Bienestar Social, o convenios
    con el MIES/MSP/MAATE.
    Esta es la base financiera del circuito causal:
    CE_35 → CE_11.3 → COOTAD_249 → [actor local] → Dom12.
  actor_local: >
    pendiente — verificar Resolución Orgánica GADM Montecristi.
    Típicamente: Patronato Municipal de Amparo Social (si existe) + Dirección GAP.
    Gold Master v5.5: Patronato Municipal Montecristi registrado como entidad
    del Holding con financiamiento propio. Verificar % del presupuesto GADM
    que corresponde a ingresos no tributarios para calcular el 10% mínimo.
    QNKC-001: la función GAP es permanente; el actor ejecutor es contingente.
  instrumento: POA-GAP + Presupuesto-10pct + Convenio-MIES + Convenio-MSP
  evidencia:
    - LOTAIP_19_6
    - Cédulas-presupuestarias-GAP
    - Informes-Patronato-Municipal
    - Gold-Master-Ti-Patronato
  indicador:
    - DOM12_PRESUPUESTO_GAP_PCT
    - DOM12_IGD_GAP
    - DOM12_TI_PATRONATO
  nota_lac: >
    Ecuador: 10% ingresos no tributarios (Art. 249 COOTAD) — mandato explícito.
    Colombia: Ley 1276/2009 (centros vida adulto mayor) — asignación por habitante.
    Perú: Foncomun con uso social orientado pero sin porcentaje fijo para GAP.
    México: LGDS Art. 48 — municipios deben reportar gasto social pero sin %.
    La especificidad del 10% ecuatoriano es una ventaja para QUIRA:
    el cumplimiento es verificable con una comparación presupuestaria simple.
  gap_conocido: >
    Gold Master v5.5: Ti Patronato verificado. Verificar que el presupuesto del
    Patronato + programas GAP directos del GADM superen el 10% de ingresos no
    tributarios. El incumplimiento es el gap Dom12 más fácilmente cuantificable.

DOMINIOS_QUIRA:
  - Dom12
  - Dom02
  - Dom04

RELACIONES:
  - CE_35
  - CE_11
  - CE_264
  - COOTAD_54
  - LOTAIP_19_6

META:
  estado: v1.2
  fecha_extraccion: "2026-05-30"
