ACK_ID: LOD_58
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: GAD dicta ordenanzas de accesibilidad universal — espacios públicos y estacionamientos tarifados

FUENTE:
  norma: Ley Orgánica de Discapacidades
  sigla: LOD
  jerarquia: 1
  articulo: "58"
  inciso: ""
  fecha_vigencia: "2012-09-25"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Concejo-Municipal

ACTOR_BENEFICIARIO:
  - Personas con discapacidad
  - Ciudadanía en general

OBLIGACION: >
  En toda obra pública y privada de acceso público, urbana o rural, deben preverse accesos,
  medios de circulación, información e instalaciones adecuadas para personas con discapacidad.
  Los gobiernos autónomos descentralizados DEBEN dictar las ordenanzas respectivas para el
  cumplimiento de este derecho, de conformidad con las normas de accesibilidad del INEN.
  En los sistemas de estacionamiento tarifados creados por los GADs: se destinará un porcentaje
  de parqueaderos claramente identificados (señalización y color) para personas con discapacidad.
  El porcentaje mínimo de parqueos accesibles es el 2% del total de parqueos regulares
  de la edificación o zona tarifada.

EVIDENCIA:
  - Ordenanza Municipal de Accesibilidad Universal (obligatoria — norma expresamente manda dictarla)
  - Normas INEN 2293, 2245, 2246, 2247 (accesibilidad en edificaciones y espacio público)
  - Catastro de obras públicas con cumplimiento de accesibilidad verificado
  - Inspecciones de obras municipales con visto bueno de accesibilidad
  - Sistema de estacionamiento tarifado — señalización de espacios accesibles

CONSECUENCIA:
  descripcion: >
    La no emisión de la ordenanza de accesibilidad constituye omisión directa del mandato legal.
    El Concejo Municipal y el Alcalde tienen responsabilidad institucional por la omisión.
    La persona con discapacidad puede ejercer acción de protección (CE Art. 88).
    El CONADIS puede sancionar administrativamente al GAD (LOD Art. 563).
  tipo: accion-constitucional
  organo_sancionador:
    - CONADIS
    - DPE
    - Judicatura

APLICABILIDAD:
  nacional: false
  municipal: true
  condicion:
    - ninguna
  # La obligación de dictar la ordenanza es expresa y sin condición

DOMINIOS_QUIRA:
  - Dom12
  - Dom04
  - Dom01

RELACIONES:
  - CE_35
  - CE_47
  - LOD_47
  - LOD_56
  - COOTAD_57
  - COOTAD_55

VIGENCIA:
  estado: vigente

IMPLEMENTACION_TERRITORIAL:
  funcion_publica: >
    Garantía de accesibilidad universal en el espacio público cantonal — eliminación de
    barreras físicas, de información y de comunicación para personas con discapacidad
    en todos los bienes de uso público del GAD Municipal.
  actor_local: >
    Montecristi: Dirección de Obras Públicas / Planificación Urbana.
    Verificar si existe Ordenanza de Accesibilidad vigente en Montecristi.
    Si no existe, la Ordenanza es un instrumento normativo pendiente de alta prioridad.
  instrumento: Ordenanza-Municipal
  evidencia:
    - Ordenanza de accesibilidad universal GADMCM (verificar existencia)
    - Permisos de construcción con inspección de accesibilidad
  indicador:
    - pendiente — TGI Dom12 puede incluir: existencia de ordenanza accesibilidad (binario)

