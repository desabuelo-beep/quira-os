ACK_ID: LOD_56
CLASE: ACK_OBLIGACION
TIPO: competencia_concurrente
NOMBRE: GAD implementa programas de vivienda accesible para personas con discapacidad

FUENTE:
  norma: Ley Orgánica de Discapacidades
  sigla: LOD
  jerarquia: 1
  articulo: "56"
  inciso: ""
  fecha_vigencia: "2012-09-25"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Estado (autoridad nacional de vivienda)

ACTOR_BENEFICIARIO:
  - Personas con discapacidad
  - Familias de personas con discapacidad

OBLIGACION: >
  La autoridad nacional encargada de vivienda y los gobiernos autónomos descentralizados
  implementarán, diseñarán y ejecutarán programas de vivienda que permitan a las personas
  con discapacidad acceso prioritario y oportuno a una vivienda adecuada.
  Los programas de vivienda para personas con discapacidad deberán incluir facilidades
  de acceso y condiciones que les permita procurar su mayor grado de autonomía.
  Los GADs también prestarán facilidades en el otorgamiento de créditos para adquisición,
  construcción, adecuación o remodelación de vivienda (Art. 57).

EVIDENCIA:
  - POA — programas o convenios de vivienda accesible
  - Catastro municipal — registros de vivienda adaptada
  - Convenios con MIDUVI o entidades de vivienda
  - Ordenanzas de construcción — requisitos de accesibilidad

CONSECUENCIA:
  descripcion: >
    La omisión de programas de vivienda accesible activa responsabilidad administrativa
    del servidor competente. La persona con discapacidad puede ejercer acción de protección
    (CE Art. 88) por violación del derecho a vivienda digna (CE Art. 30).
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - DPE
    - Judicatura

APLICABILIDAD:
  nacional: false
  municipal: true
  condicion:
    - ninguna

DOMINIOS_QUIRA:
  - Dom12
  - Dom04

RELACIONES:
  - CE_35
  - CE_30
  - LOD_58
  - LOD_47
  - COOTAD_55

VIGENCIA:
  estado: vigente

