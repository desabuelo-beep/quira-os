# Propósito: Completar Dom12 — obligaciones GAD en inclusión laboral y accesibilidad
# ============================================================

ACK_ID: LOD_47
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Inclusión laboral obligatoria — 4% de trabajadores con discapacidad (empleadores ≥25)

FUENTE:
  norma: Ley Orgánica de Discapacidades
  sigla: LOD
  jerarquia: 1
  articulo: "47"
  inciso: ""
  fecha_vigencia: "2012-09-25"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Director-RR-HH

ACTOR_BENEFICIARIO:
  - Personas con discapacidad en el cantón
  - Sector laboral

OBLIGACION: >
  El empleador público o privado que cuente con un número mínimo de veinticinco (25)
  trabajadores está obligado a contratar un mínimo del cuatro por ciento (4%) de personas
  con discapacidad en labores permanentes. El trabajo asignado deberá ser acorde a sus
  capacidades, potencialidades y talentos.
  Para el personal de Cuerpos de Bomberos y Policías Municipales, el cálculo del 4%
  se realiza únicamente sobre la nómina del personal administrativo, excluyendo
  funciones operativas.
  Contratos no permanentes se excluyen del cálculo.

EVIDENCIA:
  - Nómina de personal GAD Municipal — percentaje de trabajadores con discapacidad
  - Carnet de discapacidad (CONADIS) de trabajadores incluidos
  - Informe de CONADIS — seguimiento inclusión laboral sector público
  - Resoluciones de nombramiento / contratos del personal con discapacidad

CONSECUENCIA:
  descripcion: >
    Incumplimiento del 4% es infracción expresa (LOD Art. 563). Sanción: multa.
    El CONADIS puede iniciar proceso administrativo sancionatorio.
    Si el incumplimiento es sistemático, aplica responsabilidad administrativa
    del Director de Talento Humano (LOC-CGE_45).
  tipo: multa
  organo_sancionador:
    - CONADIS
    - CGE

APLICABILIDAD:
  nacional: false
  municipal: true
  condicion:
    - ninguna
  # Aplica cuando la nómina del GAD ≥ 25 trabajadores — invariablemente en GADMCM

DOMINIOS_QUIRA:
  - Dom12
  - Dom05

RELACIONES:
  - CE_35
  - CE_11_3
  - LOD_58
  - LOC-CGE_45

VIGENCIA:
  estado: vigente

META:
  estado: v1.4
  fecha_extraccion: "2026-05-30"
  extractor: QLEP-v1.4
  revisado_por_experto: true

