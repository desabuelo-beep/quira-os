ACK_ID: LOC-CGE_9
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Control interno — definición, elementos y responsabilidad institucional

FUENTE:
  norma: Ley Orgánica de la Contraloría General del Estado
  sigla: LOC-CGE
  jerarquia: 1
  articulo: "9"
  inciso: ""
  fecha_vigencia: "2015-12-18"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Director

ACTOR_BENEFICIARIO:
  - Estado Ecuatoriano
  - CGE

OBLIGACION: >
  El control interno constituye un proceso aplicado por la máxima autoridad,
  la dirección y el personal de cada institución que proporciona seguridad
  razonable de que se protegen los recursos públicos y se alcanzan los
  objetivos institucionales. Constituyen elementos del control interno: el
  entorno de control, la organización, la idoneidad del personal, el
  cumplimiento de los objetivos institucionales, los riesgos institucionales
  en el logro de tales objetivos y las medidas adoptadas para afrontarlos,
  el sistema de información, el cumplimiento de las normas jurídicas y
  técnicas, y la corrección oportuna de las deficiencias de control. El
  control interno será responsabilidad de cada institución del Estado, y
  tendrá como finalidad primordial crear las condiciones para el ejercicio
  del control externo a cargo de la CGE.

EVIDENCIA:
  - Reglamento Orgánico de Gestión Organizacional por Procesos
  - Mapa de riesgos institucional actualizado
  - Manual de descripción y clasificación de puestos
  - Sistema de información institucional (SIGAD, eSIGEF integrados)
  - Código de ética institucional

CONSECUENCIA:
  descripcion: >
    Ausencia del sistema de control interno es causal directo de
    responsabilidad administrativa culposa (LOC-CGE Art. 45, numeral 6:
    "no establecer o no aplicar con sujeción a esta Ley los subsistemas
    de control interno y control externo"). Activa glosa si genera perjuicio
    económico. En GADM: D5=baja capacidad institucional es síntoma observable
    de control interno deficiente (NCI 200-02, 200-04).
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - CGE

VIGENCIA:
  estado: vigente

DOMINIOS_QUIRA:
  - Dom01
  - Dom03
  - Dom05

RELACIONES:
  - LOC-CGE_5
  - LOC-CGE_12
  - LOC-CGE_45
  - NCI_GEN_CI
  - NCI_200_02
  - NCI_300

