---
ACK_ID: LOC-CGE_5
CLASE: ACK_PRINCIPIO
TIPO: principio
NOMBRE: Sistema de control — 4 obligaciones de cada institución del Estado

FUENTE:
  norma: Ley Orgánica de la Contraloría General del Estado
  sigla: LOC-CGE
  jerarquia: 1
  articulo: "5"
  inciso: ""
  fecha_vigencia: "2015-12-18"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Concejo

ACTOR_BENEFICIARIO:
  - Ciudadanía
  - Estado Ecuatoriano
  - CGE

OBLIGACION: >
  Las instituciones del Estado actuarán dentro del Sistema de Control,
  Fiscalización y Auditoría del Estado, cuya aplicación propenderá a que:
  (1) dignatarios, autoridades, funcionarios y servidores públicos se
  responsabilicen y rindan cuenta pública sobre el ejercicio de sus
  atribuciones y la utilización de los recursos públicos;
  (2) las atribuciones y objetivos de las instituciones y los deberes y
  obligaciones de sus servidores sean cumplidos a cabalidad;
  (3) cada institución asuma la responsabilidad por la existencia y
  mantenimiento de su propio sistema de control interno; y
  (4) se coordine y complemente con la acción de otros órganos de control
  externo sobre el sector público y sus servidores.

EVIDENCIA:
  - Sistema de control interno institucional documentado
  - Informes de rendición de cuentas
  - Informe anual de autoevaluación del control interno

CONSECUENCIA:
  descripcion: >
    Incumplimiento de cualquiera de las 4 obligaciones activa responsabilidad
    administrativa culposa (LOC-CGE Art. 45) en la máxima autoridad y
    directivos. La ausencia de control interno es causa autónoma de glosa si
    origina perjuicio económico al Estado (LOC-CGE Art. 52-53).
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - CGE

VIGENCIA:
  estado: vigente

DOMINIOS_QUIRA:
  - Dom01
  - Dom07

RELACIONES:
  - CE_226
  - CE_233
  - LOC-CGE_9
  - LOC-CGE_45
  - NCI-CGE

