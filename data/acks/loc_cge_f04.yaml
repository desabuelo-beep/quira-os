ACK_ID: LOC-CGE_21
CLASE: ACK_PRINCIPIO
TIPO: principio
NOMBRE: Auditoría de gestión — economía, efectividad y eficiencia como criterios evaluativos

FUENTE:
  norma: Ley Orgánica de la Contraloría General del Estado
  sigla: LOC-CGE
  jerarquia: 1
  articulo: "21"
  inciso: ""
  fecha_vigencia: "2015-12-18"

ACTOR_OBLIGADO:
  - CGE
  - Unidad-Auditoria-Interna

ACTOR_BENEFICIARIO:
  - Estado Ecuatoriano
  - Ciudadanía

OBLIGACION: >
  La Auditoría de Gestión es la acción fiscalizadora dirigida a examinar y
  evaluar el control interno y la gestión, utilizando recursos humanos de
  carácter multidisciplinario, el desempeño de una institución, ente
  contable, o la ejecución de programas y proyectos, con el fin de determinar
  si dicho desempeño se está realizando de acuerdo a principios y criterios
  de economía, efectividad y eficiencia. Este tipo de auditoría examinará y
  evaluará los resultados originalmente esperados y medidos de acuerdo con
  los indicadores institucionales y de desempeño pertinentes. Constituirán
  objeto de la auditoría de gestión: el proceso administrativo, las
  actividades de apoyo, financieras y operativas; la eficiencia, efectividad
  y economía en el empleo de los recursos humanos, materiales, financieros,
  ambientales, tecnológicos y de tiempo; y, el cumplimiento de las
  atribuciones, objetivos y metas institucionales.

EVIDENCIA:
  - Indicadores de gestión institucional (TGI, POA, PDOT)
  - Informes de avance de POA vs. metas
  - Evaluaciones de desempeño institucional

CONSECUENCIA:
  descripcion: >
    La auditoría de gestión es el instrumento que la CGE utiliza para
    evaluar el TGI del GADM: el IRS=79.7 (equidad territorial), D3=59.85%
    (ejecución), D5 (capacidad institucional) son exactamente los
    "resultados originalmente esperados y medidos de acuerdo con los
    indicadores de desempeño pertinentes" que este artículo mandatas auditar.
    Si la CGE realiza una auditoría de gestión al GADM con los datos actuales,
    encontraría causales de LOC-CGE Art. 45 en múltiples frentes.
  tipo: ninguna
  organo_sancionador:
    - CGE

VIGENCIA:
  estado: vigente

DOMINIOS_QUIRA:
  - Dom01
  - Dom04
  - Dom07

RELACIONES:
  - LOC-CGE_5
  - LOC-CGE_45
  - CE_226
  - COOTAD_215

