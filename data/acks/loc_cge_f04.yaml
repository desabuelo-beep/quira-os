ACK_ID: LOC-CGE_12
CLASE: ACK_OBLIGACION
TIPO: procedimiento
NOMBRE: Tiempos de control — previo, continuo y posterior con UAI

FUENTE:
  norma: Ley Orgánica de la Contraloría General del Estado
  sigla: LOC-CGE
  jerarquia: 1
  articulo: "12"
  inciso: ""
  fecha_vigencia: "2015-12-18"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Servidores-Responsables
  - Unidad-Auditoria-Interna

ACTOR_BENEFICIARIO:
  - Estado Ecuatoriano

OBLIGACION: >
  El ejercicio del control interno se aplicará en forma previa, continua y
  posterior. Control previo: los servidores analizarán las actividades
  propuestas antes de su autorización o ejecución, respecto a su legalidad,
  veracidad, conveniencia, oportunidad, pertinencia y conformidad con los
  planes y presupuestos institucionales. Control continuo: los servidores
  inspeccionarán y constatarán en forma continua la oportunidad, calidad y
  cantidad de obras, bienes y servicios recibidos o prestados de conformidad
  con la ley, los términos contractuales y las autorizaciones respectivas.
  Control posterior: la unidad de auditoría interna será responsable del
  control posterior interno ante las respectivas autoridades y se aplicará a
  las actividades institucionales, con posterioridad a su ejecución.

EVIDENCIA:
  - Certificaciones presupuestarias previas al compromiso
  - Actas de recepción de bienes y servicios (control continuo)
  - Informes anuales de la Unidad de Auditoría Interna
  - PAT (Plan Anual de Trabajo) de la UAI

CONSECUENCIA:
  descripcion: >
    Omisión del control previo activa LOC-CGE Art. 45 numeral 8 (contraer
    compromisos sin sujetarse a los dictámenes de la ley o insistir
    ilegalmente en una orden objetada por el control previo). La ausencia de
    UAI activa LOC-CGE Art. 45 numeral 6 (no establecer control interno).
    En GADM: D3=59.85% ejecución presupuestaria baja puede indicar deficiencias
    en el control previo al compromiso (NCI 402-02).
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - CGE

VIGENCIA:
  estado: vigente

DOMINIOS_QUIRA:
  - Dom01
  - Dom02
  - Dom03

RELACIONES:
  - LOC-CGE_9
  - LOC-CGE_14
  - LOC-CGE_45
  - NCI_PRE_COMPROMISO
  - NCI_PRE_DEVENGADO
  - NCI_600_01

