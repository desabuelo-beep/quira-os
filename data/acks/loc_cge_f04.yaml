# Bloque Control — Parte A: LOC-CGE
# Norma: Ley Orgánica de la Contraloría General del Estado
# Sigla: LOC-CGE
# RO: Suplemento 595 (12-jun-2002) · Última reforma: 18-dic-2015
# Jerarquía: 1 (Ley Orgánica)
# Ámbito GAD Municipal: TOTAL (Art. 2 remite al Art. 225 CE — GADs incluidos)
# Extractor: QLEP-v1.3 · Fecha: 2026-05-30
# Nota: Esta ley crea el SISTEMA DE CONTROL; las NCI (Acuerdo 039-CG-2009)
#        crean las NORMAS OPERATIVAS. Ambas son obligatorias para el GADM.
# Nota: No confundir LOC-CGE Art. 45 (causales resp. admin) con LOSEP Art. 42
#        (sanciones). La CGE determina la responsabilidad; LOSEP ejecuta la sanción.
# Circuitos causales activados:
#   LOC-CGE_45 → LOTAIP_19_12 (accountability) → TGI Dom01
#   LOC-CGE_53 → Glosa → Coactiva → ONT-RISK.Glosa
