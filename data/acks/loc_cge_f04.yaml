ACK_ID: LOC-CGE_53
CLASE: ACK_OBLIGACION
TIPO: procedimiento
NOMBRE: Predeterminación — glosa y 60 días para contestar responsabilidad civil culposa

FUENTE:
  norma: Ley Orgánica de la Contraloría General del Estado
  sigla: LOC-CGE
  jerarquia: 1
  articulo: "53"
  inciso: ""
  fecha_vigencia: "2015-12-18"

ACTOR_OBLIGADO:
  - CGE
  - Alcalde
  - Servidor-Publico

ACTOR_BENEFICIARIO:
  - Estado Ecuatoriano

OBLIGACION: >
  La responsabilidad civil culposa se determinará en forma privativa por la
  Contraloría General del Estado cuando por los resultados de la auditoría
  gubernamental se hubiere determinado que se ha causado perjuicio económico
  al Estado o a sus instituciones. El perjuicio se establece mediante la
  predeterminación o glosa de responsabilidad civil culposa, que será
  notificada a las personas implicadas (servidores públicos o personas
  naturales/jurídicas de derecho privado), concediéndoles el plazo de
  sesenta días para que las contesten y presenten las pruebas correspondientes.
  Expirado este plazo, la CGE expedirá su resolución. En caso de pago
  indebido, se emitirá orden de reintegro con plazo de 90 días.
  La resolución confirmatoria ejecutoriada se ejecuta mediante jurisdicción
  coactiva (Art. 57).

EVIDENCIA:
  - Notificación de la predeterminación de responsabilidad civil (glosa)
  - Contestación a la glosa dentro de 60 días
  - Resolución de la CGE (confirmatoria o derogatoria)
  - Comprobante de pago o título de crédito en coactiva

CONSECUENCIA:
  descripcion: >
    Si no se contesta en 60 días → la CGE expide resolución directa. Si la
    resolución es confirmatoria y no se paga → coactiva con título de crédito
    (Art. 57). Además de la glosa, el servidor incurre en responsabilidad
    administrativa (LOC-CGE Art. 45) que puede activar sanción de destitución.
    Los indicios de responsabilidad penal (peculado, concusión) se remiten a
    Fiscalía (Arts. 65-67 LOC-CGE + COIP).
    BRECHAS GADMCM: contratos ejecutados sin acta de recepción o con
    sobreprecio son el tipo de hechos que activan glosas. D3=59.85% con
    elevada concentración de contratos en Q4 (diciembre) es patrón de riesgo.
  tipo: glosa-cge
  organo_sancionador:
    - CGE

VIGENCIA:
  estado: vigente

DOMINIOS_QUIRA:
  - Dom01
  - Dom02
  - Dom03

RELACIONES:
  - LOC-CGE_42
  - LOC-CGE_45
  - LOC-CGE_52
  - LOTAIP_19_12
  - LOSNCP

