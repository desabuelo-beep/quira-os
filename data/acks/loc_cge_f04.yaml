CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Aplicación del control interno — funciones incompatibles y reglamento orgánico en RO

FUENTE:
  norma: Ley Orgánica de la Contraloría General del Estado
  sigla: LOC-CGE
  jerarquia: 1
  articulo: "11"
  inciso: ""
