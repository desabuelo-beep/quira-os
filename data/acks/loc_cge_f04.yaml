ACK_ID: LOC-CGE_45
CLASE: ACK_OBLIGACION
TIPO: sancion
NOMBRE: Responsabilidad administrativa culposa — 14 causales con multa de 1 a 20 RBU

FUENTE:
  norma: Ley Orgánica de la Contraloría General del Estado
  sigla: LOC-CGE
  jerarquia: 1
  articulo: "45"
  inciso: ""
  fecha_vigencia: "2015-12-18"

ACTOR_OBLIGADO:
  - Alcalde
  - Director
  - Servidor-Publico

ACTOR_BENEFICIARIO:
  - Estado Ecuatoriano
  - CGE

OBLIGACION: >
  La responsabilidad administrativa culposa de las autoridades, dignatarios,
  funcionarios y servidores de las instituciones del Estado se establecerá a
  base del análisis documentado del grado de inobservancia de las
  disposiciones legales relativas al asunto de que se trate, y sobre el
  incumplimiento de las atribuciones, funciones, deberes y obligaciones que
  les competen por razón de su cargo. Incurren en responsabilidad
  administrativa culposa quienes: (1) no establezcan ni apliquen indicadores
  de gestión para evaluar la gestión institucional o el rendimiento individual;
  (2) cometan abuso en el ejercicio del cargo; (3) permitan la violación de
  la ley, normas específicas o de carácter obligatorio; (4) exijan o reciban
  dinero o recompensas por cumplir sus funciones o por otorgar contratos;
  (5) no establezcan o apliquen los subsistemas de determinación/recaudación,
  presupuesto, tesorería, crédito público y contabilidad gubernamental;
  (6) no establezcan o apliquen los subsistemas de control interno y externo;
  (7) no establezcan o apliquen los sistemas de planificación, administración
  de bienes y servicios, inversiones públicas, talento humano y gestión
  financiera; (8) contraigan compromisos en contravención con normas legales
  o insistan ilegalmente en una orden objetada por el control previo;
  (9) no tomen acciones correctivas necesarias en conocimiento del informe
  del auditor interno o externo; (10) no proporcionen oportunamente la
  información pertinente ni presten la colaboración requerida a los auditores
  gubernamentales; (11) incurran en ilegal determinación o recaudación de
  ingresos; (12) no efectúen el ingreso oportuno de cualquier recurso
  financiero recibido; (13) dispongan o ejecuten sin atribución el cambio de
  planes, programas y estipulaciones relativas a contratos; y, (14) las demás
  previstas en otras normas legales vigentes. La sanción será multa de una
  a veinte remuneraciones básicas unificadas del trabajador del sector
  privado (Art. 46), sin perjuicio de responsabilidad civil o penal.

EVIDENCIA:
  - Resolución de la CGE determinando responsabilidad
  - Informe de auditoría gubernamental con hallazgos
  - Documentación del proceso disciplinario

CONSECUENCIA:
  descripcion: >
    Multa de 1 a 20 RBU (Art. 46). Ejecutada por la autoridad nominadora a
    requerimiento de la CGE. Si el sujeto es la propia máxima autoridad,
    la CGE la impone directamente. No exime de responsabilidad civil (glosa)
    ni penal (COIP peculado/enriquecimiento ilícito). La CGE concede hasta
    30 días de defensa antes de imponer la destitución.
    BRECHAS GADMCM: (1) D3=59.85% sugiere posibles incumplimientos del
    causal 8 (compromisos sin POA) y causal 5 (presupuesto). (2) IRS=79.7
    activa causal 7 (no aplicar sistema de planificación equitativo). (3)
    Ausencia de mapa de riesgos activaría causal 6 (sin control interno).
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - CGE

VIGENCIA:
  estado: vigente

DOMINIOS_QUIRA:
  - Dom01
  - Dom02
  - Dom03
  - Dom07

RELACIONES:
