ACK_ID: LOC-CGE_14
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Auditoría interna — obligatoriedad en instituciones del Estado cuando se justifique

FUENTE:
  norma: Ley Orgánica de la Contraloría General del Estado
  sigla: LOC-CGE
  jerarquia: 1
  articulo: "14"
  inciso: ""
  fecha_vigencia: "2015-12-18"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde

ACTOR_BENEFICIARIO:
  - CGE
  - Estado Ecuatoriano

OBLIGACION: >
  Las instituciones del Estado contarán con una Unidad de Auditoría Interna
  cuando se justifique, que dependerá técnica y administrativamente de la
  Contraloría General del Estado. El personal auditor será nombrado, removido
  o trasladado por el Contralor General del Estado. Las remuneraciones y
  gastos para el funcionamiento de las unidades de auditoría interna serán
  cubiertos por las propias instituciones del Estado a las que sirven y
  controlan. Las remuneraciones que corresponden a las máximas autoridades de
  las Unidades de Auditoría Interna de los Gobiernos Autónomos
  Descentralizados serán cubiertas por la Contraloría General del Estado.
  La auditoría interna se ejecutará de acuerdo con las normas nacionales e
  internacionales de auditoría aplicables al sector público.

EVIDENCIA:
  - UAI activa con jefe designado por CGE
  - PAT (Plan Anual de Trabajo UAI) presentado a CGE antes del 30-sep
  - Informes de UAI dirigidos a la máxima autoridad
  - Presupuesto asignado a funcionamiento de UAI

CONSECUENCIA:
  descripcion: >
    Ausencia de UAI cuando se justifica activa LOC-CGE Art. 45 numeral 6
    (no establecer control interno). En un GAD del tamaño de Montecristi,
    la UAI se justifica claramente por volumen presupuestario del Holding
    Municipal. La ausencia de UAI activa implica control posterior
    ausente, lo que deja al GAD sin capacidad de auto-detectar irregularidades
    antes de que la CGE realice un examen especial.
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - CGE

VIGENCIA:
  estado: vigente

DOMINIOS_QUIRA:
  - Dom01
  - Dom05

RELACIONES:
  - LOC-CGE_12
  - LOC-CGE_45
  - NCI_600_01
  - NCI_200_02

