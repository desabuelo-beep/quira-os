ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Director-Financiero

ACTOR_BENEFICIARIO:
  - Estado Ecuatoriano

OBLIGACION: >
  Se tendrán en cuenta las normas sobre funciones incompatibles, depósito
  intacto e inmediato de lo recaudado, otorgamiento de recibos, pagos con
  cheque o mediante la red bancaria, distinción entre ordenadores de gasto
  y ordenadores de pago; y, el reglamento orgánico funcional que será
  publicado en el Registro Oficial.

