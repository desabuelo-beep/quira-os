ACK_ID: LOSEP_4
CLASE: ACK_PRINCIPIO
TIPO: distribucion
NOMBRE: Ámbito LOSEP — GADs como Empleadores del Régimen de Servicio Público

FUENTE:
  norma: Ley Orgánica del Servicio Público
  sigla: LOSEP
  jerarquia: 1
  articulo: "4"
  inciso: ""
  fecha_vigencia: "2010-10-06"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Concejo-Municipal

ACTOR_BENEFICIARIO:
  - Servidoras y servidores públicos municipales
  - Ciudadanía (garantía de servicio profesional e imparcial)

OBLIGACION: >
  La LOSEP se aplica a todas las servidoras y servidores de las instituciones del Estado,
  incluyendo los Gobiernos Autónomos Descentralizados. Los GADs están obligados a regir
  todas sus relaciones laborales con el personal de planta conforme a las disposiciones
  de la LOSEP: ingreso por concurso de méritos y oposición, evaluación periódica del
  desempeño, régimen remunerativo establecido, y régimen disciplinario con garantías
  del debido proceso. Las personas que prestan servicios ocasionales o por contrato
  de servicios profesionales tienen un régimen diferenciado.

EVIDENCIA:
  - Contratos de nombramiento del personal municipal
  - Resoluciones de concursos de méritos GADMCM
  - ROL de pagos en SIGEF
  - Informes de evaluación de desempeño
  - Nómina institucional publicada (LOTAIP_19_6)

CONSECUENCIA:
  descripcion: >
    La contratación de personal fuera del régimen LOSEP (sin concurso, con categorías
    distintas a las establecidas, o sin proceso de evaluación) genera nulidad del
    nombramiento. Responsabilidad administrativa del Alcalde como máxima autoridad
    nominadora y del Director de Talento Humano que instrumenta el proceso.
  tipo: nulidad
  organo_sancionador:
    - MinTrabajo-SENRES
    - CGE
    - PGE

APLICABILIDAD:
  nacional: true
  municipal: true
  condicion:
    - Todo GAD Municipal como empleador de servicio público

OBSERVA_CAPA: "C1"

DOMINIOS_QUIRA:
  - Dom05
  - Dom01

RELACIONES:
  - CE_225
  - CE_229
  - COOTAD_54
  - LOSEP_22
  - LOSEP_42

VIGENCIA:
  estado: vigente

CADENA_TERRITORIAL:
  circuito_id: H4_INSTITUCION_EJECUCION
  capa_inicio: "C1"
  capa_fin: "C3"
  servicio_publico: >
    Servicio público municipal prestado por funcionarios con régimen jurídico-laboral
    profesional, garantía de institucionalidad y capacidad de ejecución.
  proceso_referencia: >
    Clasificación de puestos → convocatoria concurso → méritos y oposición →
    nombramiento → inducción → evaluación desempeño periódica → régimen LOSEP.
  indicador_referencia: >
    TGI Dom05 — porcentaje personal con nombramiento regular / personal con
    evaluación al día. Dom01 — actos administrativos de personal conformes a LOSEP.

IMPLEMENTACION_LOCAL:
  actor_local: >
    pendiente — Director/a de Talento Humano GADMCM (autoridad nominadora delegada
    por el Alcalde para gestión del recurso humano)
  institucion_local: >
    GAD-Municipal-Montecristi — Dirección de Talento Humano
  fuente_organica: >
    Resolución Orgánica GADMCM — competencias Dirección Talento Humano /
    Reglamento Interno de Administración de Talento Humano GADMCM

META:
  estado: v1.5
  fecha_extraccion: "2026-05-30"
  extractor: QLEP-v1.5
  revisado_por_experto: true

