ACK_ID: LOSEP_43
ID_ANTERIOR: LOSEP_42   # 2026-09-18: las sanciones son el Art. 43; el 42 tipifica las faltas
CLASE: ACK_OBLIGACION
TIPO: sancion
NOMBRE: Régimen Disciplinario — Escala de Sanciones al Servidor Público

FUENTE:
  norma: Ley Orgánica del Servicio Público
  sigla: LOSEP
  jerarquia: 1
  articulo: "43"
  huella_corpus: 153ac8c56e96
  concordancia: "LOSEP 42 · ee1ddaec4efc — faltas disciplinarias"
  inciso: ""
  fecha_vigencia: "2010-10-06"

ACTOR_OBLIGADO:
  - Alcalde (autoridad nominadora)
  - Director-Talento-Humano (instructor del sumario)

ACTOR_BENEFICIARIO:
  - Estado-Ecuatoriano (disciplina institucional)
  - Ciudadanía (garantía servicio libre de abusos)

OBLIGACION: >
  [TEXTO LITERAL · LOSEP Art. 43 · corpus 153ac8c56e96] Las sanciones disciplinarias por
  orden de gravedad son las siguientes: Amonestación verbal; Amonestación escrita; Sanción
  pecuniaria administrativa; Suspensión temporal sin goce de remuneración; y, Destitución.
  […] La sanción pecuniaria administrativa o multa no excederá el monto del diez por ciento
  de la remuneración, y se impondrá por reincidencia en faltas leves en el cumplimiento de
  sus deberes. […]
  [Corrección 2026-09-18: antes se citaba el Art. 42 (faltas). Las afirmaciones sobre la
  CGE y el Tribunal Contencioso no constan en el Art. 43 y se retiran hasta verificarlas.]

EVIDENCIA:
  - Sumario administrativo iniciado con notificación al servidor
  - Resolución motivada de sanción emitida por el nominador
  - Expediente de personal actualizado con sanción registrada
  - Informe CGE que determina responsabilidad (cuando aplica)
  - Sentencias de Tribunales Contencioso-Administrativo (impugnaciones)

CONSECUENCIA:
  descripcion: >
    Este artículo ES el instrumento sancionatorio activado por múltiples normas del corpus:
    violaciones LOTAIP (Art. 42 → sanciones LOSEP), incumplimientos de recomendaciones CGE
    (LOC-CGE_45), infracciones LOSNCP_106, faltas al régimen presupuestario (COOTAD_215),
    y cualquier falta grave del servidor. La destitución impide reingreso al servicio público.
    El peculado además genera responsabilidad penal (COIP).
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - Alcalde-Nominador
    - Tribunales-Contencioso-Administrativo

APLICABILIDAD:
  nacional: true
  municipal: true
  condicion:
    - Todo servidor municipal sujeto a proceso disciplinario

OBSERVA_CAPA: "C6"

DOMINIOS_QUIRA:
  - Dom05
  - Dom01

RELACIONES:
  - LOC-CGE_45
  - LOTAIP_42
  - CE_229
  - CE_233
  - LOSEP_3
  - LOSNCP_106

VIGENCIA:
  estado: vigente

CADENA_TERRITORIAL:
  circuito_id: H4_INSTITUCION_EJECUCION
  capa_inicio: "C6"
  capa_fin: "C6"
  servicio_publico: >
    Disciplina institucional como condición necesaria de integridad y capacidad
    de ejecución del servicio público municipal.
  proceso_referencia: >
    Detección de falta → apertura sumario → instrucción y due process →
    resolución del nominador → ejecución sanción → registro expediente personal.
  indicador_referencia: >
    TGI Dom05 — sumarios iniciados y resueltos / tasa de cumplimiento de
    recomendaciones CGE. Dom01 — densidad de la cadena de responsabilidades
    institucionales (núcleo QNKC-002 Actor lateral).

IMPLEMENTACION_LOCAL:
  actor_local: >
    pendiente — Alcalde (autoridad nominadora) / Director/a de Talento Humano
    (instructor del sumario administrativo) / Procurador/a Síndico (asesoría jurídica)
  institucion_local: >
    GAD-Municipal-Montecristi — Alcaldía / Dirección de Talento Humano /
    Procuraduría Síndica Municipal
  fuente_organica: >
    Resolución Orgánica GADMCM que delega instrucción de sumarios /
    Reglamento Interno de Administración de Talento Humano

META:
  estado: v1.5
  fecha_extraccion: "2026-05-30"
  extractor: QLEP-v1.5
  revisado_por_experto: false

