# Ámbito GAD Municipal: TOTAL — todos los servidores municipales bajo régimen público
# Atoms:     3 (Art.4 · Art.22 · Art.42)
# Propósito: Completar Dom05 — talento humano como capa institucional del GAD
#            Resolver forward references (LOSEP_23, LOSEP_43 referenciados en 15+ átomos)
#            Densificar circuito H4_INSTITUCION_EJECUCION
# ============================================================
# Nota arquitectónica QNKC-002: El servidor público (Actor lateral) ejecuta procesos C4
# pero NO es parte de la cadena causal. La LOSEP define el marco jurídico (C1-C2) y el
# régimen de control (C6) de los Actores. La responsabilidad formal del servidor es el
# enlace entre la obligación institucional y la consecuencia real.
