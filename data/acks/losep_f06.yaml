ACK_ID: LOSEP_22
CLASE: ACK_DERECHO
TIPO: derecho
NOMBRE: Derechos de las Servidoras y Servidores Públicos Municipales

FUENTE:
  norma: Ley Orgánica del Servicio Público
  sigla: LOSEP
  jerarquia: 1
  articulo: "22"
  inciso: ""
  fecha_vigencia: "2010-10-06"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Director-Talento-Humano

ACTOR_BENEFICIARIO:
  - Servidoras y servidores municipales

OBLIGACION: >
  [PENDIENTE VERIFICACIÓN LITERAL — Art. 22 LOSEP] Las servidoras y servidores públicos
  tienen derecho a: (a) desempeñar sus funciones en un entorno de trabajo adecuado;
  (b) percibir una remuneración justa, proporcional a su función, eficiencia y
  responsabilidades, y en ningún caso inferior a los mínimos establecidos; (c) contar
  con vacaciones, descanso semanal y licencias con goce de remuneración conforme a la ley;
  (d) recibir prestaciones sociales y del IESS; (e) no ser removido sino con apego
  a la ley y con garantías del debido proceso; (f) recibir capacitación y formación
  continua. El GAD como empleador está obligado a garantizar el ejercicio efectivo de
  estos derechos.

EVIDENCIA:
  - ROL de pagos y registro de remuneraciones en SIGEF
  - Registro de vacaciones, licencias y permisos
  - Planillas de afiliación IESS
  - Ausencia de sumarios sin apertura de debido proceso
  - Registros de capacitación del personal

CONSECUENCIA:
  descripcion: >
    La violación de los derechos de los servidores municipales activa acción de protección
    (CE Art. 88), recurso de apelación ante Tribunal de lo Contencioso Administrativo
    y puede motivar demanda de daños y perjuicios. El Alcalde y Director de Talento
    Humano incurren en responsabilidad personal por la omisión.
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - Tribunales-Contencioso-Administrativo
    - DPE
    - MinTrabajo

APLICABILIDAD:
  nacional: true
  municipal: true
  condicion:
    - Todo servidor municipal bajo régimen LOSEP

OBSERVA_CAPA: "C3"

DOMINIOS_QUIRA:
  - Dom05

RELACIONES:
  - CE_226
  - CE_227
  - CE_229
  - LOSEP_4
  - LOSEP_42

VIGENCIA:
  estado: vigente

CADENA_TERRITORIAL:
  circuito_id: H4_INSTITUCION_EJECUCION
  capa_inicio: "C1"
  capa_fin: "C3"
  servicio_publico: >
    Garantía de condiciones laborales justas para el servidor municipal, fundamento
    de la capacidad institucional para ejecutar servicios públicos de calidad.
  proceso_referencia: >
    Reconocimiento de derechos → gestión de nómina correcta → afiliación IESS →
    evaluación clima laboral → indicadores de capacidad institucional Dom05.
  indicador_referencia: >
    TGI Dom05 — índice de rotación / ausentismo / sumarios iniciados vs. derechos
    reclamados. Calidad institucional = precondición de ejecución presupuestaria.

IMPLEMENTACION_LOCAL:
  actor_local: >
    pendiente — Director/a de Talento Humano GADMCM
  institucion_local: >
    GAD-Municipal-Montecristi — Dirección de Talento Humano
  fuente_organica: >
    Reglamento Interno de Administración de Talento Humano GADMCM

META:
  estado: v1.5
  fecha_extraccion: "2026-05-30"
  extractor: QLEP-v1.5
  revisado_por_experto: false

