ACK_ID: LOSNCP_21
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Plan Anual de Contratación — Obligación y Publicación

FUENTE:
  norma: Ley Orgánica del Sistema Nacional de Contratación Pública
  sigla: LOSNCP
  jerarquia: 1
  articulo: "21"
  inciso: ""
  fecha_vigencia: "2008-08-04"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Director-Contratacion-Publica

ACTOR_BENEFICIARIO:
  - Proveedores-Estado
  - Ciudadanía
  - SERCOP

OBLIGACION: >
  Las entidades contratantes, incluyendo los GADs Municipales, tienen la obligación de
  elaborar, aprobar y publicar el Plan Anual de Contratación (PAC) hasta el 15 de enero
  de cada año. El PAC debe ser publicado en el portal institucional de la entidad y en
  el Portal del Sistema Nacional de Contratación Pública (SERCOP). Toda reforma al PAC
  requiere resolución motivada de la máxima autoridad institucional. Sin PAC aprobado
  y publicado, la entidad no puede iniciar ningún proceso de contratación durante el
  ejercicio fiscal.

EVIDENCIA:
  - PAC publicado en portal SERCOP (compraspublicas.gob.ec)
  - Resolución de aprobación del PAC firmada por Alcalde
  - LOTAIP_19_21 — publicación PAC en portal institucional
  - Acta de Concejo aprobando PAC si corresponde

CONSECUENCIA:
  descripcion: >
    La no publicación o publicación tardía del PAC impide legalmente iniciar procesos
    de contratación. Activa responsabilidad administrativa del servidor responsable.
    La CGE y el SERCOP pueden impugnar procesos iniciados sin PAC vigente. La LOTAIP_42
    activa las sanciones LOSEP correspondientes al Director de Contratación y al Alcalde.
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - CGE
    - SERCOP

APLICABILIDAD:
  nacional: true
  municipal: true
  condicion:
    - Entidades contratantes con presupuesto asignado en el ejercicio fiscal

OBSERVA_CAPA: "C4"

DOMINIOS_QUIRA:
  - Dom03
  - Dom07

RELACIONES:
  - LOTAIP_19_21
  - COOTAD_304
  - COOTAD_198
  - LOSNCP_22
  - NCI_200_04

VIGENCIA:
  estado: vigente

CADENA_TERRITORIAL:
  circuito_id: H3_CONTRATACION_PARTICIPACION
  capa_inicio: "C2"
  capa_fin: "C7"
  servicio_publico: >
    Publicación del Plan Anual de Contratación como instrumento de transparencia
    y planificación del gasto municipal ante ciudadanía y proveedores.
  proceso_referencia: >
    Elaboración PAC enero → aprobación máxima autoridad → publicación SERCOP
    → publicación LOTAIP_19_21 → inicio procesos contractuales autorizados.
  indicador_referencia: >
    TGI Dom03 — PAC publicado en plazo / alineación PAC vs. compromisos participativos.
    TGI Dom07 — cumplimiento LOTAIP_19_21 (transparencia contratación).

IMPLEMENTACION_LOCAL:
  actor_local: >
    pendiente — Director/a de Contratación Pública GADMCM
  institucion_local: >
    GAD-Municipal-Montecristi — Dirección de Contratación Pública
  fuente_organica: >
    Resolución Orgánica GADMCM — funciones Dirección de Contratación

META:
  estado: v1.5
  fecha_extraccion: "2026-05-30"
  extractor: QLEP-v1.5
  revisado_por_experto: true

