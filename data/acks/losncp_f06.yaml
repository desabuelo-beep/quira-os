ACK_ID: LOSNCP_106
CLASE: ACK_OBLIGACION
TIPO: sancion
NOMBRE: Infracciones de proveedores en la contratación pública

FUENTE:
  norma: Ley Orgánica del Sistema Nacional de Contratación Pública
  sigla: LOSNCP
  jerarquia: 1
  articulo: "106"
  huella_corpus: 17169232de61
  inciso: ""
  fecha_vigencia: "2008-08-04"

ACTOR_OBLIGADO:
  - SERCOP
  - CGE

ACTOR_BENEFICIARIO:
  - Estado-Ecuatoriano
  - Ciudadanía

OBLIGACION: >
  [TEXTO LITERAL · LOSNCP Art. 106 · corpus 17169232de61] A más de las previstas en la ley,
  se tipifican como infracciones realizadas por un proveedor, a las siguientes conductas:
  No actualizar la información en el Registro Único de Proveedores dentro del término de
  diez días de producida la modificación; Participar en uno o más procedimientos de
  contratación, sin estar habilitado en el Registro Único de Proveedores […]
  [Corrección 2026-09-18: el artículo tipifica infracciones de PROVEEDORES; la versión
  anterior lo extendía a servidores públicos y a la CGE, lo que el texto no dice.]

EVIDENCIA:
  - Resolución SERCOP de suspensión del RUP
  - Acto administrativo sancionatorio emitido
  - Informe CGE sobre irregularidades contractuales
  - Sentencia judicial (si corresponde — peculado contractual)

CONSECUENCIA:
  descripcion: >
    Las infracciones en contratación pública activan: (a) responsabilidad administrativa
    → LOSEP_43 para el servidor público; (b) responsabilidad civil → LOC-CGE_21 glosa
    para el patrimonio personal; (c) responsabilidad penal → Fiscalía/Judicatura para
    peculado o concusión. La suspensión del RUP impide al proveedor contratar con el
    Estado mientras dure la sanción.
  tipo: sancion-penal
  organo_sancionador:
    - SERCOP
    - CGE
    - Fiscalía
    - Judicatura

APLICABILIDAD:
  nacional: true
  municipal: true
  condicion:
    - Todo proceso de contratación municipal sujeto a LOSNCP

OBSERVA_CAPA: "C6"

DOMINIOS_QUIRA:
  - Dom03
  - Dom01

RELACIONES:
  - CE_233
  - LOC-CGE_45
  - LOSEP_43
  - LOSNCP_22
  - LOSNCP_23

VIGENCIA:
  estado: vigente

CADENA_TERRITORIAL:
  circuito_id: H3_CONTRATACION_PARTICIPACION
  capa_inicio: "C6"
  capa_fin: "C6"
  servicio_publico: >
    Control ex-post de la integridad del proceso de contratación pública municipal
    como garantía de uso correcto de recursos públicos.
  proceso_referencia: >
    Auditoría CGE → detección infracción → informe con responsabilidades determinadas
    → sanción SERCOP (RUP) / sumario LOSEP / acción penal Fiscalía.
  indicador_referencia: >
    TGI Dom03 — porcentaje contratos con irregularidades identificadas en auditorías.
    TGI Dom01 — índice de responsabilidades determinadas y ejecutadas.

IMPLEMENTACION_LOCAL:
  actor_local: >
    pendiente — Director de Contratación / Asesor Jurídico GADMCM (gestión del expediente
    ante SERCOP / CGE en caso de sanción)
  institucion_local: >
    GAD-Municipal-Montecristi — Dirección de Contratación / Procuraduría Síndica
  fuente_organica: >
    Resolución Orgánica GADMCM — funciones Asesoría Jurídica y Contratación

META:
  estado: v1.5
  fecha_extraccion: "2026-05-30"
  extractor: QLEP-v1.5
  revisado_por_experto: false

