ACK_ID: LOSNCP_23
ID_ANTERIOR: LOSNCP_22   # 2026-09-18: los estudios son el Art. 23; el 22 es el PAC
CLASE: ACK_OBLIGACION
TIPO: procedimiento
NOMBRE: Estudios — requisitos previos al procedimiento precontractual

FUENTE:
  norma: Ley Orgánica del Sistema Nacional de Contratación Pública
  sigla: LOSNCP
  jerarquia: 1
  articulo: "23"
  huella_corpus: 3cd06a225dc5
  concordancia: "LOSNCP 24 · c18eee97ef76 — certificación de disponibilidad presupuestaria previa a la convocatoria"
  inciso: ""
  fecha_vigencia: "2008-08-04"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Director-Contratacion-Publica
  - Director-Tecnico-responsable

ACTOR_BENEFICIARIO:
  - Estado-Ecuatoriano
  - Ciudadanía

OBLIGACION: >
  [TEXTO LITERAL · LOSNCP Art. 23 · corpus 3cd06a225dc5] Antes de iniciar un procedimiento
  precontractual, de acuerdo a la naturaleza de la contratación, la entidad deberá contar
  con los estudios y diseños completos, definitivos y actualizados, planos y cálculos,
  especificaciones técnicas, debidamente aprobados por las instancias correspondientes,
  vinculados al Plan Anual de Contratación de la entidad. […]
  [CONCORDANCIA · LOSNCP Art. 24 · corpus c18eee97ef76] Las entidades previamente a la
  convocatoria, deberán certificar la disponibilidad presupuestaria y la existencia
  presente o futura de recursos suficientes para cubrir las obligaciones derivadas de la
  contratación.
  [Corrección 2026-09-18: antes se citaba el Art. 22 (que es el PAC) marcado «pendiente de
  verificación literal»; la glosa y la responsabilidad personal no constan en estos
  artículos — se retiran de la obligación.]

EVIDENCIA:
  - Estudios de factibilidad y estudios técnicos previos
  - Diseños definitivos aprobados
  - Presupuesto referencial documentado en expediente
  - Certificación presupuestaria emitida por Director Financiero
  - Expediente de contratación completo

CONSECUENCIA:
  descripcion: >
    La contratación sin estudios previos y presupuesto referencial válido puede ser
    declarada nula por la CGE y generar glosa. El servidor que inicia el proceso sin
    los requisitos previos incurre en responsabilidad administrativa (LOSEP_43) y civil
    (LOC-CGE). La PGE puede emitir pronunciamiento sobre la nulidad del contrato.
  tipo: nulidad
  organo_sancionador:
    - CGE
    - SERCOP
    - PGE

APLICABILIDAD:
  nacional: true
  municipal: true
  condicion:
    - Todo proceso de contratación independientemente del monto y modalidad

OBSERVA_CAPA: "C4"

DOMINIOS_QUIRA:
  - Dom03
  - Dom02

RELACIONES:
  - LOSNCP_22
  - COOTAD_215
  - NCI_200_04
  - LOC-CGE_21
  - NCI_PRE_DEVENGADO

VIGENCIA:
  estado: vigente

CADENA_TERRITORIAL:
  circuito_id: H7_INVERSION_TERRITORIAL
  capa_inicio: "C4"
  capa_fin: "C4"
  servicio_publico: >
    Proceso de contratación de obra pública, bienes o servicios para materializar
    la inversión planificada en el POA/PAC con respaldo técnico y financiero.
  proceso_referencia: >
    PAC aprobado → estudios previos → presupuesto referencial → certificación
    presupuestaria → publicación proceso SERCOP → adjudicación → suscripción contrato.
  indicador_referencia: >
    TGI Dom03 — porcentaje expedientes de contratación completos vs. observados CGE.
    TGI Dom02 — relación inversión planificada / inversión ejecutada con documentación.

IMPLEMENTACION_LOCAL:
  actor_local: >
    pendiente — Director/a de Obras Públicas (obras civiles) / Director Contratación
    (bienes y servicios) / Director Financiero (certificación presupuestaria)
  institucion_local: >
    GAD-Municipal-Montecristi — Dirección de Obras Públicas / Dirección Contratación /
    Dirección Financiera
  fuente_organica: >
    Resolución Orgánica GADMCM — competencias Dirección OOPP y Contratación

META:
  estado: v1.5
  fecha_extraccion: "2026-05-30"
  extractor: QLEP-v1.5
  revisado_por_experto: false

