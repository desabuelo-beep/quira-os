ACK_ID: LOSNCP_22
ID_ANTERIOR: LOSNCP_21   # 2026-09-18: el PAC es el Art. 22; el 21 es el portal COMPRASPÚBLICAS
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Plan Anual de Contratación — Obligación y Publicación

FUENTE:
  norma: Ley Orgánica del Sistema Nacional de Contratación Pública
  sigla: LOSNCP
  jerarquia: 1
  articulo: "22"
  huella_corpus: 1d6c1b3ae153
  inciso: ""
  fecha_vigencia: "2008-08-04"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Director-Contratacion-Publica

ACTOR_BENEFICIARIO:
  - Proveedores-Estado
  - Ciudadanía
  - SERCOP

OBLIGACION: >
  [TEXTO LITERAL · LOSNCP Art. 22 · corpus 1d6c1b3ae153] Las Entidades Contratantes, para
  cumplir con los objetivos del Plan Nacional de Desarrollo, sus objetivos y necesidades
  institucionales, formularán el Plan Anual de Contratación con el presupuesto
  correspondiente, de conformidad a la planificación plurianual de la Institución,
  asociados al Plan Nacional de Desarrollo y a los presupuestos del Estado. El Plan será
  publicado obligatoriamente en la página Web de la Entidad Contratante dentro de los
  quince (15) días del mes de enero de cada año e interoperará con el portal
  COMPRASPÚBLICAS. […]
  [Corrección 2026-09-18: la versión anterior atribuía este contenido al Art. 21 y afirmaba
  «resolución motivada» para toda reforma y la prohibición de contratar sin PAC, que no
  constan en el Art. 22 — se retiran hasta verificarlas en el Reglamento (RLOSNCP).]

EVIDENCIA:
  - PAC publicado en portal SERCOP (compraspublicas.gob.ec)
  - Resolución de aprobación del PAC firmada por Alcalde
  - LOSNCP 22 — publicación del PAC en la página web de la entidad dentro de los quince días de enero
  - Acta de Concejo aprobando PAC si corresponde

CONSECUENCIA:
  descripcion: >
    La no publicación o publicación tardía del PAC impide legalmente iniciar procesos
    de contratación. Activa responsabilidad administrativa del servidor responsable.
    La CGE y el SERCOP pueden impugnar procesos iniciados sin PAC vigente. La LOTAIP_42
    activa las sanciones LOSEP correspondientes al Director de Contratación y al Alcalde.
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - CGE
    - SERCOP

APLICABILIDAD:
  nacional: true
  municipal: true
  condicion:
    - Entidades contratantes con presupuesto asignado en el ejercicio fiscal

OBSERVA_CAPA: "C4"

DOMINIOS_QUIRA:
  - Dom03
  - Dom07

RELACIONES:
  - LOTAIP_19_8
  - COOTAD_304
  - COOTAD_198
  - LOSNCP_23
  - NCI_200_04

VIGENCIA:
  estado: vigente

CADENA_TERRITORIAL:
  circuito_id: H3_CONTRATACION_PARTICIPACION
  capa_inicio: "C2"
  capa_fin: "C7"
  servicio_publico: >
    Publicación del Plan Anual de Contratación como instrumento de transparencia
    y planificación del gasto municipal ante ciudadanía y proveedores.
  proceso_referencia: >
    Elaboración PAC enero → aprobación máxima autoridad → publicación SERCOP
    → publicación en la página web (LOSNCP 22) → inicio procesos contractuales autorizados.
  indicador_referencia: >
    TGI Dom03 — PAC publicado en plazo / alineación PAC vs. compromisos participativos.
    TGI Dom07 — cumplimiento LOTAIP_19_8 (transparencia de la contratación).

IMPLEMENTACION_LOCAL:
  actor_local: >
    pendiente — Director/a de Contratación Pública GADMCM
  institucion_local: >
    GAD-Municipal-Montecristi — Dirección de Contratación Pública
  fuente_organica: >
    Resolución Orgánica GADMCM — funciones Dirección de Contratación

META:
  estado: v1.5
  fecha_extraccion: "2026-05-30"
  extractor: QLEP-v1.5
  revisado_por_experto: true

