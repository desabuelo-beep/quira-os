# RO:        Suplemento 395 — 04-ago-2008
# Última reforma relevante: 2020
# Ámbito GAD Municipal: TOTAL — todo el ciclo de contratación pública municipal
# Atoms:     3 (Art.22 · Art.23 · Art.106) — renumerados 2026-09-18 contra el corpus
# Propósito: Completar Dom03 — cadena de contratación pública del GAD Municipal
#            Resolver forward references existentes en corpus (LOSNCP genérico, LOSNCP_106)
#            Densificar circuitos H3 y H7
