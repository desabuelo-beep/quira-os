CONSECUENCIA:
  descripcion: >
    La ausencia de sistema de gestión documental profesional en el GADM es
    violación directa del Art. 10. La destrucción de documentos públicos activa
    responsabilidad penal. Los servidores que administren archivos son
    personalmente responsables y solidariamente.
  tipo: responsabilidad-administrativa
