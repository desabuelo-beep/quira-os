  Son sujetos obligados por la LOTAIP: a) Los organismos y dependencias de las
  funciones Legislativa, Ejecutiva, Judicial, Electoral y de Transparencia y
  Control Social; b) Los organismos electorales; c) Los organismos de control y
  regulación; d) Las entidades que integran el régimen autónomo descentralizado
