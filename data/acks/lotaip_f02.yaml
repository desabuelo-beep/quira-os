ACK_ID: LOTAIP_19
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Transparencia Activa 24 Ítems Obligatorios Actualización Mensual
FUENTE:
  norma: Ley Orgánica de Transparencia y Acceso a la Información Pública
  sigla: LOTAIP
  jerarquia: 1
  articulo: "19"
  inciso: "1-24"
  fecha_vigencia: "2023-02-07"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde

ACTOR_BENEFICIARIO:
  - Ciudadanía
  - Organizaciones-sociedad-civil
  - CGE-DPE

OBLIGACION: >
  Los sujetos obligados difundirán a través de un portal informático web la
  siguiente información mínima ACTUALIZADA MENSUALMENTE, que se la considera
  de naturaleza obligatoria. Los 24 ítems son:
  1. Estructura orgánica + base legal + metas institucionales
  2. Directorio completo + distributivo de personal
  3. Remuneraciones de todo el personal
  4. Detalle de funcionarios en licencia o comisión
  5. Servicios del GADM + horarios de atención
  6. Presupuesto anual + ejecución + liquidación presupuestaria
  7. Auditorías internas + externas (informes CGE)
  8. Contratos de obras + adjudicaciones + liquidaciones
  9. Empresas que incumplieron contratos
  10. Planes y programas en ejecución (PDyOT + PAC + POA)
  11. Contratos de crédito + deuda externa e interna
  12. Mecanismos de rendición de cuentas + indicadores de gestión
  13. Viáticos + justificativos de movilización
  14. Nombre del responsable de acceso a la información
  15. Contratos colectivos vigentes
  16. Índice de información reservada
  17. Audiencias y reuniones de autoridades electas
  18. Decisiones en reuniones (elaboración de actos administrativos)
  19. Reuniones sobre contratos públicos
  20. Reuniones sobre políticas y planes
  21. Convenios nacionales e internacionales vigentes
  22. Donativos y regalos oficiales
  23. Registro de Activos de Información
  24. Datos de cuotas laborales (discapacidad + pueblos y nacionalidades)

EVIDENCIA:
  - Portal-web-GADM-sección-LOTAIP-activa
  - Fecha-última-actualización-verificable
  - Los-24-ítems-publicados-y-accesibles

CONSECUENCIA:
  descripcion: >
    El incumplimiento de cualquiera de los 24 ítems del Art. 19 constituye
    falta grave que activa el Art. 42 LOTAIP (sanciones LOSEP hasta destitución).
    El Alcalde es personalmente responsable (Art. 39). La DPE puede iniciar
    proceso sancionatorio. El incumplimiento es MENSUAL — no publicar en un mes
    es incumplimiento en ese período.
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - DPE
    - CPCCS
    - LOSEP-sumario-administrativo

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal, GAD-Provincial, GAD-Parroquial]
  condicion: [mensual, portal-web-obligatorio]
  ambito_lac: >
    Transparencia activa obligatoria en toda LAC, aunque con distinto número
    de ítems y periodicidad. Colombia: Ley 1712/2014 Art. 9-12.
    Perú: TUO Ley 27806 Art. 5. México: LGTAIP Art. 70 (48 fracciones obligatorias).
    El principio de transparencia activa proactiva es análogo.

DOMINIOS_QUIRA:
  - Dom07
  - Dom01
  - Dom02
  - Dom03
  - Dom04
  - Dom12

RELACIONES:
