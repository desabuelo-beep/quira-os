# F0.2 — LOTAIP — Ley Orgánica de Transparencia y Acceso a la Información Pública
# Bloque: Transparencia Activa + Acceso a la Información + Obligaciones GAD
# QLEP v1.2 | Extracción: 2026-05-30
# Átomos: 14 | Estado: completo
# Fuente: LOTAIP (RO 245 — 7 de febrero de 2023, versión vigente)
#
# NOTA ARQUITECTÓNICA (QNKC-001 + QLEP v1.2b):
# DISTINCIÓN FUNDAMENTAL: LOTAIP no crea obligaciones sustantivas.
# LOTAIP crea VENTANAS OBSERVACIONALES sobre obligaciones que ya existen en CE/COOTAD.
#   - CE_12 + COOTAD_137 crean la OBLIGACIÓN de dar agua potable.
#   - LOTAIP_19_6 observa si esa obligación se ejecutó (vía presupuesto publicado).
# Los átomos LOTAIP_19_X tienen el campo OBSERVA_CAPA para clasificar qué capa observan.
# Sin este campo, QUIRA confundiría la fuente de la obligación con su ventana de verificación.
# Los átomos LOTAIP_7, 8, 9, 10, 11, 39, 42 SÍ crean obligaciones sustantivas (no observacionales).
# Los átomos LOTAIP_19_X y LOTAIP_24 son observacionales → llevan OBSERVA_CAPA.

---
ACK_ID: LOTAIP_7
CLASE: ACK_DERECHO
TIPO: derecho
NOMBRE: Derecho de Acceso a la Información Pública
FUENTE:
  norma: Ley Orgánica de Transparencia y Acceso a la Información Pública
  sigla: LOTAIP
  jerarquia: 1
  articulo: "7"
  inciso: ""
  fecha_vigencia: "2023-02-07"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Concejo-Municipal
  - Todos-los-sujetos-obligados

ACTOR_BENEFICIARIO:
  - Ciudadanía
  - Comunidades-rurales
  - Organizaciones-sociedad-civil

OBLIGACION: >
  El derecho de acceso a la información pública comprende el derecho a buscar,
  acceder, solicitar, investigar, difundir, recibir, copiar, analizar, reprocesar,
  reutilizar y redistribuir información. Toda la información producida, obtenida,
  adquirida, transformada o en posesión de los sujetos obligados es pública y
  accesible a cualquier persona en los términos y condiciones establecidos en
  la presente Ley.

EVIDENCIA:
  - Portal-web-GADM-actualizado
  - Registro-solicitudes-información-respondidas
  - LOTAIP-Numeral-23-Registro-Activos-Información

CONSECUENCIA:
  descripcion: >
    El GAD que niegue o dilate injustificadamente el acceso activa el Art. 42
    LOTAIP (sanciones LOSEP) y puede ser denunciado ante la Defensoría del Pueblo.
    La ciudadanía puede interponer acción de acceso a la información pública ante
    la Corte Constitucional.
  tipo: sancion-penal
  organo_sancionador:
    - DPE
    - Corte-Constitucional
    - CPCCS

APLICABILIDAD:
  nivel_gobierno: [GAD-Municipal, GAD-Provincial, GAD-Parroquial, Nivel-Central]
  condicion: []
  ambito_lac: >
    Derecho de acceso a la información pública en toda LAC.
    Colombia: Ley 1712/2014 (Ley de Transparencia y Acceso).
    Perú: Ley 27806 (Ley de Transparencia y Acceso a la Información).
    México: Ley General de Transparencia y Acceso a la Información (LGTAIP 2015).
    Cada país tiene su ley equivalente; el derecho es análogo.

IMPLEMENTACION_TERRITORIAL:
  funcion_publica: >
    Garantizar el ejercicio efectivo del derecho de acceso a la información para
    TODOS los habitantes del cantón, incluidas las comunidades rurales con menor
    conectividad y alfabetismo digital. La función va más allá de publicar en portal
    web — incluye la capacidad real de cualquier ciudadano de obtener información.
  actor_local: >
    pendiente — verificar Resolución Orgánica GADM Montecristi.
    Típicamente: Secretaría General o UATH como responsable LOTAIP.
    Alcalde/Alcaldesa: responsable personal según Art. 39 LOTAIP.
  instrumento: Portal-web-GADM + Atención-presencial + Sistema-solicitudes
  evidencia:
    - LOTAIP_Numeral_14
    - LOTAIP_Numeral_23
    - Registro-solicitudes-respondidas
  indicador:
    - DOM07_SOLICITUDES_RESPONDIDAS_PCT
    - DOM07_TIEMPO_RESPUESTA_DIAS
  nota_lac: >
    CE Art. 18 (derecho a información) es la fuente constitucional.
    LOTAIP Art. 7 es la regulación de ese derecho para sujetos obligados.
    Relación: CE_18 → LOTAIP_7 → LOTAIP_19 (evidencia).
  gap_conocido: >
    Parroquias rurales de Montecristi (Isabel Muentes, Joa, Guale, San Marcos):
    brecha de acceso real — NBI alto + conectividad limitada + literacidad digital baja.
    El derecho existe; el acceso efectivo es la brecha a medir en Dom07.

DOMINIOS_QUIRA:
  - Dom07
  - Dom01

RELACIONES:
  - CE_18
  - LOTAIP_9
  - LOTAIP_19
  - LOTAIP_39
  - LOTAIP_42

META:
  estado: v1.2
