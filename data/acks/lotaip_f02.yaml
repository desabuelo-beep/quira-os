OBLIGACION: >
  Todas las instituciones públicas, a través de su titular o representante legal,
  presentarán a la Defensoría del Pueblo, hasta el último día laborable del mes
  de enero de cada año, un informe anual sobre el cumplimiento del derecho de
  acceso a la información pública. El informe contendrá:
  a) Información del período anterior sobre el cumplimiento de las obligaciones
  que le asigna esta Ley;
  b) Detalle de las solicitudes de acceso a la información y el trámite dado a
  cada una de ellas, con indicación del tiempo que ha tomado en responder;
  c) Informe semestral actualizado del estado del enlace de transparencia
  institucional.

