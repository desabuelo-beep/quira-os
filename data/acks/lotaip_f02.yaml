OBLIGACION: >
  Es responsabilidad de las instituciones públicas crear y mantener registros
  públicos de manera profesional, de acuerdo con lo que determine la Ley del
  Sistema Nacional de Archivos, para que el derecho a la información se pueda
  ejercer de forma integral. En ningún caso se justificará la ausencia de normas
  técnicas y manejo de archivo de la información y documentación tanto física
  como digital para impedir u obstaculizar el ejercicio de acceso a la
  información pública, peor aún su destrucción. Quienes administren, manejen
  archivo o conserven información pública serán personalmente responsables y
  solidariamente responsables por su custodia.

EVIDENCIA:
  - Sistema-gestión-documental-GADM
  - Archivo-físico-y-digital-organizado
  - Contratos-históricos-preservados
