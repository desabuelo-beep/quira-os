ACK_ID: LOMH_166
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Corresponsabilidad nivel local — políticas de inclusión, prevención trata, reinserción migrante

FUENTE:
  norma: Ley Orgánica de Movilidad Humana
  sigla: LOMH
  jerarquia: 1
  articulo: "166"
  inciso: ""
  fecha_vigencia: "2017-02-06"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde

ACTOR_BENEFICIARIO:
  - Personas en movilidad humana en el cantón
  - Comunidad extranjera residente
  - Víctimas de trata de personas

OBLIGACION: >
  Los gobiernos autónomos descentralizados municipales en coordinación con la autoridad
  de movilidad humana y la autoridad de control migratorio deberán:
  (1) Generar políticas de inclusión y desarrollo tendientes a prevenir la migración
  riesgosa, en el ámbito de su competencia, así como apoyar en la reinserción de
  víctimas de trata de personas y tráfico ilícito de personas.
  (2) Crear políticas y programas para la inclusión de la comunidad extranjera y
  de la convivencia pacífica.
  (3) Planificar en el mediano y largo plazo la integración social y económica de
  la comunidad migrante retornada.

EVIDENCIA:
  - POA — programa de inclusión comunidad extranjera / migrante retornado
  - Convenios interinstitucionales para prevención de trata de personas
  - Política pública de convivencia pacífica (ordenanza o resolución)
  - PDOT — componente de integración migrante a mediano y largo plazo
  - LOTAIP_19_6 — ejecución de partidas de movilidad humana

CONSECUENCIA:
  descripcion: >
    La omisión de políticas de inclusión y prevención de trata es incumplimiento del
    mandato LOMH_166. Responsabilidad administrativa del Alcalde y Director de Planificación.
    En casos de trata vinculados a omisión del GAD, puede activarse responsabilidad penal.
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - MREMH
    - Fiscalía
    - CGE

APLICABILIDAD:
  nacional: false
  municipal: true
  condicion:
    - ninguna

