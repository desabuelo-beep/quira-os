ACK_ID: LOMH_167
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Transversalización enfoque movilidad humana en todas las entidades públicas y GADs

FUENTE:
  norma: Ley Orgánica de Movilidad Humana
  sigla: LOMH
  jerarquia: 1
  articulo: "167"
  inciso: ""
  fecha_vigencia: "2017-02-06"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Director-Planificacion

ACTOR_BENEFICIARIO:
  - Personas en movilidad humana

OBLIGACION: >
  Todas las entidades del sector público, en todos los niveles de gobierno, incluirán
  el enfoque de movilidad humana en sus políticas, planes, programas, proyectos y servicios.
  El GAD Municipal debe garantizar que su PDOT, POA, presupuesto y servicios institucionales
  incorporen el enfoque de movilidad humana de manera transversal.

EVIDENCIA:
  - PDOT vigente — verificar si incluye análisis de flujos migratorios y política pública
  - POA — presencia de al menos un programa/proyecto con enfoque movilidad humana
  - Servicios municipales — verificar si el acceso es efectivo para personas en movilidad
  - LOTAIP_19_10 — componente de planificación (PDOT con enfoque transversal)

CONSECUENCIA:
  descripcion: >
    La omisión del enfoque transversal en el PDOT y POA constituye incumplimiento de
    planificación pública con consecuencia de responsabilidad administrativa del
    Director de Planificación y del Alcalde. Si la omisión es sistémica y verificada
    por ente de control, aplica observación formal y corrección obligatoria del PDOT.
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - MREMH
    - SENPLADES-PLANIFICA
    - CGE

APLICABILIDAD:
  nacional: true
  municipal: true
  condicion:
    - ninguna

