# Jerarquía: 1 (Ley Orgánica)
# Registro Oficial: Suplemento 938 — 06-feb-2017
# Ámbito GAD Municipal: parcial — competencias específicas Arts. 165, 166, 167
# Atoms:     3 (Art.165 · Art.166 · Art.167)
# Propósito: Completar Dom12 — obligaciones GAD en movilidad humana y migración
# ============================================================

ACK_ID: LOMH_165
CLASE: ACK_OBLIGACION
TIPO: competencia_concurrente
NOMBRE: Competencias GAD Municipal en movilidad humana — normativa, integración y PDOT

FUENTE:
  norma: Ley Orgánica de Movilidad Humana
  sigla: LOMH
  jerarquia: 1
  articulo: "165"
  inciso: ""
  fecha_vigencia: "2017-02-06"

ACTOR_OBLIGADO:
  - GAD-Municipal

ACTOR_BENEFICIARIO:
  - Personas en movilidad humana (migrantes, refugiados, retornados)
  - Comunidades extranjeras en el cantón

OBLIGACION: >
  Los gobiernos autónomos descentralizados municipales en coordinación con la autoridad
  de movilidad humana tienen competencia para:
  (1) Crear normativa para la integración social, económica, productiva, laboral y el
  respeto a los derechos humanos de las personas en movilidad humana y en particular
  de las personas migrantes retornadas.
  (2) Coordinar con las instituciones públicas y privadas la atención integral para la
  población en movilidad humana.
  (3) Integrar en su planificación de desarrollo y ordenamiento territorial (PDOT)
  acciones, política pública, planes, programas y proyectos que permitan asegurar el
  ejercicio efectivo de los derechos de las personas en movilidad humana.
  (4) Participar en los espacios de diálogo y coordinación interinstitucional en
  materia de movilidad humana.
  (5) Prevenir la trata de personas y el tráfico ilícito de migrantes en coordinación
  con la autoridad de movilidad humana.

EVIDENCIA:
  - PDOT — componente de movilidad humana/migración (verificar inclusión)
  - Ordenanzas de integración de población migrante (si existen)
  - Convenios con Ministerio de Relaciones Exteriores / autoridad de movilidad
  - POA — programas de atención a población migrante/retornada
  - LOTAIP_19_10 — componente de planificación con enfoque movilidad humana

CONSECUENCIA:
  descripcion: >
    La omisión de integrar movilidad humana en el PDOT constituye incumplimiento
    del mandato LOMH_167 (transversalización). Responsabilidad administrativa del
    Director de Planificación. La no-participación en espacios de coordinación
    puede generar observaciones del ente rector.
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - MREMH
    - CGE

APLICABILIDAD:
  nacional: false
  municipal: true
  condicion:
    - ninguna
  # Aplica con especial fuerza a cantones fronterizos o con alta población migrante
  # Montecristi (Costa): aplica por flujos migratorios internos y retornados

DOMINIOS_QUIRA:
  - Dom12
  - Dom09
  - Dom04

RELACIONES:
  - CE_35
  - CE_40
  - CE_41
  - COOTAD_55
  - LOMH_166
  - LOMH_167

VIGENCIA:
  estado: vigente

CADENA_TERRITORIAL:
  capa: 2
  circuito_id: pendiente
  activa:
    - LOMH_166
    - LOMH_167
  mide_en: "pendiente — TGI Dom12 no incluye indicador de movilidad humana aún"

