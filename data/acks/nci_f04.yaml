ACK_ID: NCI_PRE_DEVENGADO
CLASE: ACK_OBLIGACION
TIPO: procedimiento
NOMBRE: Control previo al devengado — documentación mínima antes de aceptar obligación

FUENTE:
  norma: Normas de Control Interno — Contraloría General del Estado
  sigla: NCI-CGE
  jerarquia: 3
  articulo: "402-03"
  inciso: "Control previo al devengado"
  fecha_vigencia: "2009-12-14"

ACTOR_OBLIGADO:
  - Director-Financiero
  - Fiscalizador
  - Servidor-Responsable-Pago

ACTOR_BENEFICIARIO:
  - Estado Ecuatoriano

OBLIGACION: >
  Previa a la aceptación de una obligación o al reconocimiento de un derecho,
  como resultado de la recepción de bienes, servicios u obras, las personas
  encargadas del control, con la documentación de respaldo, evidenciarán y
  verificarán: (1) Que la obligación sea veraz y corresponda a una transacción
  financiera que haya reunido los requisitos exigidos en la fase del control
  previo; que se haya registrado contablemente; y, contenga la autorización
  de la autoridad competente, así como mantengan su razonabilidad y exactitud
  aritmética. (2) Que los bienes, obras o servicios recibidos cuenten con
  los respaldos como: factura, contrato, ingreso a bodega o acta de recepción,
  informes técnicos legalizados, que evidencien la obligación o deuda
  correspondiente. (3) Que la transacción no varíe con respecto a la
  propiedad, legalidad y conformidad con el presupuesto inicialmente
  establecido y/o las reformas legalmente autorizadas por la autoridad
  competente.

EVIDENCIA:
  - Acta de recepción provisional y definitiva (obras)
  - Acta de entrega-recepción + ingreso a bodega (bienes)
  - Informe de cumplimiento técnico (servicios)
  - Factura legalizada y contrato correspondiente
  - Informe de fiscalización (obras públicas)

CONSECUENCIA:
  descripcion: >
    Devengamiento sin documentación completa (sin acta de recepción, sin
    informe técnico) es causa directa de glosa (LOC-CGE Art. 53) por pago
    indebido o perjuicio económico. Activa LOC-CGE Art. 45 numeral 3
    (permisividad de violación de normas). En GADM: contratos pagados sin
    acta de recepción o con obras inconclusas son el tipo exacto de hallazgo
    que genera glosas. D3=59.85% con pagos concentrados en dic/ene puede
    indicar devengamientos sin respaldo suficiente.
  tipo: glosa-cge
  organo_sancionador:
    - CGE

VIGENCIA:
  estado: vigente

DOMINIOS_QUIRA:
  - Dom01
  - Dom02
  - Dom03

RELACIONES:
