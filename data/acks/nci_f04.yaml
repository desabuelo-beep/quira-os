ACK_ID: NCI_200_04
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Estructura orgánica — reglamento orgánico y manual de puestos obligatorios

FUENTE:
  norma: Normas de Control Interno — Contraloría General del Estado
  sigla: NCI-CGE
  jerarquia: 3
  articulo: "200-04"
  inciso: ""
  fecha_vigencia: "2009-12-14"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde

ACTOR_BENEFICIARIO:
  - CGE
  - Servidores-Publicos

OBLIGACION: >
  Toda entidad contará con un reglamento orgánico, estatuto orgánico o el
  instrumento técnico de gestión organizacional, actualizado, que contendrá:
  la estructura orgánica, niveles jerárquicos, funciones, atribuciones,
  productos y demás especificaciones establecidas en la normativa aplicable;
  y, un manual de procesos y procedimientos, como elementos sustanciales
  para definir posteriormente el sistema de clasificación de puestos o
  cargos. Toda entidad debe complementar su estructura orgánica con un Manual
  de Descripción, Valoración y Clasificación de Puestos, actualizado, en el
  cual se deben establecer los perfiles, funciones y atribuciones para cada
  uno de los puestos o cargos, así como los requisitos para ocuparlos. Los
  directivos comprenderán cuáles son sus responsabilidades de control y
  poseerán experiencia y conocimientos requeridos en función de sus cargos.

EVIDENCIA:
  - Resolución Orgánica de Gestión Organizacional por Procesos publicada en RO
  - Manual de Descripción, Valoración y Clasificación de Puestos vigente
  - Orgánico funcional publicado en portal LOTAIP

CONSECUENCIA:
  descripcion: >
    Reglamento orgánico desactualizado activa LOC-CGE Art. 45 numeral 7
    (no establecer administración de recursos humanos). Su ausencia es
    deficiencia grave del Componente 200 (Ambiente de Control) y puede
    activar observaciones de la CGE en cualquier auditoría. En GADM: la
    Resolución Orgánica 040-2025-ALC-LJTL debe verificarse contra los
    requisitos de esta norma. El bajo D5 (capacidad institucional) tiene
    correlación directa con incumplimiento de NCI 200-04 y 200-06.
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - CGE

VIGENCIA:
  estado: vigente

