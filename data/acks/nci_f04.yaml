ACK_ID: NCI_PRE_COMPROMISO
CLASE: ACK_OBLIGACION
TIPO: procedimiento
NOMBRE: Control previo al compromiso — triple verificación antes de comprometer recursos públicos

FUENTE:
  norma: Normas de Control Interno — Contraloría General del Estado
  sigla: NCI-CGE
  jerarquia: 3
  articulo: "402-02"
  inciso: "Control previo al compromiso"
  fecha_vigencia: "2009-12-14"

ACTOR_OBLIGADO:
  - Director-Financiero
  - Alcalde
  - Servidor-Responsable-Gasto

ACTOR_BENEFICIARIO:
  - Estado Ecuatoriano

OBLIGACION: >
  Se denomina control previo al compromiso al conjunto de procedimientos y
  acciones que adoptan los niveles directivos de las entidades antes de
  tomar decisiones que comprometan recursos públicos. En el control previo
  a la autorización para la ejecución de un gasto, las personas designadas
  verificarán y justificarán con la documentación de respaldo que:
  (1) La operación financiera está directamente relacionada con la misión
  de la entidad, sus objetivos y con los programas, proyectos y actividades
  aprobados en los planes operativos anuales y presupuestos.
  (2) La operación financiera reúne los requisitos legales pertinentes y
  necesarios para llevarla a cabo, que no existan restricciones legales
  sobre la misma.
  (3) Exista la partida presupuestaria con la disponibilidad suficiente de
  fondos no comprometidos, a fin de evitar desviaciones financieras y
  presupuestarias.

EVIDENCIA:
  - Certificación presupuestaria previa al compromiso
  - Vinculación documentada del gasto al POA y partida presupuestaria
  - Verificación de cumplimiento de requisitos legales del proceso
  - Disponibilidad de saldo en partida (eSIGEF)

CONSECUENCIA:
  descripcion: >
    Compromiso sin certificación previa o sin cumplir la triple verificación
    activa LOC-CGE Art. 45 numeral 8 (contraer compromisos en contravención
    con normas legales o insistir en una orden objetada por el control previo).
    Activa también LOC-CGE Art. 52 (responsabilidad civil culposa) si genera
    perjuicio económico. En GADM: D3=59.85% ejecución baja con posibles
    concentraciones en Q4 puede indicar que el control previo se aplica de
    forma insuficiente o tardía. Gastos sin POA = SAT-X-A (señal de alarma).
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - CGE

VIGENCIA:
  estado: vigente

