ACK_ID: NCI_GEN_CI
CLASE: ACK_PRINCIPIO
TIPO: principio
NOMBRE: Control interno — definición normativa, 5 componentes y responsabilidad del diseño

FUENTE:
  norma: Normas de Control Interno — Contraloría General del Estado
  sigla: NCI-CGE
  jerarquia: 3
  articulo: "Normas Generales"
  inciso: "Control Interno"
  fecha_vigencia: "2009-12-14"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Director

ACTOR_BENEFICIARIO:
  - Estado Ecuatoriano

OBLIGACION: >
  El control interno será responsabilidad de cada institución del Estado y
  de las personas jurídicas de derecho privado que dispongan de recursos
  públicos, y tendrá como finalidad crear las condiciones para el ejercicio
  del control. El control interno es un proceso integral aplicado por la
  máxima autoridad, la dirección y el personal de cada entidad, que
  proporciona seguridad razonable para el logro de los objetivos
  institucionales y la protección de los recursos públicos. Constituyen
  componentes del control interno: (1) el ambiente de control, (2) la
  evaluación de riesgos, (3) las actividades de control, (4) los sistemas
  de información y comunicación, y (5) el seguimiento. El diseño,
  establecimiento, mantenimiento, funcionamiento, perfeccionamiento y
  evaluación del control interno es responsabilidad de la máxima autoridad,
  de los directivos y el personal de la entidad, de acuerdo con sus
  competencias.

EVIDENCIA:
  - Sistema de control interno documentado (5 componentes)
  - Informes de autoevaluación de control interno
  - Código de ética institucional (Componente 200)
  - Mapa de riesgos institucional (Componente 300)

CONSECUENCIA:
  descripcion: >
    Incumplimiento de los 5 componentes activa LOC-CGE Art. 45. La ausencia
    de cualquiera de los componentes constituye deficiencia del sistema de
    control interno. La CGE usa esta norma como referente técnico principal
    en cualquier auditoría o examen especial al GADM.
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - CGE

VIGENCIA:
  estado: vigente

DOMINIOS_QUIRA:
  - Dom01

RELACIONES:
  - LOC-CGE_9
  - NCI_200_02
  - NCI_200_04
  - NCI_300
  - NCI_400_01
  - NCI_600_01

