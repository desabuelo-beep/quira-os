ACK_ID: NCI_400_01
CLASE: ACK_OBLIGACION
TIPO: prohibicion
NOMBRE: Separación de funciones — segregación obligatoria de autorización, ejecución y registro

FUENTE:
  norma: Normas de Control Interno — Contraloría General del Estado
  sigla: NCI-CGE
  jerarquia: 3
  articulo: "400-01"
  inciso: "Separación de funciones y rotación de labores"
  fecha_vigencia: "2009-12-14"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Director-Financiero

ACTOR_BENEFICIARIO:
  - Estado Ecuatoriano

OBLIGACION: >
  La máxima autoridad y los directivos de cada entidad asignarán funciones
  y responsabilidades al personal a su cargo, estableciendo una segregación
  de éstas, de manera que exista independencia, revisiones, separación de
  funciones incompatibles y reducción del riesgo. La separación de funciones
  se definirá en el reglamento orgánico, estatuto orgánico o el instrumento
  técnico de gestión organizacional, en el manual de procesos y procedimientos,
  Manual de Descripción, Valoración y Clasificación de Puestos y en los
  sistemas informáticos que administra la entidad. Para reducir el riesgo de
  error, el desperdicio, las actividades incorrectas y el riesgo de no
  detectar tales problemas, no se asignará el control de todas las operaciones
  clave a una sola persona o equipo; y tampoco se mantendrá por períodos
  excesivos de tiempo a un servidor como responsable de dichas operaciones.
  La máxima autoridad dispondrá la rotación de labores, siempre que existan
  los perfiles suficientes para realizar los movimientos de personal
  necesarios; caso contrario, deberán implementarse actividades de control
  que compensen la imposibilidad de realizar rotaciones.
  Regla fundamental: QUIEN AUTORIZA ≠ QUIEN EJECUTA ≠ QUIEN REGISTRA.
  Quien recibe dinero ≠ quien contabiliza. Quien compra ≠ quien recibe bienes.

EVIDENCIA:
  - Reglamento orgánico con segregación documentada de funciones
  - Manual de procesos con separación de roles
  - Registros de autorización y aprobación diferenciados
  - Plan de rotación de labores

CONSECUENCIA:
  descripcion: >
    Concentración indebida de funciones en contratos/pagos activa LOC-CGE
    Art. 45 numeral 3 (permisividad de violación de normas) y puede activar
    indicios de responsabilidad penal (COIP peculado) si genera perjuicio
    económico. Es el control que previene los hallazgos más graves en
    auditorías de gestión. En GADM: verificar si el Director Financiero y
    el responsable de contratos tienen funciones claramente segregadas en
    SOCE y eSIGEF.
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - CGE
    - Fiscalia

VIGENCIA:
  estado: vigente

DOMINIOS_QUIRA:
  - Dom01
  - Dom02
  - Dom03
  - Dom05

