ACK_ID: NCI_600_01
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Seguimiento continuo — monitoreo permanente del control interno con UAI

FUENTE:
  norma: Normas de Control Interno — Contraloría General del Estado
  sigla: NCI-CGE
  jerarquia: 3
  articulo: "600"
  inciso: "Seguimiento continuo o en operación"
  fecha_vigencia: "2009-12-14"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Director
  - Unidad-Auditoria-Interna

ACTOR_BENEFICIARIO:
  - Estado Ecuatoriano
  - CGE

OBLIGACION: >
  La máxima autoridad y los directivos de la entidad establecerán
  procedimientos de seguimiento continuo, evaluaciones periódicas o una
  combinación de ambas para asegurar la eficacia del sistema de control
  interno. Seguimiento es el proceso que evalúa la calidad del funcionamiento
  del control interno en el tiempo y permite al sistema reaccionar en forma
  dinámica, cambiando cuando las circunstancias así lo requieran. Se orientará
  a la identificación de controles débiles o insuficientes para promover su
  reforzamiento, así como asegurar que las medidas producto de los hallazgos
  de auditoría y los resultados de otras revisiones se atiendan de manera
  efectiva y con prontitud. Las debilidades y deficiencias detectadas como
  resultado del proceso de monitoreo deben ser registradas y puestas a
  disposición de los responsables con el fin de que tomen las acciones
  necesarias para su corrección. El término "deficiencia" constituye la
  materialización de un riesgo. La máxima autoridad, los niveles directivos
  y de jefatura efectuarán un seguimiento continuo del ambiente interno y
  externo que les permita conocer y aplicar medidas oportunas sobre
  condiciones reales o potenciales que afecten el desarrollo de las
  actividades institucionales.

EVIDENCIA:
  - Informes periódicos de autoevaluación del control interno
  - Informes de la Unidad de Auditoría Interna
  - Registros de implementación de recomendaciones de auditoría
  - Seguimiento de POA con indicadores de gestión

CONSECUENCIA:
  descripcion: >
    Ausencia de seguimiento continuo activa LOC-CGE Art. 45 numeral 9
    (no tomar acciones correctivas en conocimiento del informe del auditor).
    Si el GADM recibe recomendaciones de la CGE o de la UAI y no las
    implementa, incurre directamente en esta causal. El incumplimiento de
    recomendaciones es uno de los hallazgos más frecuentes en auditorías
    posteriores de la CGE.
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - CGE

VIGENCIA:
  estado: vigente

DOMINIOS_QUIRA:
