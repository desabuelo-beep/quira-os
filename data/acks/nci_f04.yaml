ACK_ID: NCI_300
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Evaluación del riesgo — mapa de riesgos institucional obligatorio (probabilidad × impacto)

FUENTE:
  norma: Normas de Control Interno — Contraloría General del Estado
  sigla: NCI-CGE
  jerarquia: 3
  articulo: "300"
  inciso: "Evaluación del Riesgo (300-01 a 300-04)"
  fecha_vigencia: "2009-12-14"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Director

ACTOR_BENEFICIARIO:
  - Estado Ecuatoriano

OBLIGACION: >
  La máxima autoridad y el personal de la institución establecerán los
  mecanismos necesarios para identificar, analizar, valorar y responder a
  los riesgos a los que está expuesta la organización para el logro de sus
  objetivos, el cumplimiento de las disposiciones legales, la protección de
  recursos públicos y la generación de información oportuna y confiable.
  La administración debe valorar los riesgos a partir de dos perspectivas,
  probabilidad e impacto, siendo la probabilidad la posibilidad de ocurrencia,
  mientras que el impacto representa el efecto frente a su ocurrencia
  (Norma 300-03 — Valoración del riesgo). Los perfiles de riesgo y controles
  relacionados serán continuamente revisados para asegurar que el mapa del
  riesgo siga siendo válido, que las respuestas al riesgo son apropiadamente
  escogidas y proporcionadas, y que los controles para mitigarlos sigan
  siendo efectivos en la medida en que los riesgos cambien con el tiempo.
  La entidad deberá establecer un plan de mitigación de riesgos que
  desarrolle las estrategias y acciones para enfrentar los riesgos
  identificados (Norma 300-04).

EVIDENCIA:
  - Matriz de riesgos institucional actualizada
  - Mapa de calor de riesgos (probabilidad × impacto)
  - Plan de mitigación y contingencia
  - Informes periódicos de actualización del mapa de riesgos

CONSECUENCIA:
  descripcion: >
    Ausencia de mapa de riesgos activa LOC-CGE Art. 45 numeral 6 (no
    establecer control interno). En GADM: Montecristi opera en Manabí
    (Clase 5 en amenazas: sismicidad, sequías, inundaciones costeras Chirijos).
    La ausencia de un mapa de riesgos institucional actualizado es deficiencia
    crítica del Componente 300, viola NCI, y puede activar responsabilidad
    administrativa del Alcalde. El riesgo de fraccionamiento en contratos
    (visible en SOCE) es riesgo de corrupción que debe estar en la matriz.
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - CGE

VIGENCIA:
  estado: vigente

DOMINIOS_QUIRA:
  - Dom01
  - Dom03
  - Dom04

RELACIONES:
  - LOC-CGE_9
  - LOC-CGE_45
  - NCI_GEN_CI
  - NCI_400_01
