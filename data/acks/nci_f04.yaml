ACK_ID: NCI_200_02
CLASE: ACK_OBLIGACION
TIPO: obligacion
NOMBRE: Administración estratégica — POA como desagregación del plan plurianual con indicadores

FUENTE:
  norma: Normas de Control Interno — Contraloría General del Estado
  sigla: NCI-CGE
  jerarquia: 3
  articulo: "200-02"
  inciso: ""
  fecha_vigencia: "2009-12-14"

ACTOR_OBLIGADO:
  - GAD-Municipal
  - Alcalde
  - Director

ACTOR_BENEFICIARIO:
  - CGE
  - Ciudadanía

OBLIGACION: >
  Las entidades del sector público implantarán, pondrán en funcionamiento y
  actualizarán el sistema de planificación, así como el establecimiento de
  indicadores de gestión que permitan evaluar el cumplimiento de las metas,
  objetivos y la eficiencia de la gestión institucional. Requieren para su
  gestión la implantación de un sistema de planificación que incluya la
  formulación, ejecución, control, seguimiento y evaluación de los planes
  operativos anuales y un plan plurianual institucional, que considerarán
  como base la función, misión y visión institucionales y que tendrán
  consistencia con los objetivos del Plan Nacional de Desarrollo, políticas
  públicas, normativa constitucional y legal relacionada con su misión, y
  lineamientos del organismo técnico de planificación. Los planes operativos
  constituirán la desagregación del plan plurianual y contendrán: objetivos,
  indicadores, metas, programas, proyectos y actividades que se impulsarán
  en el período anual, documento que deberá estar vinculado con el
  presupuesto a fin de concretar lo planificado en función de las capacidades
  y la disponibilidad real de los recursos. Los productos de todas las
  actividades de formulación, seguimiento y evaluación deben plasmarse en
  documentos oficiales a difundirse entre todos los niveles de la organización
  y a la comunidad en general.

EVIDENCIA:
  - POA actualizado y aprobado vinculado al presupuesto y al PDOT/PEI
  - Plan plurianual institucional (PDyOT o equivalente)
  - Indicadores de gestión documentados
  - Informes de seguimiento y evaluación POA publicados en LOTAIP
  - SIGAD actualizado (SNP)

CONSECUENCIA:
  descripcion: >
    POA no articulado al PDyOT viola NCI 200-02 y activa LOC-CGE Art. 45
    numeral 7 (no establecer sistemas de planificación). En GADM: presupuesto
    aprobado sin coherencia territorial (IRS=79.7) viola esta norma además
    de COOTAD_215. El incumplimiento es observable directamente en el SIGAD.
  tipo: responsabilidad-administrativa
  organo_sancionador:
    - CGE

VIGENCIA:
  estado: vigente

DOMINIOS_QUIRA:
  - Dom01
  - Dom02
  - Dom04
  - Dom09

RELACIONES:
  - LOC-CGE_9
