# CIRCUITO 6: CONTROL_PREV
# Cadena: LOC-CGE_12 (C2) → NCI_PRE_COMPROMISO (C6) → NCI_PRE_DEVENGADO (C6) → D3=59.85% → TGI Dom02
# ─────────────────────────────────────────────────────────────

- REL_ID: LOCCGE12_HABILITA_NCI_PRE_COMPROMISO
  ORIGEN: LOC-CGE_12
  DESTINO: NCI_PRE_COMPROMISO
  TIPO: HABILITA
  FUERZA: DIRECTA
  EVIDENCIA:
    - LOC-CGE_12
    - NCI_GEN_CI
    - NCI_PRE_COMPROMISO
  CIRCUITO:
    id: CONTROL_PREV
    capa_origen: 2
    capa_destino: 6
  META:
    estado: v1.4
    fecha_extraccion: "2026-05-30"
    extractor: QLEP-v1.4
    revisado_por_experto: true
  NOTA: >
    LOC-CGE Art. 12 otorga a la CGE la potestad de emitir normas de control interno
    que incluyen el control previo al compromiso presupuestario.
    NCI_PRE_COMPROMISO implementa esa potestad con triple verificación obligatoria:
    (1) en POA y presupuesto (2) cumple requisitos legales (3) existe partida disponible.
    Dato Montecristi: D3=59.85% de ejecución — la triple verificación no evitó la sub-ejecución.

- REL_ID: NCI_PRE_COMPROMISO_COMPLEMENTA_NCI_PRE_DEVENGADO
  ORIGEN: NCI_PRE_COMPROMISO
  DESTINO: NCI_PRE_DEVENGADO
  TIPO: COMPLEMENTA
  FUERZA: SISTEMICA
  EVIDENCIA:
    - NCI_PRE_COMPROMISO
    - NCI_PRE_DEVENGADO
    - LOC-CGE_12
  CIRCUITO:
    id: CONTROL_PREV
    capa_origen: 6
    capa_destino: 6
  META:
    estado: v1.4
    fecha_extraccion: "2026-05-30"
    extractor: QLEP-v1.4
    revisado_por_experto: true
  NOTA: >
    El control presupuestario tiene dos fases secuenciales y complementarias:
    COMPROMISO (cuando se decide el gasto) y DEVENGADO (cuando se reconoce la obligación de pago).
    NCI_PRE_COMPROMISO opera antes de comprometer; NCI_PRE_DEVENGADO antes de devengar.
    Ambas forman el ciclo de control previo completo — una sin la otra es control parcial.
    El D3=59.85% de Montecristi sugiere que alguna de las fases falla sistemáticamente.

