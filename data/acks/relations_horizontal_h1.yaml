# CIRCUITO H4: INSTITUCION_EJECUCION — Dom05 ↔ Dom02
# Pregunta: ¿La estructura institucional afecta la ejecución presupuestaria?
# ============================================================

- REL_ID: LOCCGE45_COMPLEMENTA_COOTAD215
  ORIGEN: LOC-CGE_45
  DESTINO: COOTAD_215
  TIPO: COMPLEMENTA
  FUERZA: CAUSAL
  EVIDENCIA:
    - LOC-CGE_45
    - COOTAD_215
    - LOC-CGE_12
  CIRCUITO:
    id: H4_INSTITUCION_EJECUCION
    tipo: horizontal
    dominios_cruzados: [Dom01, Dom02]
    capa_origen: "C6"
    capa_destino: "C4"
  META:
    estado: v1.5
    fecha_extraccion: "2026-05-30"
    extractor: QLEP-v1.5
    revisado_por_experto: true
  NOTA: >
    La responsabilidad administrativa del servidor que no ejecuta el presupuesto asignado
    (LOC-CGE_45 — Dom01) es el mecanismo de enforcement de la obligación de ejecución de
    COOTAD_215 (Dom02). Sin la amenaza de consecuencia institucional, la ejecución
    presupuestaria no tiene enforcement efectivo. Causal Dom01↔Dom02: la densidad
    institucional de la cadena de responsabilidades explica la velocidad y calidad de
    la ejecución. Este es el núcleo de la conexión Actor lateral (QNKC-002) con Dom02:
    el actor ejecuta el proceso — su responsabilidad formal es el enlace.

