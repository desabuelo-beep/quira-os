# ============================================================
# CIRCUITO H3: CONTRATACION_PARTICIPACION — Dom03 ↔ Dom08
# Pregunta: ¿La contratación pública afecta la participación y la transparencia?
# ============================================================

- REL_ID: COOTAD304_COMPLEMENTA_LOTAIP19_21
  ORIGEN: COOTAD_304
  DESTINO: LOTAIP_19_21
  TIPO: COMPLEMENTA
  FUERZA: CAUSAL
  EVIDENCIA:
    - COOTAD_304
    - LOTAIP_19_21
    - LOTAIP_19_8
  CIRCUITO:
    id: H3_CONTRATACION_PARTICIPACION
    tipo: horizontal
    dominios_cruzados: [Dom08, Dom03]
    capa_origen: "C2"
    capa_destino: "C7"
  META:
    estado: v1.5
    fecha_extraccion: "2026-05-30"
    extractor: QLEP-v1.5
    revisado_por_experto: true
  NOTA: >
    El presupuesto participativo (COOTAD_304 — Dom08) debe traducirse en el Plan Anual
    de Contratación (PAC). LOTAIP_19_21 obliga a publicar el PAC como instrumento de
    transparencia. Si las prioridades validadas en el proceso participativo Dom08 no
    aparecen en el PAC publicado Dom03/Dom07, el mandato participativo no tuvo efecto
    real en la asignación contractual. Causal: la calidad del proceso Dom08 predice
    la alineación del PAC Dom03. La distancia entre las dos listas es una métrica
    de captura institucional del proceso de contratación.

