    capa_destino: "C2"
  META:
    estado: v1.5
    fecha_extraccion: "2026-05-30"
    extractor: QLEP-v1.5
    revisado_por_experto: true
  NOTA: >
    El control previo al devengado (NCI_PRE_DEVENGADO — Dom02/C6) es la última barrera
    antes de que el gasto llegue efectivamente al beneficiario GAP. Si el devengado no se
    registra correctamente para partidas de grupos prioritarios, el 10% comprometido
    (COOTAD_249) no se convierte en servicio real. Causal C6→C2: un fallo en el control
    de devengado Dom02 produce directamente brecha en el ejercicio de derechos Dom12.

