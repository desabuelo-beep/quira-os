  META:
    estado: v1.5
    fecha_extraccion: "2026-05-30"
    extractor: QLEP-v1.5
    revisado_por_experto: true
  NOTA: >
    La accesibilidad universal mandatada por LOD_58 (Dom12) aplica a toda obra e
    infraestructura pública, incluyendo sistemas de agua potable, saneamiento y
    espacios públicos de COOTAD_137 (Dom04). Una obra de infraestructura de servicios
    que no cumple normas INEN de accesibilidad viola simultáneamente LOD_58 y COOTAD_137.
    Esto produce un doble incumplimiento observable en una sola evidencia (permiso de
    obra + inspección de accesibilidad), lo que hace más eficiente el control cruzado.

