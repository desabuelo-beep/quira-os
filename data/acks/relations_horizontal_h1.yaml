# Propósito: Habilitar razonamiento explicativo cruzando dominios.
#            Los circuitos verticales describen la cadena causal dentro de un dominio.
#            Los circuitos horizontales explican POR QUÉ un dominio falla en términos de otro.
#
# Transición epistémica que estos REL atoms habilitan:
#   Sistema descriptivo   → "COOTAD_249 asigna 10% al GAP"
#   Sistema explicativo   → "La baja ejecución Dom02 explica la brecha Dom12"
#   Sistema predictivo    → "Si Dom02 cae, Dom12 seguirá"
#
# Circuitos cubiertos:
#   H1: Dom02↔Dom12 — Presupuesto explica brecha GAP (2 REL atoms)
#   H2: Dom04↔Dom12 — Cobertura territorial explica vulneración derechos (2 REL atoms)
#   H3: Dom03↔Dom08 — Contratación afecta participación y transparencia (2 REL atoms)
#   H4: Dom05↔Dom02 — Estructura institucional afecta ejecución (2 REL atoms)
#
# Total: 8 REL atoms horizontales
# ============================================================


# ============================================================
# CIRCUITO H1: PRESUPUESTO_GAP — Dom02 ↔ Dom12
# Pregunta: ¿La ejecución presupuestaria explica la brecha GAP?
# ============================================================

- REL_ID: COOTAD249_COMPLEMENTA_COOTAD215
  ORIGEN: COOTAD_249
  DESTINO: COOTAD_215
  TIPO: COMPLEMENTA
  FUERZA: SISTEMICA
  EVIDENCIA:
    - COOTAD_249
    - COOTAD_215
    - LOTAIP_19_6
  CIRCUITO:
    id: H1_PRESUPUESTO_GAP
    tipo: horizontal
    dominios_cruzados: [Dom12, Dom02]
    capa_origen: "C2"
    capa_destino: "C4"
  META:
    estado: v1.5
    fecha_extraccion: "2026-05-30"
    extractor: QLEP-v1.5
    revisado_por_experto: true
  NOTA: >
    El mandato de asignar ≥10% del presupuesto al GAP (COOTAD_249 — Dom12) se materializa
    únicamente a través del mecanismo de ejecución de gastos de COOTAD_215 (Dom02).
    La asignación sin ejecución es ilusoria: el 10% puede estar en la proforma y no llegar
    al beneficiario. Relación explicativa: una baja ejecución Dom02 es señal predictiva
    de brecha en Dom12. Observable en LOTAIP_19_6 (ejecución mensual).

