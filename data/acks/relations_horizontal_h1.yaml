# ============================================================
# CIRCUITO H2: COBERTURA_DERECHOS — Dom04 ↔ Dom12
# Pregunta: ¿La cobertura territorial explica la vulneración de derechos?
# ============================================================

- REL_ID: LOMH165_COMPLEMENTA_COOTAD137
  ORIGEN: LOMH_165
  DESTINO: COOTAD_137
  TIPO: COMPLEMENTA
  FUERZA: CAUSAL
  EVIDENCIA:
    - LOMH_165
    - COOTAD_137
    - LOMH_167
  CIRCUITO:
    id: H2_COBERTURA_DERECHOS
    tipo: horizontal
    dominios_cruzados: [Dom12, Dom04]
    capa_origen: "C2"
    capa_destino: "C3"
  META:
    estado: v1.5
    fecha_extraccion: "2026-05-30"
    extractor: QLEP-v1.5
    revisado_por_experto: true
  NOTA: >
    LOMH_165 obliga al GAD a integrar el enfoque de movilidad humana en el PDOT,
    incluyendo acceso a servicios básicos para población migrante y retornada.
    COOTAD_137 regula la provisión de agua potable y saneamiento como competencia
    exclusiva territorial. La cobertura de servicios básicos Dom04 es condición
    necesaria para el ejercicio de derechos de la población en movilidad humana Dom12.
    Causal: una brecha territorial en Dom04 produce directamente vulneración en Dom12
    para la población más vulnerable de ese déficit de cobertura.

