    tipo: horizontal
    dominios_cruzados: [Dom01, Dom02]
    capa_origen: "C6"
    capa_destino: "C4"
  META:
    estado: v1.5
    fecha_extraccion: "2026-05-30"
    extractor: QLEP-v1.5
    revisado_por_experto: true
  NOTA: >
    El sistema de control previo, continuo y posterior (LOC-CGE_12) es la arquitectura
    institucional que condiciona la calidad de la ejecución presupuestaria (COOTAD_215).
    El control previo bloquea compromisos ilegales; el control continuo detecta desviaciones
    en ejecución; el control posterior registra el historial. Instituciones con control
    previo débil (Dom01/C6) producen sistemáticamente subejecución o ejecución irregular
    (Dom02/C4). Causal: la densidad del sistema de control explica la varianza en ejecución
    entre municipios con similar presupuesto pero diferente capacidad institucional de control.

