- REL_ID: LOSNCP21_OBSERVA_COOTAD302
  ORIGEN: LOSNCP_21
  DESTINO: COOTAD_302
  TIPO: OBSERVA
  FUERZA: SISTEMICA
  EVIDENCIA:
    - LOSNCP_21
    - COOTAD_302
    - LOTAIP_19_8
  CIRCUITO:
    id: H3_CONTRATACION_PARTICIPACION
    tipo: horizontal
    dominios_cruzados: [Dom03, Dom08]
    capa_origen: "C7"
    capa_destino: "C2"
  META:
    estado: v1.5
    fecha_extraccion: "2026-05-30"
    extractor: QLEP-v1.5
    revisado_por_experto: true
  NOTA: >
    El PAC publicado (LOSNCP_21 — Dom03/C7) es el insumo observable que la rendición
    de cuentas participativa (COOTAD_302 — Dom08) necesita para que los ciudadanos
    puedan comparar prioridades prometidas vs. contratos adjudicados. LOSNCP_21
    "observa" el ciclo Dom08 al exponer públicamente qué se va a contratar. Sin PAC
    publicado, la rendición de cuentas Dom08 pierde su referente contractual. Esta
    relación hace al PAC un artefacto de accountability bidireccional: transparencia
    hacia afuera (Dom07) y herramienta de verificación participativa (Dom08).

