# ============================================================
# CIRCUITO H3 DENSIFICADO: CONTRATACION_PARTICIPACION — Dom03 ↔ Dom08
# Nuevos átomos que refuerzan el circuito con la dimensión LOSNCP
# ============================================================

- REL_ID: COOTAD304_COMPLEMENTA_LOSNCP21
  ORIGEN: COOTAD_304
  DESTINO: LOSNCP_21
  TIPO: COMPLEMENTA
  FUERZA: CAUSAL
  EVIDENCIA:
    - COOTAD_304
    - LOSNCP_21
    - LOTAIP_19_21
  CIRCUITO:
    id: H3_CONTRATACION_PARTICIPACION
    tipo: horizontal
    dominios_cruzados: [Dom08, Dom03]
    capa_origen: "C2"
    capa_destino: "C2"
  META:
    estado: v1.5
    fecha_extraccion: "2026-05-30"
    extractor: QLEP-v1.5
    revisado_por_experto: true
  NOTA: >
    El proceso de presupuesto participativo (COOTAD_304 — Dom08) genera una lista de
    prioridades validadas por la ciudadanía. El PAC (LOSNCP_21 — Dom03) es el instrumento
    jurídico donde esas prioridades deben materializarse como procesos de contratación
    planificados. La distancia entre las prioridades aprobadas en el participativo y los
    ítems del PAC publicado es la métrica más precisa de captura institucional: si el PAC
    no refleja el participativo, el proceso Dom08 fue cosmético. Observable cruzando:
    Acta Asamblea Ciudadana (Dom08) vs. PAC publicado en SERCOP (Dom03/LOTAIP_19_21).

