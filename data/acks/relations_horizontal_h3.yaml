# ============================================================
# CIRCUITO H4 DENSIFICADO: INSTITUCION_EJECUCION — Dom05 ↔ Dom02
# Nuevos átomos desde LOSEP que refuerzan la cadena institucional
# ============================================================

- REL_ID: LOSEP4_COMPLEMENTA_COOTAD198
  ORIGEN: LOSEP_4
  DESTINO: COOTAD_198
  TIPO: COMPLEMENTA
  FUERZA: SISTEMICA
  EVIDENCIA:
    - LOSEP_4
    - COOTAD_198
    - LOSEP_22
  CIRCUITO:
    id: H4_INSTITUCION_EJECUCION
    tipo: horizontal
    dominios_cruzados: [Dom05, Dom02]
    capa_origen: "C1"
    capa_destino: "C3"
  META:
    estado: v1.5
    fecha_extraccion: "2026-05-30"
    extractor: QLEP-v1.5
    revisado_por_experto: true
  NOTA: >
    El ámbito de la LOSEP (Art. 4 — Dom05) determina la estructura de la planta de
    personal del GAD: cuántos servidores, en qué categorías y con qué remuneraciones.
    COOTAD_198 (Dom02) regula el presupuesto municipal, cuya partida de gasto de
    personal (grupo 51) es históricamente la mayor del ejercicio. La relación es
    sistémica: el régimen LOSEP codifica la estructura que genera el 50-65% del gasto
    municipal. Toda reforma de planta (fusión de direcciones, reclasificación de
    puestos, nuevos nombramientos) tiene impacto estructural directo en Dom02.
    Observable: nómina institucional (SIGEF) vs. clasificación de puestos LOSEP.

