- REL_ID: COOTAD215_HABILITA_LOSNCP21
  ORIGEN: COOTAD_215
  DESTINO: LOSNCP_21
  TIPO: HABILITA
  FUERZA: SISTEMICA
  EVIDENCIA:
    - COOTAD_215
    - LOSNCP_21
    - COOTAD_198
  CIRCUITO:
    id: H11_CONTRATACION_PRESUPUESTO
    tipo: horizontal
    dominios_cruzados: [Dom02, Dom03]
    capa_origen: "C4"
    capa_destino: "C2"
  META:
    estado: v1.5
    fecha_extraccion: "2026-05-30"
    extractor: QLEP-v1.5
    revisado_por_experto: true
  NOTA: >
    La disponibilidad presupuestaria ejecutable (COOTAD_215 — Dom02) es la precondición
    estructural que hace posible el Plan Anual de Contratación (LOSNCP_21 — Dom03).
    Un presupuesto sin aprobación oportuna del Concejo, o con partidas bloqueadas por
    CGE, vacía materialmente el PAC de contenido ejecutable. Relación de habilitación
    sistémica: el Dom02 "autoriza" el volumen y velocidad de contratación Dom03.
    Señal predictiva inversa: un PAC sobredimensionado respecto del presupuesto aprobado
    es indicador de planificación irreal, observable comparando totales PAC vs. cédula.

