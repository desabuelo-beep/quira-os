# ============================================================
# QUIRA Gov — REL-H3: Circuitos Horizontales (Sprint H3)
# ============================================================
# Sprint:    REL-H3 — Relaciones inter-dominio derivadas de F0.6 (LOSNCP + LOSEP)
# Versión:   QLEP v1.5 / QNKC-002
# Fecha:     2026-05-30
# Propósito: Materializar las relaciones que el Bloque Operativo F0.6 genera.
#            Los átomos LOSNCP/LOSEP son valiosos por las REL que habilitan,
#            no solo por la cobertura normativa que representan.
#
# Principio de diseño de este sprint:
#   Cada REL aquí responde a una pregunta causal NUEVA que el grafo antes no podía contestar:
#   H11: "¿La certificación presupuestaria precontractual predice la calidad de ejecución?"
#   H3+: "¿El proceso participativo realmente se refleja en el PAC publicado?"
#   H4+: "¿La estructura de personal LOSEP explica la capacidad de ejecución presupuestaria?"
#   H4+: "¿La sanción LOSEP es el enforcement que hace real la obligación de ejecución?"
#
# Circuitos cubiertos:
#   H11: Dom03↔Dom02 — Contratación explica/condiciona la ejecución presupuestaria (2 REL)
#   H3+: Dom03↔Dom08 — Densificación del circuito existente desde LOSNCP (2 REL)
#   H4+: Dom05↔Dom02 — Densificación del circuito institucional desde LOSEP (2 REL)
#
# Total: 6 REL atoms horizontales de densificación y nuevo circuito
# ============================================================


# ============================================================
# CIRCUITO H11 (NUEVO): CONTRATACION_PRESUPUESTO — Dom03 ↔ Dom02
# Pregunta: ¿La calidad del proceso contractual condiciona la ejecución presupuestaria?
# ============================================================

- REL_ID: LOSNCP22_COMPLEMENTA_COOTAD215
  ORIGEN: LOSNCP_22
  DESTINO: COOTAD_215
  TIPO: COMPLEMENTA
  FUERZA: CAUSAL
  EVIDENCIA:
    - LOSNCP_22
    - COOTAD_215
    - NCI_PRE_DEVENGADO
  CIRCUITO:
    id: H11_CONTRATACION_PRESUPUESTO
    tipo: horizontal
    dominios_cruzados: [Dom03, Dom02]
    capa_origen: "C4"
    capa_destino: "C4"
  META:
    estado: v1.5
    fecha_extraccion: "2026-05-30"
    extractor: QLEP-v1.5
    revisado_por_experto: true
  NOTA: >
    La certificación presupuestaria previa (LOSNCP_22 — Dom03) es la condición legal
    que habilita el gasto antes de que el proceso contractual inicie. COOTAD_215 (Dom02)
    regula la ejecución del gasto una vez comprometido. El eslabón causal es directo:
    sin certificación válida, no hay contrato; sin contrato, no hay devengado; sin
    devengado, el presupuesto no ejecuta. La tasa de procesos sin certificación en
    un GAD es un indicador predictivo de la brecha de ejecución al cierre del ejercicio.
    Observable: auditoría de expedientes de contratación (presencia/ausencia de cert.).

