- REL_ID: LOSEP42_COMPLEMENTA_COOTAD215
  ORIGEN: LOSEP_42
  DESTINO: COOTAD_215
  TIPO: COMPLEMENTA
  FUERZA: CAUSAL
  EVIDENCIA:
    - LOSEP_42
    - COOTAD_215
    - LOC-CGE_45
  CIRCUITO:
    id: H4_INSTITUCION_EJECUCION
    tipo: horizontal
    dominios_cruzados: [Dom05, Dom02]
    capa_origen: "C6"
    capa_destino: "C4"
  META:
    estado: v1.5
    fecha_extraccion: "2026-05-30"
    extractor: QLEP-v1.5
    revisado_por_experto: true
  NOTA: >
    El régimen disciplinario LOSEP (Art. 42 — Dom05/C6) es el mecanismo de enforcement
    de la obligación de ejecución presupuestaria (COOTAD_215 — Dom02/C4). Sin la amenaza
    de consecuencia real para el servidor que no ejecuta el presupuesto asignado, la
    obligación de COOTAD_215 es normativa sin dientes. Este es el enlace que cierra el
    circuito H4: la densidad institucional Dom05 (cadena de responsabilidades LOSEP_42)
    explica directamente la calidad de la ejecución Dom02. Un GAD con sumarios activos
    y sanciones aplicadas tiene mayor ejecución presupuestaria que uno donde el régimen
    disciplinario es letra muerta. Causal Dom05→Dom02: la credibilidad de la amenaza
    de sanción predice la velocidad y calidad de ejecución.

