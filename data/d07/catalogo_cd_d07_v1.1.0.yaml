  obligacion_literal: Gobiernos Autónomos Descentralizados. Además de la información señalada en esta
    Ley, los organismos seccionales, mensualmente, informarán a las personas, a través del portal informático
    web u otro medio digital que posea, de las resoluciones que adopten, mediante la publicación de las
    actas de las respectivas sesiones de estos cuerpos colegiados, comisiones y consejo, incluyendo lo
    correspondiente a procesos legislativos, así como sus planes de desarrollo local, y en los casos que
    corresponda, los planes de uso y gestión de suelo, protegiendo de forma integral los aspectos que
    gocen de confidencialidad o reserva, para evitar conflicto de intereses. Se incluirá además la descripción
    específica de los trámites y requisitos que debe cumplir el interesado para tener acceso a los servicios
    que preste el respectivo Gobierno Autónomo Descentralizado y sus empresas públicas
