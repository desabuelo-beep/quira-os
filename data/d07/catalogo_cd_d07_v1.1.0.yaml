- id: CD-17
  numeral_ley: '17'
  nombre: Audiencias y reuniones de autoridades
  normativa: true
  operativa: true
  empirica: false
  guia:
    chunk_id: 14353
    sha256: 46eab0be54
  obligacion_literal: 'Un detalle de las audiencias y reuniones sostenidas por las autoridades electas
    de todos los niveles de gobierno, funcionarios del nivel jerárquico superior de las instituciones
    públicas y máximos representantes de los demás sujetos obligados en esta Ley que tengan por objeto:
    La elaboración, modificación, derogación o rechazo de actos administrativos, proyectos de ley y leyes,
    como también de las decisiones que adopten los obligados en esta Ley. La elaboración, tramitación,
    aprobación, modificación, derogación o rechazo de acuerdos, resoluciones o decisiones de la Asamblea
    Nacional o sus miembros, incluidas sus Comisiones. La celebración, modificación o terminación a cualquier
    título, de contratos que realicen los sujetos obligados señalados en esta Ley y que sean necesarios
    para su funcionamiento. El diseño, implementación y evaluación de políticas, planes y programas efectuados
    por los sujetos obligados señalados en esta Ley, a quienes correspondan estas funciones. En dicho
    detalle se deberá indicar, en particular, la persona, organización o entidad con quien se sostuvo
    la audiencia o reunión, la individualización de los asistentes o personas presentes en la respectiva
    audiencia o reunión, el lugar y fecha de su realización y la materia específica tratada. Se exceptúa
    lo determinado como información confidencial o reservada'
  periodicidad:
    literal: La actualización de los metadatos de este conjunto de datos y la periodicidad de generación
      de sus contenidos será mensual.
    metadatos: mensual
    contenidos:
    - mensual
    estado: declarada
    condicion: null
  campos_exigidos:
  - Nombres, apellidos y puesto institucional de las personas participantes de la entidad que reporta
  - Nombres, apellidos y entidad de las personas que participan en la audiencia o reunión
  - Asunto o descripción de la audiencia / reunión
  - Fecha de la audiencia / reunión
  - Duración de la audiencia / reunión
  - Modalidad (presencial, virtual, híbrida)
  - Lugar de la audiencia / reunión7
  - Enlace para descargar el registro de asistencia de las personas que participaron en las reuniones
    según el detalle de fecha
  componentes_origen: la obligación no enumera dimensiones
