- id: CD-01
  numeral_ley: '1'
  nombre: Estructura orgánica + base legal + metas
  normativa: true
  operativa: false
  empirica: false
  componentes:
  - '1.1'
  - '1.2'
  - '1.3'
  obligacion_literal: Estructura orgánica funcional, base legal que la rige, regulaciones y procedimientos
    internos aplicables a la entidad; así como las metas y objetivos de las unidades administrativas de
    conformidad con sus programas operativos
  subnumerales:
  - numeral: '1.1'
    campos_exigidos:
    - Nivel superior
    - Unidad
    - Nivel de los procesos de la estructura
    periodicidad:
      estado: no_sustentado
      literal: null
      contenidos: &id001 []
  - numeral: '1.2'
    campos_exigidos:
    - Tipo de documento (base legal, regulación o procedimiento interno)
    - Descripción de la base legal, regulación o procedimiento interno
    - Enlace a la base legal, regulación o procedimiento interno
    periodicidad:
      literal: La actualización de los metadatos de este conjunto de datos será mensual y la periodicidad
        de generación de sus contenidos, será semestral o anual, acorde a la vigencia de las normas externas
        e internas.
      metadatos: mensual
      contenidos: &id002
      - semestral
      - anual
      estado: condicionada
      condicion: null
  - numeral: '1.3'
    campos_exigidos:
    - Unidad
    - Objetivo
    - Indicador
    - Meta cuantificable
    - Enlace al sistema de gestión de planificación para verificación de los indicadores y metas cuantificables
      por procesos o niveles
    periodicidad:
      literal: La actualización de los metadatos del conjunto de datos será mensual y la periodicidad
        de generación de sus contenidos, será semestral o anual, según varíen las estructuras orgánicas
        institucionales.
      metadatos: mensual
      contenidos: &id003
      - semestral
      - anual
      estado: condicionada
      condicion: según varía
  campos_exigidos:
  - Nivel superior
  - Unidad
  - Nivel de los procesos de la estructura
  - Tipo de documento (base legal, regulación o procedimiento interno)
  - Descripción de la base legal, regulación o procedimiento interno
  - Enlace a la base legal, regulación o procedimiento interno
  - Unidad
  - Objetivo
  - Indicador
  - Meta cuantificable
  - Enlace al sistema de gestión de planificación para verificación de los indicadores y metas cuantificables
    por procesos o niveles
  periodicidad:
    estado: por_subnumeral
    detalle:
      '1.1': *id001
      '1.2': *id002
      '1.3': *id003
