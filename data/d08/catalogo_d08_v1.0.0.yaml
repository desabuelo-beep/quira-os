# ═══════════════════════════════════════════════════════════════════════════════
# CATALOGO_D08_PARTICIPACION_CIUDADANA · v1.0.0 · 2026-07-23
# SSoT del dominio d08 (Participación Ciudadana). Neo4j deriva de aquí (Regla #6).
# Fuente BRN: familia CNO-VIII (000..007) + RO-VIII-001/002/003 — 12 cadenas verificadas
# contra el corpus (brn_cno.py). Diseño en 5 niveles + 3 dimensiones (aporte de Javo, 15
# años GAD): la Asamblea es ÓRGANO, no mecanismo; la participación se mide en integridad
# normativa + vitalidad democrática + efectividad/incidencia.
#
# FRONTERA d08/d09 (corrección de naturaleza · Javo): los aportes de d08 emanan de las
# instancias/mecanismos de participación (actas de PP, audiencias, cabildos), NO del informe
# de RDC (d09/control social). Mismo término, distinta fuente. NO se reusa enrich_aportes.py.
#
# NIVEL 4 · EVIDENCIA DOCUMENTAL: inventario real de
# Holding_Municipal_Montecristi/Participación Ciudadana, clasificado (tabla del asesor):
#   procesable · ocr_certificado · parcial · no_localizada
# ═══════════════════════════════════════════════════════════════════════════════
catalogo: CATALOGO_D08_PARTICIPACION_CIUDADANA
version: 1.0.0
dominio: d08
familia_cno: CNO-VIII
indicador_madre: IGP          # Índice de Gobernanza Participativa — vector del ICPI (se LEE del Gold Master, Regla 1/4)

# ── Las 3 dimensiones (Javo · 2026-07-23) ──────────────────────────────────────────
dimensiones:
  - id: integridad_normativa
    ro: RO-VIII-001
    pregunta: "¿existe / se instaló / convocó / documentó / aprobó cada instancia y mecanismo?"
    estado: operable          # se evalúa con la evidencia documental disponible
  - id: vitalidad_democratica
    ro: RO-VIII-002
    pregunta: "¿cuántos participaron y con qué diversidad territorial/género/generacional?"
    estado: diseno            # índice nace en el Gold Master (Regla 1/4) — pendiente de sellar con Javo
    fundamento: "LOPC 57 (diversidad como mandato)"
  - id: efectividad_incidencia
    ro: RO-VIII-003
    pregunta: "¿lo pedido en las instancias se volvió POA/PAC/presupuesto/obra?"
    estado: diseno            # motor de extracción de aportes de participación PENDIENTE (no es enrich_aportes.py)

# ── Naturaleza de verificación (asesor · 2026-07-24) — DOCTRINA · molde para d10/d11/d12 ──
# Distinción ORTOGONAL a las 3 dimensiones, que emergió al modelar el Sistema desde la Ley:
# cada componente de un dominio se verifica contra la Ley (estructural) o contra evidencia
# (operativo). Distinguirlo desde el inicio evita el error de marcar "sin evidencia" algo que
# es estructural (verificable por Ley). Esto simplifica los dominios que vienen.
naturaleza_verificacion:
  doctrina:
    estructural: "qué DEBE EXISTIR según la Ley (sistema · órganos/instancias · competencias) → se verifica contra la LEY (universal, SHA256) + conformación local (ordenanza/PDOT). NO requiere evidencia de 'operación'."
    operativa: "qué actos SE REALIZARON (audiencias · cabildos · PP · sesiones) → se verifica contra la EVIDENCIA documental de cada acto."
    mixta: "órgano con aspecto estructural (debe existir) Y operativo (debe actuar)."
    regla_de_oro: "un componente ESTRUCTURAL nunca se marca 'sin evidencia' por faltar la ordenanza local — su estructura es la de la Ley. (Error corregido hoy en el Sistema Cantonal, aporte de Javo.)"
  clasificacion_d08:
    estructural: [ sistema_cantonal, asamblea_ciudadana ]     # existen por Ley + conformación (PDOT)
    operativa: [ audiencia_publica, presupuesto_participativo, cabildo_popular ]   # actos verificados contra evidencia
    mixta: [ consejo_planificacion, silla_vacia ]             # órgano/norma (estructural) + resolución/ocupación (operativo)

# ── Señales SAT del Gold Master (OBS-016 · corrección Javo 2026-07-24) ──────────────
# Las SAT NO son 1:1 con mecanismos: son señales de alerta del motor (SAT-0..VIII por
# dimensión TGI). De todas, solo UNA es de participación:
sat_gold_master:
  existente:
    id: SAT-VI
    nombre: "Desvío Presupuesto Participativo"
    dimension_tgi: D4
    hoja: H24c_SAT-VI_DESVÍO_PP
    consumida_por: RO-VIII-003        # efectividad/incidencia
    estado: "sin datos (Hay_Datos_PP = NO) — coherente con OBS-015 (IGP_PP=0)"
  a_crear_fase_2: "las que hagan falta para vigilar la participación (a diseñar con Javo al operar el Excel) — NO 7 mecánicas"
  nota: "la verificabilidad documental por instancia (integridad, RO-VIII-001) NO es una SAT: es estado de evidencia."

# ── Instancias y mecanismos (jerarquía institucional) + evidencia ───────────────────
instancias:
  - cno: CNO-VIII-001
    mecanismo: sistema_cantonal
    tipo: estructura_permanente
    evidencia:
      estado: estructura_verificable_por_ley     # la estructura la da la Ley; la ordenanza la replica (Javo 2026-07-24)
      acreditacion: acreditada                    # estructura legal verificada (LOPC 64/65) + mecanismos operando (evidencia)
      nota: >-
        JERARQUÍA NORMATIVA (Javo · 2026-07-24): la estructura del Sistema de PC está normada en
        la LEY (LOPC 64/65 · CE 100 · COOTAD 304); la ordenanza municipal la REPLICA íntegra por
        mandato — la Ley está sobre la ordenanza. QUIRA evalúa el Sistema contra la estructura
        LEGAL (verificada, universal a los 222 GAD), SIN depender de la ordenanza específica.
        EVIDENCIA LOCAL AÑADIDA (PDOT · 2026-07-24): el PDOT de Montecristi (corpus, SHA verificado)
        DOCUMENTA la conformación del sistema — Tabla 202 (pág. 295-299) cita 3 ordenanzas: (1) del
        Sistema de Participación + Transparencia + Consejo de Planificación (sha 48b09357576b),
        (2) del Derecho de Participación por Silla Vacía, (3) Reformada de la Asamblea Ciudadana.
        El acto normativo NO solo se presume por mandato: está documentado localmente.
      evidencia_local_pdot:
        fuente: "PDOT-MONTECRISTI / PLAN-BICENTENARIO-MCR (corpus) · Tabla 202 · pág. 295-299 y 432"
        sha_ancla: "48b09357576b"
        ordenanzas_citadas: ["Sistema de Participación+Transparencia+Consejo Planificación", "Silla Vacía", "Asamblea Ciudadana (reformada)"]
        instancias_declaradas: ["Asamblea Ciudadana", "Silla vacía", "Asamblea sectorial", "Cabildos populares", "Rendición de Cuentas"]
  - cno: CNO-VIII-002
    mecanismo: asamblea_ciudadana
    tipo: organo_representacion_ciudadano_autonomo    # NO administrativo del GAD
    evidencia:
      estado: evidencia_indirecta                # la ACC es ciudadana autónoma — su doc. propia no es exigible al GAD
      esperada: "manifestación de la ACC en las actas de los mecanismos que avala (PP y demás)"
      nota: >-
        FRONTERA DOCTRINAL (aporte de Javo · 2026-07-23): la Asamblea Ciudadana Cantonal es
        una ESTRUCTURA CIUDADANA AUTÓNOMA, regulada por sus propios estatutos — "la organización
        social se regula sola". NO es parte administrativa del GAD; sus actas reposan en sus
        archivos (sin web, no accesibles). QUIRA NO audita el funcionamiento interno de la ACC
        (es ciudadanía, no GAD). Lo que audita es que el GAD la RECONOZCA y ARTICULE (COOTAD 306).
        La operatividad de la ACC se reconoce INDIRECTAMENTE en las actas de PP y demás mecanismos
        que ella avala — esas actas son la evidencia disponible de que la ACC opera.
  - cno: CNO-VIII-003
    mecanismo: consejo_planificacion
    tipo: organo_planificacion
    evidencia:
      estado: procesable
      formato: docx_y_pdf_texto
      documentos:
        - "RESOLUCION CONSEJO PLANIFICACION MONTECRISTI 2023 (docx)"
        - "1.2 RESOLUCIONES DEL CONSEJO DE PLANIFICACION 01 signed (docx) · 2024"
        - "2.1 RESOLUCION CONSEJO PLANIFICACION MONTECRISTI signed (docx) · 2024"
        - "RESOLUCION CONSEJO PLANIFICACION MONTECRISTI 03-signed-signed (pdf texto) · 2025"
      cobertura: "2023 · 2024 · 2025 — formalización por RESOLUCIÓN acreditada (contraste con audiencias)"
  - cno: CNO-VIII-004
    mecanismo: audiencia_publica
    tipo: mecanismo
    evidencia:
      estado: procesable
      formato: txt
      n: 28
      cobertura: "2023-2025 completo (28 actas, incluidas las 16 que estaban escaneadas — extraídas por Javo)"
      acreditacion: parcial          # el acto se realiza; su formalización resolutiva NO consta
      hallazgo: >-
        ★ OBS-017 — hallazgo empírico verificado: 28/28 actas citan expresamente los Arts. 73-75
        LOPC, 0/28 contienen la RESOLUCIÓN formal del Art. 75. Brecha sistemática entre
        cumplimiento narrado y documental (2023-2025). Delegación NO aplica: alcalde presente en
        las 28. Lenguaje de verificabilidad, no acusación (Regla 2).
  - cno: CNO-VIII-005
    mecanismo: presupuesto_participativo
    tipo: mecanismo
    naturaleza_juridica: vinculante
    evidencia:
      estado: procesable
      formato: docx_y_pdf_texto
      documentos:
        - "GAD Montecristi Informe Presupuesto Participativo 2024 (docx+pdf)"
        - "GAD Montecristi Informe Presupuesto Participativo 2025 (pdf texto · docx vacío)"
        - "GAD Montecristi Informe Presupuesto Participativo 2026 (docx+pdf)"
      cobertura: "2024 · 2025 · 2026 — también en corpus (PP-GAD-*) y Gold Master"
  - cno: CNO-VIII-006
    mecanismo: cabildo_popular
    tipo: mecanismo
    evidencia:
      estado: procesable
      formato: docx
      documentos: ["Cabildo popular 2025 (docx)"]
      cobertura: "2025"
  - cno: CNO-VIII-007
    mecanismo: silla_vacia
    tipo: mecanismo
    evidencia:
      estado: normada_operacion_no_evidenciada    # la ordenanza existe (PDOT); su OPERACIÓN (actas) no consta
      acreditacion: normada_sin_operacion
      esperada: "actas de sesiones del Concejo del GAD (donde constaría la ocupación de la silla)"
      nota: >-
        NORMADA localmente: el PDOT cita la "Ordenanza que regula el Derecho de Participación por
        Silla Vacía en las Sesiones del GAD Municipal de Montecristi" — el mecanismo está reglado
        y su norma verificada en el corpus. Lo que NO consta es su OPERACIÓN: si la silla se ocupó
        en las sesiones. Esa evidencia son las actas de sesión del Concejo, no disponibles hoy
        (Javo intentará 2025). Esas actas son la VETA del workstream futuro "Gobernanza
        Deliberativa del Concejo" — de ellas emana gran parte de la operatividad del GAD; fuera de d08.

# ── Clasificación documental canónica (tabla del asesor + terreno de Javo · 2026-07-23) ──
clasificacion_documental:
  procesable: "texto limpio (docx / pdf con capa de texto) — se ingiere ya"
  ocr_certificado: "documento oficial escaneado — requiere OCR certificado (probatorio)"
  parcial: "documento incompleto"
  existe_documento_no_accesible: "el hecho existe (confirmado), el documento no está disponible hoy — dato pendiente de acceso, NO hallazgo"
  evidencia_indirecta: "el hecho se reconoce por su manifestación en otros documentos (p. ej. la ACC en las actas de PP)"
  pendiente_adquisicion: "documento existe pero fuera de alcance de adquisición hoy (p. ej. actas de Concejo)"
  no_localizada: "no consta y no se ha confirmado su existencia — solo entonces es candidato a hallazgo (lo decide Javo)"

# ── Workstream futuro registrado (NO se abre ahora · asesor + Javo · 2026-07-24) ────
# Candidato a dominio propio, fuera del alcance de d08. Pasaría por el Protocolo de
# Expansión Ontológica (6 condiciones) si algún día se abre. Se registra para no perderlo.
workstream_futuro:
  nombre: "Gobernanza Deliberativa del Concejo Municipal"
  fuente: "actas ÍNTEGRAS de sesión del Concejo (hoy el GAD solo publica RESOLUCIONES · numeral 24 transparencia/d07)"
  permitiria:
    - "Silla Vacía (evidencia real de ocupación)"
    - "formación de consensos · cambios de proyectos"
    - "evolución de ordenanzas · trazabilidad deliberativa"
    - "congruencia entre debate y resolución"
  nota: "es un universo propio — NO contaminar d08 con este trabajo. La silla vacía en d08 queda como pendiente_adquisicion hasta que exista este workstream."

# ── Frontera doctrinal GAD / ciudadanía (aporte de Javo · 2026-07-23) ───────────────
# Distinción que QUIRA debe respetar en TODO el dominio de participación:
frontera_gad_ciudadania:
  audita_al_gad: "lo que el GAD debe conformar, convocar, documentar y garantizar (ordenanza del sistema, resoluciones del Consejo, informes de PP, actas de audiencias, silla vacía en sus sesiones)"
  no_audita_a_la_ciudadania: "la organización social autónoma se regula sola (estatutos propios). La ACC no se audita por dentro; QUIRA verifica que el GAD la RECONOZCA y ARTICULE (COOTAD 306), no que la ciudadanía sesione"
  implicacion: "la ausencia de documentación CIUDADANA (actas de la ACC) NUNCA es hallazgo contra el GAD — no es su documento. Solo la ausencia de lo que el GAD debe producir puede ser hallazgo."

# ── Fuentes del dominio ─────────────────────────────────────────────────────────────
fuentes:
  - id: rdc_mecanismos_participacion
    origen: "Informe RDC anual (CPCCS) · sección 'Mecanismos de Participación Ciudadana'"
    tipo: declaracion_con_medio_de_verificacion
    misma_fuente_que: d09           # el informe RDC es fuente compartida (como la cédula d07↔d01↔d02)
    nota: >-
      PUENTE ESTRUCTURAL d09↔d08 (Javo · 2026-07-24): el GAD DECLARA cada mecanismo (SÍ/NO) en su
      RDC —control social, d09— y aporta un LINK de verificación oficial. d08 VERIFICA el contenido
      de esos links contra la norma. La brecha entre lo DECLARADO (p. ej. "Audiencia Pública: SÍ")
      y lo VERIFICABLE (28 actas sin resolución Art.75, OBS-017) es el hallazgo. NO existe otra
      evidencia: estos son los documentos que el propio GAD designa como prueba.
    declarados_2023_2025: { asamblea_local: SI, audiencia_publica: SI, cabildo_popular: SI, consejo_planificacion: SI, otros: NO }
    links_verificacion:
      asamblea_local: "cloud.montecristi.gob.ec/index.php/s/EjFCAgyasTiWZ4e"
      audiencia_publica: "cloud.montecristi.gob.ec/index.php/s/yKbMxSdB49GxexE"
      cabildo_popular: "cloud.montecristi.gob.ec/index.php/s/4qgix3o9c4X94DT"
      consejo_planificacion: "cloud.montecristi.gob.ec/index.php/s/n6AeGJLpXpB2Kry"
    nota_asamblea: >-
      El GAD declara "Asamblea Local: SÍ" y su link se sustenta en las ACTAS DE PP (Javo ·
      2026-07-24): la ACC es ente ciudadano AUTÓNOMO (estatutos propios) y NO entrega actas
      propias al GAD — por eso su acreditación es evidencia_indirecta, coherente con la frontera
      GAD/ciudadanía. Toda la evidencia de d08 se descargó de estos 4 links.
  - id: carpeta_participacion_mcr
    origen: "Holding_Municipal_Montecristi/Participación Ciudadana (documentos descargados de los links RDC)"
    tipo: documento_oficial
  - id: gold_master_igp
    origen: "Gold Master — IGP (vector del ICPI)"
    tipo: excel_indice
    nota: "se LEE, no se recalcula (Regla 1/4)"
  - id: corpus_pp
    origen: "Supabase — PP-GAD-2024/2025/2026 (ya ingerido)"
    tipo: corpus_semantico

municipio_molde: MCR-001
