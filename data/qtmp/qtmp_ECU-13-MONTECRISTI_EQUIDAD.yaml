# ============================================================
# RELACIONES INTER-CIRCUITO (EQUIDAD como nodo transversal)
# ============================================================

RELACIONES_INTER_CIRCUITO:

  # EQUIDAD ↔ GAP_10PCT
  - origen: IND_EQUD_01_MCR
    destino: IND_G10P_01_MCR
    tipo: CORRELACION_CAUSAL
    descripcion: >
      Si el GAD incumple la asignación 10% GAP (COOTAD_249),
      la inversión en grupos prioritarios baja → IRS baja.
      Correlación esperada: IND_G10P_01 < 10 → IRS deteriora.

  # EQUIDAD ↔ AGUA_POTABLE
  - origen: IND_EQUD_04_MCR
    destino: IND_AGPT_01_MCR
    tipo: COMPONENTE_DE
    descripcion: >
      La brecha de cobertura de agua potable rural vs urbana
      es una de las expresiones más tangibles de la inequidad
      territorial. IND_AGPT_01 (cobertura agua) es parte del
      cálculo de NBI → parte del IRS.

  # EQUIDAD ↔ PRESUPUESTO (Dom02)
  - origen: SP_EQUD_MCR
    destino: SP_AGPT_MCR
    tipo: CONDICIONA
    descripcion: >
      La distribución territorial de la inversión (EQUIDAD)
      determina cuánto del presupuesto llega a obras rurales
      de agua potable, GAP, vialidad. EQUIDAD es el circuito
      que explica POR QUÉ los servicios son desiguales.

# ============================================================
# HIPÓTESIS CAUSAL QUIRA — Circuito EQUIDAD
# ============================================================
# Esta sección contiene la hipótesis de investigación que
# QUIRA puede verificar empíricamente cuando los C9 sean
# poblados con datos reales.
# ============================================================

HIPOTESIS_CAUSAL:

  id: HIP_EQUD_01_MCR
  enunciado: >
    El IRS 79.7 de Montecristi refleja una distribución
    de inversión pública que favorece marginalmente la zona
    urbana sobre las parroquias rurales. Esta brecha es
    explicada por: (a) concentración histórica de obras en
    cabecera cantonal, (b) menor ejecución de proyectos
    rurales vinculados al PDOT, y (c) subcobertura del
    presupuesto participativo parroquial (COOTAD_302).
  variables_independientes:
    - inversion_rural_pct (IND_EQUD_02)
    - cumplimiento_pdot_parroquial (IND_EQUD_03)
    - cobertura_participacion_parroquial (IND_EQUD_06)
  variable_dependiente: IRS_cantonal (IND_EQUD_01)
  falsificacion: >
    Si inversion_rural_pct >= poblacion_rural_pct Y
    cumplimiento_pdot_parroquial >= 70 → la hipótesis es falsa
    y la brecha IRS tiene otra causa (externo al GAD).
  estado: pendiente_datos
  accion_quira: >
    Al poblar C9 RES_EQUD_02 con datos Gold Master,
    se puede hacer el primer test de falsificación.

