#   MATCH (c:Canton {id: 'ECU-13-MONTECRISTI'})
#   MATCH (c)<-[:ANCLADO_EN]-(sp:C3ServicioPublico {circuito_id: 'EQUIDAD'})
#   MATCH (sp)-[:SE_EJECUTA_EN]->(prc:C4Proceso)
