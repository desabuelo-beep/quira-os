# ACK → QTMP (materialización):
#   CE_274       -[:HABILITA]->        SP_EQUD_MCR
#   COOTAD_228   -[:MATERIALIZA_VIA]-> SP_EQUD_MCR
#   COOTAD_215   -[:CONTROLA]->        CTL_EQUD_02_MCR
#   COPLAFIP_83  -[:NORMA]->           OBS_EQUD_03_MCR
#
# Corpus QTMP Montecristi post-EQUIDAD v3 (7 parroquias confirmadas PDOT KB):
#   AGUA_POTABLE:  30+ nodos (cantonal) — RES_AGPT_01 confirmado 34.9%
#   GAP_10PCT:     ~40 nodos (cantonal)
#   EQUIDAD:       65 nodos (cantonal + 21 parroquial) + 3 inter-circuito
#   Parroquias:    7 nodos Parroquia (MCU/LPL/CLR/PRN/ANS/GEA/ISM)
#   ─────────────────────────────────────────────────────────────────
#   TOTAL MCR:     ~140+ nodos
#
# C9 confirmados: RES_EQUD_04_MCR (brecha 32pp ROJO) · RES_AGPT_01_MCR (34.9%)
#                 RES_AGPT_02_MCR (continuidad 0%) · RES_EQUD_01_MCR (IRS 79.7)
# C9 pendientes:  21 nodos parroquiales (microdatos INEC 2022 requeridos)
# ============================================================
#
# NOTA METODOLÓGICA:
#   EQUIDAD es el primer circuito transversal de QUIRA.
#   Los circuitos AGUA_POTABLE y GAP_10PCT son sectoriales.
#   EQUIDAD los conecta: explica POR QUÉ los servicios
#   sectoriales tienen brechas. Es el circuito explicativo.
#
#   Jerarquía causal:
#     EQUIDAD (C3 SP_EQUD) → explica →
#     AGUA_POTABLE (C3 SP_AGPT) + GAP_10PCT (C3 SP_G10P)
#
#   En Neo4j esto habilita:
#     "¿Por qué la cobertura de agua en La Pila es 60%?"
#     ← COOTAD_228 incumplimiento → inversión rural baja
#     → brecha NBI rural no se cierra → IRS 79.7 (amarillo)
# ============================================================
