#   MATCH (ctl)-[:EXPONE_A]->(obs:C7Observabilidad)
#   MATCH (obs)-[:MIDE]->(ind:C8Indicador)
#   MATCH (ind)-[:REGISTRA]->(res:C9ResultadoTerritorial)
#   RETURN sp, ind.nombre, res.valor, ind.semaforo_actual
