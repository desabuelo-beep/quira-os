#   RES_EQUD_04_MCR -[:DESAGREGA_EN]-> RES_EQUD_04_{MCU|LPL|CLR|PRN|ANS|GEA|ISM}
#   RES_EQUD_02_MCR -[:DESAGREGA_EN]-> RES_EQUD_02_{MCU|LPL|CLR|PRN|ANS|GEA|ISM}
#
# Cypher — ancla del circuito:
#   MERGE (canton:Canton {id: 'ECU-13-MONTECRISTI'})
#   MERGE (sp:C3ServicioPublico {id: 'SP_EQUD_MCR'})
#   SET sp.circuito_id = 'EQUIDAD', sp.canton_id = 'ECU-13-MONTECRISTI'
#   MERGE (canton)<-[:ANCLADO_EN]-(sp)
#   MATCH (ack:Atom {id: 'COOTAD_228'})
#   MERGE (ack)-[:MATERIALIZA_VIA]->(sp)
#
# Cypher — desagregación parroquial (template para los 15 nodos):
#   MERGE (res_canton:C9ResultadoTerritorial {id: 'RES_EQUD_01_MCR'})
#   MERGE (res_par:C9ResultadoTerritorial {id: 'RES_EQUD_01_LPL'})
#   SET res_par.nivel_territorial = 'parroquia',
#       res_par.territorio = 'La Pila',
#       res_par.canton_id = 'ECU-13-MONTECRISTI',
#       res_par.estado_dato = 'pendiente_validacion'
#   MERGE (res_canton)-[:DESAGREGA_EN]->(res_par)
#
# Cypher — query brecha parroquial:
#   MATCH (c:C9ResultadoTerritorial {id: 'RES_EQUD_04_MCR'})
#   MATCH (c)-[:DESAGREGA_EN]->(p:C9ResultadoTerritorial)
#   RETURN p.territorio, p.valor
#   ORDER BY p.valor DESC  // mayor NBI primero = más vulnerable
#
# Cypher — relación inter-circuito:
#   MATCH (a:C8Indicador {id: 'IND_EQUD_01_MCR'})
#   MATCH (b:C8Indicador {id: 'IND_G10P_01_MCR'})
#   MERGE (a)-[:CORRELACION_CAUSAL {descripcion: 'GAP < 10% → NBI rural deteriora'}]->(b)
