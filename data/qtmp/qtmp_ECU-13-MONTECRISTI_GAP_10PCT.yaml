PROCESOS:

  - id: PRO_G10P_01_MCR
    nombre: Programación Presupuestaria 10% GAP
    tipo_proceso: administrativo
    descripcion: >
      Identificación y separación de la partida presupuestaria obligatoria
      del 10% del presupuesto no salarial del GADMCM para programas GAP
      (COOTAD_249). Proceso anual de formulación presupuestaria que garantiza
      que la asignación cumpla el mínimo legal. Base para todo el circuito GAP.
      Actores: Dirección Financiera + Dirección Planificación Estratégica.
    actor_ref: Director/a Financiero GADMCM + Director/a Planificación Estratégica
    estado: activo
    anio_poa: "2026"
    partida_presupuestaria: pendiente
    nota: >
      Esta es la condición sine qua non del circuito. Si la partida no se
      programa correctamente (< 10% del no-salarial), todo lo demás falla.
      El dato real está en SIGEF y en el Gold Master GADMCM.

  - id: PRO_G10P_02_MCR
    nombre: Programas para Adultos Mayores
    tipo_proceso: operativo
    descripcion: >
      Ejecución de servicios y programas para personas adultas mayores del cantón
      conforme LOAPAM: centros de día, alimentación, actividades de desarrollo,
      atención domiciliaria. El Patronato Municipal es el ejecutor principal.
      Mandato: LOAPAM_84 (atribuciones GAD adultos mayores).
    actor_ref: Directora/Director Ejecutiva/o Patronato Municipal GADMCM
    estado: activo
    anio_poa: "2026"
    partida_presupuestaria: pendiente
    poblacion_objetivo: adultos_mayores_canton_montecristi

  - id: PRO_G10P_03_MCR
    nombre: Programas para Personas con Discapacidad
    tipo_proceso: operativo
    descripcion: >
      Ejecución de programas de inclusión, atención y equiparación de
      oportunidades para personas con discapacidad del cantón. Incluye:
      accesibilidad universal (LOD_58 ordenanza), inclusión laboral 4% en
      GADMCM (LOD_47), atención directa del Patronato, y programas de vivienda
      accesible (LOD_56). Coordinación con MIES y CONADIS.
    actor_ref: Directora/Director Ejecutiva/o Patronato Municipal GADMCM
    estado: activo
    anio_poa: "2026"
    partida_presupuestaria: pendiente
    poblacion_objetivo: personas_con_discapacidad_canton_montecristi

  - id: PRO_G10P_04_MCR
    nombre: Protección de Niñez y Adolescencia (NNA)
    tipo_proceso: operativo
    descripcion: >
      Ejecución de programas de protección, desarrollo y restitución de derechos
      para niñas, niños y adolescentes del cantón. JCPD (CONA_207) como mecanismo
      de protección institucional. Principio de prioridad absoluta (CONA_12).
      Patronato como ejecutor de programas de desarrollo infantil y apoyo familiar.
    actor_ref: Junta Cantonal de Protección de Derechos (JCPD) + Patronato GADMCM
    estado: activo
    anio_poa: "2026"
    partida_presupuestaria: pendiente
    poblacion_objetivo: nna_canton_montecristi

  - id: PRO_G10P_05_MCR
    nombre: Atención a Personas en Movilidad Humana
    tipo_proceso: operativo
    descripcion: >
      Implementación de políticas y programas para personas en situación de
      movilidad humana (migrantes, refugiados, retornados) en el cantón.
      PDOT debe integrar este eje (LOMH_165). Programas transversalizados
      en la gestión municipal (LOMH_167). Zona Manabí: alta relevancia por
      migración interna y retorno post-crisis (terremoto 2016 secuelas).
    actor_ref: Patronato GADMCM / Dirección de Planificación Estratégica
    estado: activo
    anio_poa: "2026"
    partida_presupuestaria: pendiente
    poblacion_objetivo: personas_movilidad_humana_canton_montecristi

  - id: PRO_G10P_06_MCR
    nombre: Seguimiento y Rendición de Cuentas GAP
    tipo_proceso: control_interno
    descripcion: >
      Monitoreo trimestral del cumplimiento del 10% GAP: ejecución presupuestaria,
