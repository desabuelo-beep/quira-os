SERVICIO_PUBLICO:
  id: SP_G10P_MCR
  nombre: Atención Integral a Grupos de Atención Prioritaria — Montecristi
  descripcion: >
    Prestación de servicios sociales, programas de protección, inclusión y
    desarrollo para grupos de atención prioritaria del cantón Montecristi:
    adultos mayores, personas con discapacidad, niñez y adolescencia (NNA),
    personas en situación de movilidad humana, y otros grupos vulnerables.
    La obligación normativa es dual: (a) asignación presupuestaria mínima del
    10% del presupuesto no salarial (COOTAD_249), y (b) prestación efectiva
    de programas con resultados medibles en territorio (CE_35, F0.5 corpus).
  dominio_tgi: Dom12
  tgi_dimension: D12_SOCIAL
  competencia_fuente: COOTAD_249
  competencias_concurrentes:
    - CE_35
    - CONA_12
    - CONA_207
    - LOAPAM_84
    - LOD_47
    - LOD_56
    - LOD_58
    - LOMH_165
    - LOMH_167
  modalidad: entidad_adscrita
  nota_modalidad: >
    El GADMCM ejecuta los programas GAP principalmente a través del
    Patronato Municipal de Amparo Social (Entidad Adscrita — Estatuto 040-2025).
    Adicionalmente, la Junta Cantonal de Protección de Derechos (JCPD) opera
    como mecanismo de protección NNA (CONA_207). El 10% COOTAD_249 puede incluir
    también inversiones directas del GAD en accesibilidad e inclusión.
  grupos_prioritarios:
    - adultos_mayores
    - personas_con_discapacidad
    - nna_ninos_adolescentes
    - movilidad_humana
    - otros_vulnerables
  cobertura_actual_pct: null
  meta_cobertura_pdot: null
  nota_cobertura: >
    Valores pendientes validación contra Gold Master y datos INEC 2022.
    Montecristi: provincia Manabí — zona costera con alta diversidad
    de grupos prioritarios incluyendo migrantes y retornados.

