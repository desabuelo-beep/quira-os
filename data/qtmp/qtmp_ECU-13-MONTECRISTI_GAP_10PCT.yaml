      (partida_GAP_codificada / presupuesto_GAD_no_salarial_codificado) × 100
      — VERSIÓN CODIFICADO: verifica compliance formal de asignación.
      — VERSIÓN DEVENGADO: (GAP_devengado / GAD_no_salarial_devengado) × 100
        → muestra si la EJECUCIÓN real también cumple el 10%.
      Nota: la norma dice "asignar partida" → compliance formal = codificado.
      QUIRA muestra AMBAS versiones: asignado vs. ejecutado.
    fuente_dato: >
      H01_PARÁMETROS Gold Master (Presupuesto_Patronato = piso 10%) /
      SIGEF cédula anual GAD 2025 (denominador: total no-salarial)
    frecuencia: anual
    unidad: porcentaje
    valor_linea_base: null
    meta_anual: ">= 10"
    umbral_verde: ">= 10"
    umbral_amarillo: ">= 7 y < 10"
    umbral_rojo: "< 7"
    nota_umbral: >
      El 10% es el mínimo legal (COOTAD_249). ROJO = incumplimiento normativo
      = glosa CGE potencial. VERDE = cumple mínimo.
      HALLAZGO 2026-05-31: el Gold Master parameteriza el piso en $2,668,914.70
      ("10% del GAD central"). Evidencia sugiere que la asignación (codificado)
      cumple el piso — el problema es la EJECUCIÓN (Ti=50%).
      Esto significa: el GAD cumple FORMALMENTE con COOTAD_249 pero el Patronato
      no ejecuta la inversión → la norma se cumple en papel, no en territorio.
    estado_dato: pendiente_validacion
    fuente_requerida: SIGEF_CEDULA_GAD_2025_TODOS_GRUPOS
    naturaleza_valor: calculado

