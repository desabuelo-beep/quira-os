# ============================================================
# QUIRA — QTMP Instance v1.0
# Segundo circuito territorial materializado en el sistema QUIRA
# ============================================================
# QTMP_ID:   QTMP_TRANSPARENCIA_MCR
# Cantón:    Montecristi — ECU-13-MONTECRISTI
# Circuito:  TRANSPARENCIA
# Versión:   1.0
# Estado:    n4_verificado — N4 completado 2026-06-01 · DPE canónico
# Fecha:     2026-06-01
#
# Propósito: Materializar la cadena C3→C9 para el circuito de
#            transparencia e información pública en el cantón Montecristi.
#            Segundo archivo QTMP del sistema QUIRA — valida la arquitectura
#            QNKC-002 en el dominio de la observabilidad institucional.
#
# Principio arquitectónico crítico (ADR-012 confirmado):
#   OBLIGACIÓN SUSTANTIVA ≠ VENTANA DE OBSERVACIÓN
#   → LOTAIP no crea la obligación de producir información; crea la
#     ventana de observación sobre obligaciones que nacen en CE/COOTAD/LOSNCP.
#   → C2 (Competencial): COOTAD/LOSNCP/CE
#   → C4 (Proceso/Observación): LOTAIP Art. 19 (25 numerales — LOTAIP 2.0)
#
# Base normativa:
#   CE_18    → Derecho a buscar, recibir, conocer y difundir información
#   CE_91    → Acción de acceso a información pública como garantía jurisdiccional
#   CE_226   → Principio de legalidad — solo competencias atribuidas por ley
#   COOTAD_302 → Obligación sustantiva de rendición de cuentas anual del Alcalde
#   LOSNCP_21  → Obligación sustantiva: publicar PAC en SERCOP antes del 15-ene
#   COOTAD_215 → Obligación sustantiva: información presupuestaria verificable
#   LOTAIP_19  → Ventana de observación: 25 numerales de publicación activa (LOTAIP 2.0)
#   LOTAIP_47  → Consecuencia: sanciones por incumplimiento (DPE activa)
#
# Fuente orgánica local:
#   Resolución Administrativa No. 040-2025-ALC-LJTL-GADMCM
#   Estatuto Orgánico GADMCM — vigente desde 01-ene-2026
#
# Cypher Neo4j — cadena completa del circuito:
#   MATCH (canton:Canton {id: 'ECU-13-MONTECRISTI'})
#   MATCH (ack_ce18:Atom {id: 'CE_18'})
#   MERGE (sp:C3ServicioPublico {id: 'SP_TRANS_MCR'})
#     SET sp.canton_id = 'ECU-13-MONTECRISTI', sp.nombre = 'Transparencia'
#   MERGE (ack_ce18)-[:MATERIALIZA_VIA]->(sp)
#   MERGE (sp)-[:ANCLADO_EN]->(canton)
#   MERGE (pro:C4Proceso {id: 'PRO_TRANS_01_MCR'})
#   MERGE (sp)-[:SE_EJECUTA_EN]->(pro)
#   -- continúa C5→C9 según cadena QNKC-002
# ============================================================

QTMP_ID: QTMP_TRANSPARENCIA_MCR
CIRCUITO_ID: TRANSPARENCIA
CANTON_ID: ECU-13-MONTECRISTI
VERSION: "1.0"
ESTADO: n4_verificado

META:
  fecha_creacion: "2026-06-01"
  creado_por: QLEP-QTMP-v1.0
  canton_responsable: GAD Municipal Montecristi (GADMCM)
  fuente_organica: >
    Resolución Administrativa No. 040-2025-ALC-LJTL-GADMCM —
    Estatuto Orgánico de Gestión Organizacional por Procesos del
    Gobierno Autónomo Descentralizado Municipal de Montecristi.
    Aprobado en Sesión Ordinaria N° 148 del 2 de octubre de 2025.
    Vigente desde el 1 de enero de 2026.
  revisado_por_experto: false
  nota_revision: >
    N4 completado 2026-06-01 — portal DPE auditado 16 meses. Pendiente
    validación con el GADMCM:
    (a) confirmación del servidor designado como Responsable de Acceso a la
        Información Pública (LOTAIP) y su resolución de designación,
    (b) CONFIRMADO N4: los 25 numerales LOTAIP Art. 19 (LOTAIP 2.0) están
        publicados en los 16 meses auditados (C5a=1.00, C5b_acc=1.00).
        Hallazgo crítico: atraso sistémico — C5t=0.00 en todos los meses,
        rango 30–139 días. Fuente: Portal DPE (transparencia.dpe.gob.ec),
        entidad ID=937. El portal GAD (montecristi.gob.ec) no es la fuente
        canónica de verificación — DPE consolida el estado de todos los GADs.
    (c) número y estado de solicitudes de información (SAIP) en 2024-2025,
    (d) cédula presupuestaria del área de comunicación/transparencia en SIGEF,
    (e) verificación de designación del funcionario responsable conforme
        Estatuto Orgánico 040-2025.

# ============================================================
# NOTA_N4 — Auditoría empírica DPE · 2026-06-01
# ============================================================

NOTA_N4:
  tipo: auditoria_empirica
  fecha_auditoria: "2026-06-01"
  auditor: QUIRA Operaciones — QLEP-QTMP-v1.0
  fuente_auditoria: >
    Portal DPE — transparencia.dpe.gob.ec. Sistema de Publicación de
    Información por Entidades. Método: API REST DPE, endpoint
    /backend/v1/transparency/transparency/active/public?establishment_id=937
    &year={y}&month={m}. GADMCM: establishment_id=937, RUC=1360001010001.
    Período: enero 2025 – abril 2026 (16 meses consecutivos).
  hallazgos:
    c5a: "1.00 — El GADMCM publicó los 25 numerales en los 16 meses auditados."
    c5b_acc: "1.00 — 25/25 numerales presentes en cada período verificado."
    c5t: >
      0.00 — ATRASO SISTÉMICO. Ningún mes publicó antes del día 15 del
      mes siguiente (plazo LOTAIP). Rango de atraso: 30–139 días.
      Primera falsificación empírica del supuesto C5b=1 pre-N4.
    c5c: "0.75 — Comprensibilidad estimada por evaluación técnica preliminar."
    c8_resultado: >
      0.00 — Cadena C5a × C5b_acc × C5t × C5c colapsa a 0 porque C5t=0.00.
      Transparencia presente (publican todo) pero no oportuna (siempre tarde).
  adrs_relacionados:
    - "ADR-015 — OBS-QNKC-02 validada · cerrado 2026-06-01"
    - "ADR-012 — OBLIGACIÓN SUSTANTIVA ≠ VENTANA DE OBSERVACIÓN confirmado"
    - "ADR-014 — Sprint 4 Dom07 marcado VERIFICADO"
  estado_circuito_post_n4: >
    Dom07 VERIFICADO. Estructura COMPLETA. Datos N4 confirmados para
    RES_TRANS_01 (C8=0.00) y RES_TRANS_02 (100% cobertura). Pendiente:
    N3 (carga Neo4j) para alcanzar estado DEC.

# ============================================================
# C3 — SERVICIO PÚBLICO
# La obligación jurídica materializada como prestación ciudadana
# ============================================================

SERVICIO_PUBLICO:
  id: SP_TRANS_MCR
  nombre: Acceso Efectivo a Información Institucional — Montecristi
  descripcion: >
    Prestación del servicio de acceso a información pública del cantón
    Montecristi: publicación activa de información institucional, atención
    de solicitudes ciudadanas de información, rendición de cuentas anual,
    y publicación de procesos de contratación. El GAD Municipal tiene la
    obligación de producir, mantener y hacer disponible la información
    que la ley le manda publicar — y el ciudadano tiene el derecho
    constitucional de acceder a ella sin justificación previa.
    El resultado es la capacidad efectiva de escrutinio ciudadano.
  dominio_tgi: Dom07
  tgi_dimension: D7_TRANSPARENCIA
  competencia_fuente: CE_18
  competencias_concurrentes:
    - CE_91
    - CE_226
    - COOTAD_302
    - LOSNCP_21
    - COOTAD_215
  modalidad: directa
  nota_modalidad: >
    GADMCM gestiona el servicio directamente. Conforme Estatuto Orgánico
    040-2025 y LOTAIP Art. 9, el Alcalde designa un Responsable de Acceso
    a la Información Pública (RAIP). La Dirección de Comunicación Social
    o la Secretaría General ejecuta la publicación en el portal web.
    La Dirección Financiera provee datos de ejecución presupuestaria
    para publicación en SIGEF. La UGP/Compras Públicas publica el PAC
    en SERCOP.
  pregunta_bautismal: >
    ¿Qué información que el municipio tiene obligación legal de publicar
    no está disponible, no está actualizada o no es comprensible,
    y cuál es la consecuencia institucional de esa opacidad?

# ============================================================
# IMPLEMENTACION_LOCAL — ACTOR LATERAL (QNKC-002)
# El servidor/dirección que ejecuta pero NO es parte de la cadena causal.
# Neo4j: (Proceso:C4)-[:EJECUTADO_POR]->(Actor)-[:PERTENECE_A]->(Institucion)
# ============================================================

IMPLEMENTACION_LOCAL:
  actor_local: >
    pendiente — Responsable de Acceso a la Información Pública (RAIP)
    del GADMCM, designado conforme LOTAIP Art. 9. Puede ser el/la
    Director/a de Comunicación Social o el/la Secretario/a General,
    según resolución de designación vigente del Alcalde.
  institucion_local: >
    Gobierno Autónomo Descentralizado Municipal del Cantón Montecristi (GADMCM)
    — área de Comunicación Social / Secretaría General / Unidad de Transparencia
    (nombre exacto pendiente verificación en Resolución 040-2025;
    el Estatuto establece proceso de Gobernabilidad y Transparencia
    como parte de los Procesos Adjetivos de Asesoría).
  autoridad_maxima: >
    Ing. Luis Jonathan Toro Largacha — Alcalde del cantón Montecristi
    (Resolución Administrativa No. 040-2025-ALC-LJTL-GADMCM)
  fuente_organica: Resolución Administrativa No. 040-2025-ALC-LJTL-GADMCM
  validado: false

# ============================================================
# C4 — PROCESOS
# Los procesos de publicación y atención mediante los cuales el servicio
# se ejecuta. LOTAIP Art. 19 define la VENTANA DE OBSERVACIÓN — los
# 21 numerales son los estados observables, no la fuente de la obligación.
#
# Estados de observación por numeral (observable por QUIRA y ciudadanos):
#   PUBLICADO       — información accesible, completa y comprensible
#   ATRASADO        — publicada pero fuera del plazo LOTAIP (>90 días)
#   INCOMPLETO      — publicada parcialmente; faltan campos o períodos
#   INCOMPRENSIBLE  — publicada pero en formato ilegible/inutilizable
#   NO_PUBLICADO    — no consta en portal; obligación incumplida
# ============================================================

PROCESOS:

  - id: PRO_TRANS_01_MCR
    nombre: Publicación Activa LOTAIP — Portal Web Institucional
    tipo_proceso: publicacion
    descripcion: >
      Publicación de los 25 numerales del Art. 19 de LOTAIP (LOTAIP 2.0)
      en el portal web del GADMCM. Obligación: publicación mensual con
      plazo máximo hasta el día 15 del mes siguiente. Incluye: orgánico-
      funcional, POA, presupuesto, contratos, remuneraciones, servicios,
      indicadores de gestión, y demás numerales establecidos en la reforma
      LOTAIP 2.0 (amplió de ~14 a 25 numerales). El RAIP es el responsable
      de mantener el portal actualizado y de verificar la comprensibilidad
      de la información publicada. N4 (2026-06-01): 25/25 publicados en
      todos los meses auditados — pero con atraso sistémico (C5t=0.00).
    actor_ref: RAIP GADMCM / Director/a Comunicación Social
    base_normativa: LOTAIP_19
    numerales_totales: 25
    estado: activo
    estados_posibles: [PUBLICADO, ATRASADO, INCOMPLETO, INCOMPRENSIBLE, NO_PUBLICADO]
    estado_actual: auditado_n4_atraso_sistemico
    frecuencia_obligatoria: trimestral
    anio_poa: "2026"
    partida_presupuestaria: pendiente

  - id: PRO_TRANS_02_MCR
    nombre: Publicación Información Financiera — SIGEF
    tipo_proceso: publicacion
    descripcion: >
      Publicación de la ejecución presupuestaria del GADMCM a través del
      Sistema Integrado de Gestión Financiera (SIGEF). El Ministerio de
      Finanzas consolida y publica la ejecución de todos los GADs en tiempo
      real. La Dirección Financiera del GADMCM alimenta el sistema con:
      presupuesto aprobado, codificado, devengado y pagado, por partidas.
      Comprende: cédula presupuestaria, ejecución de ingresos, transferencias
      del Gobierno Central, y deuda pública municipal.
    actor_ref: Director/a Financiero/a GADMCM
    base_normativa: COOTAD_215
    estados_posibles: [PUBLICADO, ATRASADO, INCOMPLETO, INCOMPRENSIBLE, NO_PUBLICADO]
    estado_actual: pendiente_verificacion
    frecuencia_obligatoria: mensual
    anio_poa: "2026"
    partida_presupuestaria: pendiente

  - id: PRO_TRANS_03_MCR
    nombre: Publicación Contratación Pública — SERCOP y PAC
    tipo_proceso: publicacion
    descripcion: >
      Publicación del Plan Anual de Contratación (PAC) en el portal del
      SERCOP antes del 15 de enero de cada año (LOSNCP Art. 21). Publicación
      de todos los procesos de contratación, pliegos, contratos adjudicados,
      y actas de entrega-recepción. El portal SERCOP es la fuente observable:
      cualquier ciudadano puede verificar si el GADMCM cumple con la
      obligación de transparencia en contratación. Contratos no publicados
      carecen de eficacia jurídica.
    actor_ref: Unidad de Gestión de Proyectos / Compras Públicas GADMCM
    base_normativa: LOSNCP_21
    estados_posibles: [PUBLICADO, ATRASADO, INCOMPLETO, INCOMPRENSIBLE, NO_PUBLICADO]
    estado_actual: verificar
    frecuencia_obligatoria: permanente
    anio_poa: "2026"
    partida_presupuestaria: pendiente

  - id: PRO_TRANS_04_MCR
    nombre: Atención Solicitudes de Información Pública — SAIP
    tipo_proceso: atencion_ciudadana
    descripcion: >
      Recepción, tramitación y respuesta a solicitudes de acceso a
      información pública conforme LOTAIP Art. 20. Plazo máximo de
      respuesta: 10 días hábiles (LOTAIP Art. 34). El RAIP coordina
      internamente la entrega de información solicitada. Si la
      institución no responde en plazo → silencio positivo: la
      información se presume pública. Si niega información →
      recurso ante DPE. Indicador de calidad institucional: tasa
      de respuesta oportuna y tasa de negativas justificadas.
    actor_ref: RAIP GADMCM
    base_normativa: LOTAIP_20
    plazo_respuesta_dias: 10
    estados_posibles: [RESPONDIDA_PLAZO, RESPONDIDA_TARDIO, NEGADA_JUSTIFICADA, NEGADA_INJUSTIFICADA, SIN_RESPUESTA]
    estado_actual: pendiente_verificacion
    frecuencia_obligatoria: permanente
    anio_poa: "2026"
    partida_presupuestaria: pendiente

  - id: PRO_TRANS_05_MCR
    nombre: Rendición de Cuentas Anual — Alcalde GADMCM
    tipo_proceso: rendicion_cuentas
    descripcion: >
      Proceso de rendición de cuentas anual del Alcalde conforme COOTAD
      Art. 302 y Ley Orgánica de Participación Ciudadana. El Alcalde
      rinde cuentas ante la ciudadanía sobre la gestión del año anterior:
      metas cumplidas, presupuesto ejecutado, proyectos entregados, y
      estado de todos los servicios municipales. El informe debe ser
      presentado públicamente y publicado en el portal. El CPCCS verifica
      el cumplimiento del proceso. La no realización de la rendición de
      cuentas es una infracción grave conforme LOPC.
    actor_ref: Alcalde GADMCM
    base_normativa: COOTAD_302
    estados_posibles: [REALIZADA_PLAZO, REALIZADA_TARDIO, INCOMPLETA, NO_REALIZADA]
    estado_actual: pendiente_verificacion
    frecuencia_obligatoria: anual
    anio_poa: "2026"
    partida_presupuestaria: pendiente

# ============================================================
# C5 — EVIDENCIAS
# Los documentos y registros que prueban la ejecución del servicio
# de transparencia — verificables por terceros sin acceso interno
# ============================================================

EVIDENCIAS:

  - id: EVD_TRANS_01_MCR
    tipo: portal_transparencia
    descripcion: >
      Portal LOTAIP GADMCM — sección de transparencia activa en el
      sitio web institucional con los 21 numerales del Art. 19 de LOTAIP
      publicados. La URL del portal es la evidencia primaria y observable
      por cualquier ciudadano. Estado de cada numeral (PUBLICADO/NO_PUBLICADO/
      INCOMPLETO/ATRASADO) es verificable directamente. Fecha de última
      actualización visible. El portal es la fuente de evidencia central
      de todo el circuito de transparencia.
    proceso_ref: PRO_TRANS_01_MCR
    obligatoria: true
    fuente_sistema: Portal web institucional GADMCM
    vinculo_ack: LOTAIP_19
    url: "https://www.montecristi.gob.ec"
    estado_documento: verificar

  - id: EVD_TRANS_02_MCR
    tipo: sistema_financiero
    descripcion: >
      Ejecución presupuestaria GADMCM en SIGEF — cédula presupuestaria
      pública del municipio de Montecristi. Devengado vs. codificado por
      partidas, en tiempo real. La información es cargada por la Dirección
      Financiera GADMCM y publicada automáticamente por el MF. Observable
      externamente en el portal del Ministerio de Finanzas sin credenciales.
      Incluye ingresos, gastos, transferencias del Estado y deuda pública.
    proceso_ref: PRO_TRANS_02_MCR
    obligatoria: true
    fuente_sistema: SIGEF (Sistema Integrado de Gestión Financiera — MF)
    vinculo_ack: COOTAD_215
    url: "https://www.finanzas.gob.ec/sigef"
    estado_documento: verificar

  - id: EVD_TRANS_03_MCR
    tipo: portal_contratacion
    descripcion: >
      PAC publicado en SERCOP y procesos de contratación activos —
      Plan Anual de Contratación del GADMCM publicado en el Portal de
      Compras Públicas. Contratos adjudicados, montos, contratistas,
      plazos de ejecución y estado de cada proceso. Cualquier ciudadano
      puede buscar el RUC del GADMCM (pendiente verificación) y ver
      todos los contratos públicos. Evidencia de transparencia en el
      uso de recursos públicos.
    proceso_ref: PRO_TRANS_03_MCR
    obligatoria: true
    fuente_sistema: SERCOP (Portal de Compras Públicas)
    vinculo_ack: LOSNCP_21
    url: "https://www.compraspublicas.gob.ec"
    estado_documento: verificar

  - id: EVD_TRANS_04_MCR
    tipo: registro_administrativo
    descripcion: >
      Registro de solicitudes de información SAIP — libro o sistema de
      registro de todas las solicitudes de información recibidas por el
      GADMCM, con: fecha de recepción, tema solicitado, nombre del
      solicitante (si proporcionado), fecha de respuesta, resultado
      (entregada/negada/sin respuesta), y fundamento de eventual negativa.
      Este registro es exigible al RAIP en cualquier momento por la DPE.
      Su inexistencia es evidencia de incumplimiento institucional.
    proceso_ref: PRO_TRANS_04_MCR
    obligatoria: true
    fuente_sistema: RAIP GADMCM / Sistema interno SAIP
    vinculo_ack: LOTAIP_20
    url: pendiente
    estado_documento: pendiente_verificacion

  - id: EVD_TRANS_05_MCR
    tipo: informe_rendicion_cuentas
    descripcion: >
      Informe de rendición de cuentas anual del Alcalde — documento
      publicado en el portal GADMCM y en el repositorio CPCCS con:
      metas del POA/PDOT alcanzadas, presupuesto ejecutado por sector,
      proyectos entregados, indicadores de gestión, y respuesta a
      observaciones de la ciudadanía del año anterior. El informe es
      la evidencia de que el circuito de rendición de cuentas (C5) se
      cerró en el período anual.
    proceso_ref: PRO_TRANS_05_MCR
    obligatoria: true
    fuente_sistema: Portal GADMCM / Portal CPCCS
    vinculo_ack: COOTAD_302
    url: "https://www.cpccs.gob.ec"
    estado_documento: pendiente_verificacion

  - id: EVD_TRANS_06_MCR
    tipo: acto_administrativo
    descripcion: >
      Resolución de designación del Responsable de Acceso a la
      Información Pública (RAIP) — acto administrativo del Alcalde
      que designa al funcionario responsable del cumplimiento de LOTAIP.
      Sin esta designación, no existe responsable institucional del
      circuito de transparencia. La resolución debe estar publicada
      en el portal web. Su ausencia implica que el GADMCM carece del
      andamiaje mínimo para cumplir LOTAIP.
    proceso_ref: PRO_TRANS_01_MCR
    obligatoria: true
    fuente_sistema: Portal web GADMCM / Secretaría General
    vinculo_ack: LOTAIP_9
    url: "https://www.montecristi.gob.ec"
    estado_documento: pendiente_verificacion

# ============================================================
# C6 — CONTROLES
# Los órganos externos que verifican y sancionan el cumplimiento
# del servicio de transparencia institucional
# ============================================================

CONTROLES:

  - id: CTL_TRANS_01_MCR
    nombre: DPE — Defensoría del Pueblo (Transparencia y LOTAIP)
    tipo_control: regulatorio_constitucional
    fuente: LOTAIP Art. 47 / Ley Orgánica del Defensor del Pueblo
    organo_control: Defensoría del Pueblo del Ecuador (DPE)
    descripcion: >
      La DPE es el órgano primario de control del cumplimiento de LOTAIP.
      Recibe denuncias ciudadanas por incumplimiento de publicación activa
      (Art. 19) o por negativa/demora en atención de solicitudes (Art. 20).
      Puede: iniciar investigación de oficio, citar al RAIP, requerir
      información, emitir resolución vinculante, y remitir a la SENRES/
      LOSEP para responsabilidad administrativa del funcionario infractor.
      LOTAIP Art. 47 establece las sanciones específicas (suspensión,
      multa, destitución según gravedad).
    vinculo_ack: LOTAIP_47
    estado_control: activo

  - id: CTL_TRANS_02_MCR
    nombre: CGE — Contraloría General del Estado (Control financiero-informativo)
    tipo_control: financiero
    fuente: LOC-CGE
    organo_control: Contraloría General del Estado (CGE)
    descripcion: >
      La CGE audita la veracidad y completitud de la información financiera
      publicada por el GADMCM: si la cédula presupuestaria en SIGEF refleja
      la ejecución real, si los contratos publicados en SERCOP existen y
      son correctos, y si los informes de rendición de cuentas son fieles
      a los registros contables. La CGE también controla que el proceso de
      publicación de información no tenga irregularidades (ej: publicar
      contratos inexistentes o montos alterados). Glosa si hay perjuicio
      al Estado vinculado a opacidad deliberada.
    vinculo_ack: LOC-CGE_21
    estado_control: activo

  - id: CTL_TRANS_03_MCR
    nombre: CPCCS — Control Social sobre Rendición de Cuentas
    tipo_control: ciudadano
    fuente: COOTAD_302 / LOPC
    organo_control: Consejo de Participación Ciudadana y Control Social (CPCCS)
    descripcion: >
      El CPCCS verifica que el Alcalde cumpla con el proceso de rendición
      de cuentas anual: convocatoria pública, realización del evento,
      informe publicado, y participación ciudadana efectiva. El CPCCS
      puede emitir informes de calificación del proceso y remitir a la
      SENRES en caso de incumplimiento grave. Es el control institucional
      específico del proceso PRO_TRANS_05_MCR (rendición de cuentas).
      Cualquier ciudadano puede presentar observaciones ante el CPCCS
      sobre el proceso de rendición de cuentas del Alcalde.
    vinculo_ack: COOTAD_302
    estado_control: activo

  - id: CTL_TRANS_04_MCR
    nombre: PGE — Procurador General del Estado (Pronunciamientos)
    tipo_control: juridico
    fuente: Ley Orgánica de la Procuraduría General del Estado
    organo_control: Procuraduría General del Estado (PGE)
    descripcion: >
      La PGE emite pronunciamientos sobre el alcance e interpretación
      de las obligaciones de transparencia de las entidades públicas,
      incluyendo GADs. Cuando existe controversia sobre si determinada
      información es pública o reservada, el RAIP puede consultar a la PGE.
      Los pronunciamientos de la PGE son de observancia obligatoria para
      todas las entidades del sector público. Relevante cuando el GADMCM
      invoca reserva de información ante solicitudes SAIP.
    estado_control: activo

# ============================================================
# C7 — OBSERVABILIDAD
# Los puntos donde el servicio de transparencia se hace visible
# y verificable — especialmente por cualquier ciudadano
# Principio: la transparencia es observable si y solo si un ciudadano
# sin credenciales puede verificarla con una búsqueda web simple.
# ============================================================

OBSERVABILIDAD:

  - id: OBS_TRANS_01_MCR
    fuente_ack: LOTAIP_19
    tipo_publicacion: portal_transparencia
    descripcion: >
      Portal DPE (fuente canónica QUIRA) — Sistema de Publicación de
      Información por Entidades. El portal de la Defensoría del Pueblo
      (transparencia.dpe.gob.ec) consolida el estado de publicación de todos
      los 222 GADs del Ecuador, incluyendo el GADMCM (establishment_id=937).
      Observable: 25 numerales LOTAIP 2.0 por mes · fecha de publicación por
      numeral · atraso respecto al plazo legal (día 15 del mes siguiente).
      N4 (2026-06-01): 25/25 numerales presentes en los 16 meses auditados
      (ene 2025 – abr 2026). Atraso sistémico: 30–139 días en todos los meses.
      Portal GAD (montecristi.gob.ec): publicación institucional obligatoria
      por LOTAIP Art. 9; complementario a DPE para verificación ciudadana.
    url_portal: "https://transparencia.dpe.gob.ec/entidades/937"
    url_portal_gad: "https://www.montecristi.gob.ec"
    frecuencia_real: mensual
    verificacion_anonima: true
    nota_n4: >
      OBS-QNKC-02 VALIDADA (ADR-015 cerrado). API DPE confirmada O(1):
      /backend/v1/transparency/transparency/active/public?establishment_id=937&year={y}&month={m}.
      Arquitectura escalable a 222 GADs sin cambio de método.

  - id: OBS_TRANS_02_MCR
    fuente_ack: COOTAD_215
    tipo_publicacion: sistema_financiero
    descripcion: >
      SIGEF público — ejecución presupuestaria GADMCM verificable por
      cualquier ciudadano en el portal del Ministerio de Finanzas, sin
      credenciales. Permite verificar: cuánto presupuesto tiene el
      municipio, cuánto ha ejecutado, en qué partidas, y si los montos
      coinciden con lo informado en el portal LOTAIP. Brecha entre SIGEF
      y portal LOTAIP = evidencia de inconsistencia informativa.
    url_portal: "https://www.finanzas.gob.ec/sigef"
    frecuencia_real: tiempo_real
    verificacion_anonima: true

  - id: OBS_TRANS_03_MCR
    fuente_ack: LOSNCP_21
    tipo_publicacion: portal_contratacion
    descripcion: >
      SERCOP — contratación pública GADMCM verificable por cualquier
      ciudadano. Permite verificar: todos los contratos del municipio,
      montos, contratistas, estado de ejecución, y si el PAC publicado
      al inicio del año se materializó en contratos reales. Brecha
      PAC vs. contratos adjudicados = indicador de calidad de la
      planificación y de la transparencia en el uso del dinero público.
      Cruce con Dom03 (Seguimiento de Metas) y Dom05 (Holding).
    url_portal: "https://www.compraspublicas.gob.ec/ProcesoContratacion"
    frecuencia_real: tiempo_real
    verificacion_anonima: true

  - id: OBS_TRANS_04_MCR
    fuente_ack: LOTAIP_47
    tipo_publicacion: registro_quejas
    descripcion: >
      Sistema de quejas y denuncias de la DPE — cualquier ciudadano
      que no reciba respuesta a su solicitud SAIP en 10 días, o que
      encuentre que el portal LOTAIP no está actualizado, puede presentar
      una denuncia ante la DPE. El volumen y tipo de denuncias contra el
      GADMCM en la DPE es un indicador observable de la calidad real
      de la transparencia institucional: una institución con alta
      observabilidad tiene pocas quejas en la DPE por opacidad.
    url_portal: "https://www.dpe.gob.ec"
    frecuencia_real: continuo
    verificacion_anonima: true

# ============================================================
# C8 — INDICADORES
# Las métricas que cuantifican la calidad de la transparencia
# y la observabilidad ciudadana real
# ============================================================

INDICADORES:

  - id: IND_TRANS_01_MCR
    # Nota interna: este indicador corresponde al H41_IOC del Bloomberg Model.
    # El H41_IOC es el ponderado compuesto de cumplimiento × actualización ×
    # comprensibilidad. NO exponer este identificador en UI/API/informes públicos.
    nombre: Cumplimiento Integral de Publicación Institucional
    dominio_tgi: Dom07
    tgi_dimension: D7_TRANSPARENCIA
    formula: >
      C8 = C4 × (C5a × C5b_acc × C5t × C5c)
      donde:
        C4      = cumplimiento del proceso de publicación activa (0.00–1.00)
        C5a     = existencia     — ¿publicó al menos 1 numeral? (1.00 si presente)
        C5b_acc = accesibilidad  — ¿publicó todos los numerales? (n_pub / 25)
        C5t     = puntualidad    — ¿publicó antes del día 15 del mes siguiente?
                  0.00 si atraso · 1.00 si en plazo
        C5c     = comprensibilidad — calidad/legibilidad de lo publicado (0.00–1.00)
    nota_formula: >
      Cadena multiplicativa QNKC post-N4: cualquier sub-variable en 0 colapsa
      el resultado a 0. Reemplaza la ponderación aditiva pre-N4
      (cumplimiento×0.5 + actualización×0.3 + comprensibilidad×0.2).
      C5b descompuesto en C5b_acc (accesibilidad) y C5t (puntualidad temporal)
      como variables independientes — descubrimiento empírico de N4.
      LOTAIP 2.0: 25 numerales obligatorios (reforma 2024-2025).
      N4 (2026-06-01): C5a=1.00 · C5b_acc=1.00 · C5t=0.00 · C5c=0.75 → C8=0.00.
    fuente_dato: >
      Portal DPE (transparencia.dpe.gob.ec) — API REST, entidad ID=937.
      Verificación directa de 25 numerales × período. Comprensibilidad (C5c)
      por evaluación técnica QUIRA Operaciones.
    frecuencia: mensual
    unidad: indice_0_a_1
    valor_linea_base: 0.0
    meta_anual: null
    umbral_verde: ">= 0.80"
    umbral_amarillo: ">= 0.50 y < 0.80"
    umbral_rojo: "< 0.50"
    nota_umbral: >
      Umbral QUIRA: <0.50 = opacidad crítica (DPE interviene); 0.50–0.79 =
      cumplimiento parcial (monitoreo reforzado); ≥0.80 = transparencia
      efectiva (estándar mínimo de gobernabilidad). Cualquier valor
      C5t=0.00 colapsa el resultado a 0 independientemente de los otros
      factores — el atraso sistémico es el riesgo dominante.
    estado_dato: confirmado

  - id: IND_TRANS_02_MCR
    nombre: Cobertura de Publicación LOTAIP Art. 19
    dominio_tgi: Dom07
    tgi_dimension: D7_TRANSPARENCIA
    formula: "(numerales_publicados_activos / 25) * 100"
    fuente_dato: >
      Portal DPE (transparencia.dpe.gob.ec) — API REST, entidad ID=937.
      Conteo automático de numerales con contenido activo por período.
      N4 (2026-06-01): 25/25 publicados en los 16 meses auditados = 100%.
    frecuencia: mensual
    unidad: porcentaje
    valor_linea_base: 100.0
    meta_anual: 100.0
    umbral_verde: "= 100"
    umbral_amarillo: ">= 80 y < 100"
    umbral_rojo: "< 80"
    nota_umbral: >
      Los 25 numerales (LOTAIP 2.0) son obligación legal, no opcional.
      100% es el único estándar de cumplimiento. Numerales ausentes son
      incumplimiento directo de LOTAIP Art. 19. La DPE puede actuar sobre
      cada numeral faltante individualmente. N4 confirma 100% cobertura —
      el problema de Montecristi es el atraso (C5t), no la cobertura (C5b_acc).
    estado_dato: confirmado

  - id: IND_TRANS_03_MCR
    nombre: Actualidad de Publicaciones (% dentro de plazo)
    dominio_tgi: Dom07
    tgi_dimension: D7_TRANSPARENCIA
    formula: "(numerales_actualizados_en_plazo / numerales_publicados) * 100"
    fuente_dato: >
      Portal web GADMCM — fecha de última actualización de cada numeral
      vs. plazo máximo LOTAIP (actualización trimestral obligatoria).
    frecuencia: trimestral
    unidad: porcentaje
    valor_linea_base: null
    meta_anual: null
    umbral_verde: ">= 90"
    umbral_amarillo: ">= 60 y < 90"
    umbral_rojo: "< 60"
    nota_umbral: >
      Publicación desactualizada = información inútil para el ciudadano.
      Un numeral publicado hace 2 años no cuenta como transparencia activa.
      Montecristi: alto riesgo de desactualización por capacidad técnica
      limitada del área de comunicación en GADs pequeños.
    estado_dato: pendiente_validacion

  - id: IND_TRANS_04_MCR
    nombre: Tasa de Respuesta Oportuna SAIP
    dominio_tgi: Dom07
    tgi_dimension: D7_TRANSPARENCIA
    formula: "(solicitudes_respondidas_en_10_dias / total_solicitudes_recibidas) * 100"
    fuente_dato: >
      Registro SAIP del RAIP GADMCM — número de solicitudes recibidas
      en el período vs. número respondidas dentro del plazo legal de
      10 días hábiles (LOTAIP Art. 34).
    frecuencia: mensual
    unidad: porcentaje
    valor_linea_base: null
    meta_anual: null
    umbral_verde: ">= 95"
    umbral_amarillo: ">= 70 y < 95"
    umbral_rojo: "< 70"
    nota_umbral: >
      El plazo de 10 días es obligación legal (LOTAIP Art. 34). Silencio
      administrativo en SAIP = presunción de información pública (silencio
      positivo). Respuesta tardía = infracción administrativa. Meta: 100%.
      Indicador de primer nivel de atención ciudadana del municipio.
    estado_dato: pendiente_validacion

  - id: IND_TRANS_05_MCR
    nombre: Asistencia Ciudadana a Rendición de Cuentas
    dominio_tgi: Dom08
    tgi_dimension: D8_PARTICIPACION
    formula: "asistentes_verificados_rendicion_cuentas_anual"
    fuente_dato: >
      Acta de rendición de cuentas GADMCM firmada por CPCCS —
      número de ciudadanos asistentes al evento anual de rendición.
      Cruce con Dom08 (Participación Ciudadana).
    frecuencia: anual
    unidad: numero_personas
    valor_linea_base: null
    meta_anual: null
    umbral_verde: ">= 200"
    umbral_amarillo: ">= 50 y < 200"
    umbral_rojo: "< 50"
    nota_umbral: >
      Una rendición de cuentas con menos de 50 asistentes puede indicar
      falta de convocatoria efectiva o pérdida de confianza ciudadana.
      Umbral indicativo — no hay estándar nacional. Cruce con Dom08
      para correlación participación vs. calidad de transparencia.
      Si rendición no fue realizada = valor 0 → ROJO automático.
    estado_dato: pendiente_validacion

