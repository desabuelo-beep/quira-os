# ÍNDICE CIRCUITO — TRANSPARENCIA MCR
# ============================================================
#
# Cadena QNKC-002 instanciada:
#   CE_18 + CE_91 (C1/C2) → SP_TRANS_MCR (C3) → PRO_TRANS_01-05_MCR (C4)
#   → EVD_TRANS_01-06_MCR (C5) → CTL_TRANS_01-04_MCR (C6)
#   → OBS_TRANS_01-04_MCR (C7) → IND_TRANS_01-05_MCR (C8)
#   → RES_TRANS_01-05_MCR (C9)
#
# Posición de LOTAIP en la cadena (corrección arquitectónica ADR-012):
#   LOTAIP_19 → C4 (ventana de observación de los procesos)
#   LOTAIP_20 → C4 (proceso de atención SAIP)
#   LOTAIP_47 → C6 (control/sanción DPE)
#   LOTAIP NO está en C2 (Competencial) — no crea la obligación sustantiva
#   C2 = COOTAD_302 + LOSNCP_21 + COOTAD_215 (obligaciones sustantivas)
#
# Nodos Neo4j a crear:
#   1 × C3ServicioPublico (SP_TRANS_MCR)
#   5 × C4Proceso
#   6 × C5Evidencia
#   4 × C6Control
#   4 × C7Observabilidad
#   5 × C8Indicador
#   5 × C9ResultadoTerritorial
#   Total: 30 nodos + nodo Canton ancla + relaciones
#
# Relaciones ACK → QTMP (materialización):
#   CE_18      -[:MATERIALIZA_VIA]-> SP_TRANS_MCR
#   CE_91      -[:HABILITA]->        SP_TRANS_MCR
#   COOTAD_302 -[:HABILITA]->        SP_TRANS_MCR
#   LOSNCP_21  -[:HABILITA]->        PRO_TRANS_03_MCR
#   LOTAIP_19  -[:OBSERVA]->         OBS_TRANS_01_MCR
#   LOTAIP_47  -[:CONTROLA]->        CTL_TRANS_01_MCR
#   COOTAD_215 -[:HABILITA]->        PRO_TRANS_02_MCR
#   COOTAD_302 -[:ACTIVA]->          PRO_TRANS_05_MCR
#   LOC-CGE_21 -[:CONTROLA]->        CTL_TRANS_02_MCR
#
# Preguntas causales respondibles con este QTMP:
#   1. ¿Cuántos de los 25 numerales LOTAIP 2.0 están publicados en el portal?
#      → RES_TRANS_02_MCR (cobertura publicación)
#   2. ¿Las publicaciones están actualizadas o son información vieja?
#      → RES_TRANS_03_MCR (actualidad publicaciones)
#   3. ¿El municipio responde las solicitudes ciudadanas de información?
#      → RES_TRANS_04_MCR (tasa respuesta SAIP)
#   4. ¿La ciudadanía puede verificar el uso del dinero público?
#      → OBS_TRANS_02_MCR (SIGEF) + OBS_TRANS_03_MCR (SERCOP)
#   5. ¿Existe capacidad efectiva de escrutinio ciudadano en Montecristi?
#      → RES_TRANS_01_MCR (índice compuesto — pregunta central Dom07)
#
# Estado validación:
#   Estructura: COMPLETA (todos los campos del schema instanciados)
#   Datos N4:   CONFIRMADOS — RES_TRANS_01 (C8=0.0) y RES_TRANS_02 (100%) con
#               datos empíricos del Portal DPE · 16 meses auditados · ADR-015 cerrado
#   Datos pend: SAIP (RES_TRANS_04) · Rendición cuentas (RES_TRANS_05) ·
#               Actualidad detallada (RES_TRANS_03) · RAIP designado (IMPL_LOCAL)
#   Revisión:   revisado_por_experto: false — requiere sesión con GADMCM
#
# Estado Dom07: VERIFICADO (N4 completado) — pendiente DEC hasta N3 (Neo4j load)
#
# Siguiente paso:
#   1. ✅ Portal DPE auditado — 25/25 numerales confirmados · atraso sistémico registrado
#   2. N3: ejecutar carga Neo4j del circuito TRANSPARENCIA (cuando Neo4j disponible)
#   3. Solicitar al GADMCM registro de solicitudes SAIP 2023-2025
#   4. Solicitar resolución de designación del RAIP vigente
#   5. Cruzar PAC SERCOP 2025 con informe rendición de cuentas 2024
#   6. Sprint 5: Dom06 (Salud Institucional) — después de DEC Dom07
# ============================================================
