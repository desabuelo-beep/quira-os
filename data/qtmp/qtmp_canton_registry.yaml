# ============================================================
# QUIRA — QTMP Canton Registry
# Registro Nacional de Cantones Ecuador
# ============================================================
# Versión:   1.0
# Fecha:     2026-05-30
# Fuente:    INEC DPA 2024 (División Política Administrativa)
# Propósito: Nodo base (Canton) para el grafo Neo4j QUIRA.
#            Toda instancia QTMP referencia un CANTON_ID de este registro.
#            Un cantón debe existir aquí antes de crear cualquier QTMP instance.
#
# Convención CANTON_ID:
#   ECU-{CODIGO_PROVINCIA}-{NOMBRE_NORMALIZADO}
#   Normalización: MAYÚSCULAS · sin tildes · espacios → guiones bajos
#   Á→A · É→E · Í→I · Ó→O · Ú→U · Ñ→N
#   Ejemplo: "Montecristi" → ECU-13-MONTECRISTI
#
# Estado QTMP:
#   activo    → al menos una instancia QTMP creada y operativa
#   pendiente → cantón registrado, sin instancia QTMP todavía
#
# canton_short:
#   Código único 3-5 chars para filenames, Neo4j labels, y CLI
#   Ejemplo: MCR=Montecristi, GYE=Guayaquil, UIO=Quito
#
# Cypher Neo4j:
#   MERGE (c:Canton {id: $CANTON_ID})
#   SET c.nombre = $nombre, c.provincia = $provincia,
#       c.codigo_provincia = $codigo_provincia,
#       c.canton_short = $canton_short,
#       c.estado_qtmp = $estado_qtmp
#
# Total: 222 cantones — 24 provincias
# ============================================================

