<text x="78" y="746" font-size="13" fill="#2B3A42">La articulación con los objetivos del plan es demostrable hasta el gasto ejecutado.</text>
<text x="78" y="766" font-size="13" fill="#2B3A42">La articulación con las metas no es demostrable: <tspan font-weight="700">los instrumentos no las declaran.</tspan></text>
