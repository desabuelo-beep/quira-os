<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1130" width="1240" height="1130" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="1240" height="1130" fill="#FFFFFF"/><text x="60" y="46" font-size="21" font-weight="700" fill="#2B3A42">Cadena de evidencia · ejercicio 2026</text><text x="60" y="69" font-size="13" fill="#8A9BA5">Gobierno Autónomo Descentralizado Municipal del Cantón Montecristi · corte acumulado a abril</text><line x1="60" y1="84" x2="1180" y2="84" stroke="#D7DEE2"/><rect x="60" y="106" width="360" height="54" rx="6" fill="#FFFFFF" stroke="#3D6B5A" stroke-width="1.6"/><text x="75" y="127" font-size="13" font-weight="600" fill="#2B3A42">Plan de Desarrollo y Ordenamiento Territorial</text><text x="75" y="144" font-size="11.5" fill="#8A9BA5">66 metas vigentes</text><line x1="420" y1="133" x2="453" y2="133" stroke="#3D6B5A" stroke-width="2"/><path d="M452,128 L460,133 L452,138" fill="#3D6B5A"/><rect x="460" y="106" width="360" height="54" rx="6" fill="#FFFFFF" stroke="#3D6B5A" stroke-width="1.6"/><text x="475" y="127" font-size="13" font-weight="600" fill="#2B3A42">Objetivo estratégico</text><text x="475" y="144" font-size="11.5" fill="#8A9BA5">9 declarados</text><line x1="820" y1="133" x2="853" y2="133" stroke="#3D6B5A" stroke-width="2"/><path d="M852,128 L860,133 L852,138" fill="#3D6B5A"/><rect x="860" y="106" width="360" height="54" rx="6" fill="#FFFFFF" stroke="#3D6B5A" stroke-width="1.6"/><text x="875" y="127" font-size="13" font-weight="600" fill="#2B3A42">Plan Anual de Inversiones</text><text x="875" y="144" font-size="11.5" fill="#8A9BA5">101 actividades</text><path d="M1040,160 L1040,186" stroke="#2B3A42" stroke-width="2"/><text x="1052" y="180" font-size="10.5" fill="#2B3A42" font-weight="600">la cadena se bifurca aquí</text><line x1="250" y1="186" x2="1040" y2="186" stroke="#2B3A42" stroke-width="2" stroke-linecap="round"/><circle cx="250" cy="186" r="3" fill="#2B3A42"/><line x1="250" y1="186" x2="250" y2="204" stroke="#2B3A42" stroke-width="2"/><path d="M245,204 L250,212 L255,204" fill="#2B3A42"/><circle cx="630" cy="186" r="3" fill="#2B3A42"/><line x1="630" y1="186" x2="630" y2="204" stroke="#2B3A42" stroke-width="2"/><path d="M625,204 L630,212 L635,204" fill="#2B3A42"/><circle cx="1030" cy="186" r="3" fill="#2B3A42"/><line x1="1030" y1="186" x2="1030" y2="204" stroke="#2B3A42" stroke-width="2"/><path d="M1025,204 L1030,212 L1035,204" fill="#2B3A42"/><text x="60" y="204" font-size="11" font-weight="700" fill="#3D6B5A" letter-spacing="0.5">RUTA FINANCIERA · evidencia parcial</text><rect x="60" y="212" width="380" height="54" rx="6" fill="#FFFFFF" stroke="#3D6B5A" stroke-width="1.6"/><text x="75" y="233" font-size="13" font-weight="600" fill="#2B3A42">Partida presupuestaria</text><text x="75" y="250" font-size="11.5" fill="#8A9BA5">26 distintas</text><line x1="86" y1="266" x2="86" y2="301" stroke="#8A6D3B" stroke-width="2" stroke-dasharray="2 3"/><path d="M81,300 L86,308 L91,300" fill="#8A6D3B"/><text x="100" y="291.0" font-size="10.5" fill="#8A6D3B">captura propia pendiente</text><rect x="60" y="308" width="380" height="54" rx="6" fill="#FFFFFF" stroke="#8A6D3B" stroke-width="1.6" stroke-dasharray="2 3"/><text x="75" y="329" font-size="13" font-weight="600" fill="#2B3A42">Contratación pública</text><text x="75" y="346" font-size="11.5" fill="#8A9BA5">captura propia no completada</text><text x="426" y="326" font-size="9.5" fill="#8A6D3B" text-anchor="end" font-family="Consolas, monospace">captura_no_completada</text><line x1="86" y1="362" x2="86" y2="397" stroke="#8A6D3B" stroke-width="2" stroke-dasharray="2 3"/><path d="M81,396 L86,404 L91,396" fill="#8A6D3B"/><text x="100" y="387.0" font-size="10.5" fill="#8A6D3B">eslabón no incorporado a este corte</text><rect x="60" y="404" width="380" height="54" rx="6" fill="#FFFFFF" stroke="#3D6B5A" stroke-width="1.6"/><text x="75" y="425" font-size="13" font-weight="600" fill="#2B3A42">Cédula presupuestaria</text><text x="75" y="442" font-size="11.5" fill="#8A9BA5">135 partidas · corte abril</text><line x1="86" y1="458" x2="86" y2="493" stroke="#3D6B5A" stroke-width="2"/><path d="M81,492 L86,500 L91,492" fill="#3D6B5A"/><text x="100" y="483.0" font-size="10.5" fill="#3D6B5A">verificado en la cédula</text><rect x="60" y="500" width="380" height="54" rx="6" fill="#FFFFFF" stroke="#3D6B5A" stroke-width="1.6"/><text x="75" y="521" font-size="13" font-weight="600" fill="#2B3A42">Devengado</text><text x="75" y="538" font-size="11.5" fill="#8A9BA5">$1,781,928</text><text x="480" y="204" font-size="11" font-weight="700" fill="#8A6D3B" letter-spacing="0.5">IDENTIFICADOR PRESENTE EN EL INSTRUMENTO</text><rect x="480" y="212" width="300" height="66" rx="6" fill="#FFFFFF" stroke="#8A6D3B" stroke-width="1.6" stroke-dasharray="2 3"/><text x="495" y="233" font-size="13" font-weight="600" fill="#2B3A42">Código de actividad orgánica</text><text x="495" y="250" font-size="11.5" fill="#8A9BA5">95 con código orgánico · 6 sin identificador</text><text x="495" y="263" font-size="10.5" fill="#8A6D3B" font-style="italic">APAA · DCGS · DFIN · DPC</text><rect x="480" y="294" width="300" height="96" rx="6" fill="#F7F9FA" stroke="#8A9BA5" stroke-dasharray="3 3"/><text x="495" y="312" font-size="9.5" font-weight="700" fill="#8A9BA5" letter-spacing="0.6">INTERPRETACIÓN — NO ES MEDICIÓN</text><text x="495" y="331" font-size="11" fill="#2B3A42" font-style="italic">El código identifica una unidad orgánica dentro del</text><text x="495" y="347" font-size="11" fill="#2B3A42" font-style="italic">instrumento. Su relación con la ejecución administrativa</text><text x="495" y="363" font-size="11" fill="#2B3A42" font-style="italic">es lectura analítica, no medición del resultado.</text><text x="495" y="382" font-size="9.5" fill="#8A9BA5">OBS-027 · observación registrada</text><text x="880" y="204" font-size="11" font-weight="700" fill="#B4513C" letter-spacing="0.5">RUTA OPERACIONAL · no demostrable</text><rect x="880" y="212" width="300" height="54" rx="6" fill="#FFFFFF" stroke="#B4513C" stroke-width="1.6" stroke-dasharray="5 4"/><text x="895" y="233" font-size="13" font-weight="600" fill="#2B3A42">Meta</text><text x="895" y="250" font-size="11.5" fill="#8A9BA5">0 de 101 actividades</text><text x="1166" y="230" font-size="9.5" fill="#B4513C" text-anchor="end" font-family="Consolas, monospace">sin_evidencia</text><line x1="906" y1="266" x2="906" y2="279.0" stroke="#B4513C" stroke-width="2" stroke-dasharray="4 5"/><line x1="899" y1="282.0" x2="913" y2="292.0" stroke="#B4513C" stroke-width="2.4"/><line x1="913" y1="282.0" x2="899" y2="292.0" stroke="#B4513C" stroke-width="2.4"/><line x1="906" y1="295.0" x2="906" y2="308" stroke="#B4513C" stroke-width="2" stroke-dasharray="4 5"/><text x="920" y="291.0" font-size="10.5" fill="#B4513C">el instrumento no lo declara</text><rect x="880" y="308" width="300" height="54" rx="6" fill="#FFFFFF" stroke="#B4513C" stroke-width="1.6" stroke-dasharray="5 4"/><text x="895" y="329" font-size="13" font-weight="600" fill="#2B3A42">Indicador</text><text x="895" y="346" font-size="11.5" fill="#8A9BA5">0 de 101 actividades</text><text x="1166" y="326" font-size="9.5" fill="#B4513C" text-anchor="end" font-family="Consolas, monospace">sin_evidencia</text><line x1="906" y1="362" x2="906" y2="375.0" stroke="#B4513C" stroke-width="2" stroke-dasharray="4 5"/><line x1="899" y1="378.0" x2="913" y2="388.0" stroke="#B4513C" stroke-width="2.4"/><line x1="913" y1="378.0" x2="899" y2="388.0" stroke="#B4513C" stroke-width="2.4"/><line x1="906" y1="391.0" x2="906" y2="404" stroke="#B4513C" stroke-width="2" stroke-dasharray="4 5"/><text x="920" y="387.0" font-size="10.5" fill="#B4513C">el instrumento no lo declara</text><rect x="880" y="404" width="300" height="54" rx="6" fill="#FFFFFF" stroke="#B4513C" stroke-width="1.6" stroke-dasharray="5 4"/><text x="895" y="425" font-size="13" font-weight="600" fill="#2B3A42">Resultado</text><text x="895" y="442" font-size="11.5" fill="#8A9BA5">el instrumento no declara meta ni indicador</text><text x="1166" y="422" font-size="9.5" fill="#B4513C" text-anchor="end" font-family="Consolas, monospace">sin_evidencia</text><rect x="480" y="520" width="680" height="104" rx="6" fill="#F7F9FA" stroke="#D7DEE2"/><text x="495" y="543" font-size="12.5" font-weight="600" fill="#2B3A42">Escala · qué parte del gasto queda trazada</text><rect x="495" y="554" width="650" height="20" rx="3" fill="#E3E9EC"/><rect x="495" y="554" width="149" height="20" rx="3" fill="#3D6B5A"/><text x="495" y="592" font-size="12" fill="#2B3A42"><tspan font-weight="700">$1,781,928</tspan> trazados por el Plan de Inversiones · de <tspan font-weight="700">$7,752,518</tspan> devengados por el municipio (23%)</text><text x="495" y="611" font-size="11" fill="#8A9BA5" font-style="italic">el Plan de Inversiones cubre inversión, no el gasto corriente — el resto no es opacidad.</text><rect x="480" y="640" width="680" height="106" rx="6" fill="#F7F9FA" stroke="#D7DEE2"/><text x="495" y="663" font-size="12.5" font-weight="600" fill="#2B3A42">Respaldo financiero de los 9 objetivos</text><text x="1145" y="663" font-size="10" fill="#8A9BA5" text-anchor="end">devengado · si no hay, codificado</text><text x="495" y="686" font-size="11.5" fill="#8A9BA5">con ejecución certificada</text><text x="910" y="686" font-size="11.5" fill="#2B3A42" text-anchor="end">8 de 9</text><text x="1145" y="686" font-size="11.5" font-weight="700" fill="#2B3A42" text-anchor="end">$1,781,928</text><text x="495" y="706" font-size="11.5" fill="#8A9BA5">con asignación sin ejecutar</text><text x="910" y="706" font-size="11.5" fill="#2B3A42" text-anchor="end">1 de 9</text><text x="1145" y="706" font-size="11.5" font-weight="700" fill="#2B3A42" text-anchor="end">$38,100 asignado</text><text x="495" y="726" font-size="11.5" fill="#8A9BA5">sin respaldo financiero</text><text x="910" y="726" font-size="11.5" fill="#2B3A42" text-anchor="end">0 de 9</text><text x="1145" y="726" font-size="11.5" font-weight="700" fill="#2B3A42" text-anchor="end">sin asignación</text><rect x="60" y="760" width="1120" height="94" rx="6" fill="#F7F9FA" stroke="#D7DEE2"/><text x="78" y="785" font-size="13" font-weight="700" fill="#2B3A42">Lectura</text><text x="78" y="808" font-size="12.5" fill="#2B3A42">La evidencia permite reconstruir esta cadena documental hasta el gasto ejecutado.</text><text x="78" y="827" font-size="12.5" fill="#2B3A42">La cadena hacia metas e indicadores no puede reconstruirse: los instrumentos de 2026</text><text x="78" y="846" font-size="12.5" fill="#2B3A42">no los declaran. Esto describe lo que los documentos permiten demostrar, no el desempeño.</text><text x="60" y="874" font-size="11.5" font-weight="600" fill="#B4513C">Ausencia de evidencia documental. No constituye evidencia de incumplimiento.</text><line x1="60" y1="896" x2="94" y2="896" stroke="#3D6B5A" stroke-width="2.4" stroke-dasharray=""/><text x="106" y="900" font-size="11.5" fill="#8A9BA5">vínculo demostrado con documento de respaldo</text><line x1="60" y1="915" x2="94" y2="915" stroke="#B4513C" stroke-width="2.4" stroke-dasharray="4 5"/><text x="106" y="919" font-size="11.5" fill="#8A9BA5">vínculo no demostrable — el instrumento observado no lo declara</text><line x1="60" y1="934" x2="94" y2="934" stroke="#8A6D3B" stroke-width="2.4" stroke-dasharray="2 3"/><text x="106" y="938" font-size="11.5" fill="#8A9BA5">límite de la captura de QUIRA — no es una carencia del municipio</text><line x1="60" y1="968" x2="1180" y2="968" stroke="#D7DEE2"/><text x="60" y="988" font-size="11" font-weight="700" fill="#8A9BA5" letter-spacing="0.5">PROCEDENCIA</text><text x="720" y="988" font-size="9.5" fill="#8A9BA5" letter-spacing="0.4">HASH · SHA-256 truncado a 16 de 64</text><text x="60" y="1006" font-size="10.5" fill="#8A9BA5">Plan Anual de inversion (PAI) 2026.xlsx</text><text x="720" y="1006" font-size="10.5" fill="#8A9BA5" font-family="Consolas, monospace">sha256:964328c8bc88472b</text><text x="1180" y="1006" font-size="10.5" fill="#8A9BA5" text-anchor="end">101 filas · 4 hojas</text><text x="60" y="1023" font-size="10.5" fill="#8A9BA5">GAD Montecristi Presupuesto abril 2026.xlsx</text><text x="720" y="1023" font-size="10.5" fill="#8A9BA5" font-family="Consolas, monospace">sha256:dbf66ec0d672a403</text><text x="1180" y="1023" font-size="10.5" fill="#8A9BA5" text-anchor="end">135 partidas · acumulado a abril</text><text x="60" y="1040" font-size="10.5" fill="#8A9BA5">Ordenanza 07-2024-CM-GADMCM</text><text x="720" y="1040" font-size="10.5" fill="#8A9BA5" font-family="Consolas, monospace">sha256:662756aac591b247</text><text x="1180" y="1040" font-size="10.5" fill="#8A9BA5" text-anchor="end">sancionada 05-11-2024 · fija el plan vigente</text></svg>