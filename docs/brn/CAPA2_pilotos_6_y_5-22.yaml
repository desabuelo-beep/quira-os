# ═══════════════════════════════════════════════════════════════════════════════
# CAPA 2 · CONDICIONES NORMATIVAS · pilotos numeral 6 y numerales 5-22
# ═══════════════════════════════════════════════════════════════════════════════
# POR QUÉ ESTE ARCHIVO (2026-08-20). El colega, tras cerrar la extracción:
#
#   «El próximo entregable realmente valioso es una Capa 2 completa y
#   manualmente validada para los numerales 6 y 5-22, no una expansión
#   automática a los otros 24. Una vez que esos dos casos sobrevivan, ahí sí se
#   puede convertir su estructura en patrón reproducible.»
#
# QUÉ ES Y QUÉ NO ES. Es el MODELO de la condición normativa, aplicado a los dos
# casos que Javo trajo. Lo que está modelado —prescripción atómica,
# subrequisitos, objeto al que aplica, materialización esperada, evidencia
# admisible— es estructura de análisis, no interpretación jurídica.
#
# Los campos `tipo_validado` y `exigible_validado` están en **null a propósito**:
# los llena la revisión jurídica (Capa 2B), no este archivo. Mientras sigan en
# null, ninguna condición de aquí puede alimentar cumplimiento ni SITA.
#
# LA CADENA QUE ESTE MODELO SIRVE:
#   condición validada → prescripción atómica → materialización esperada
#     → evidencia admisible → verificador → afirmación
#
# Y la regla que lo gobierna (ADR-042 §6-ter): el algoritmo descubre y
# estructura; el canon determina; la evidencia demuestra.
# ═══════════════════════════════════════════════════════════════════════════════

