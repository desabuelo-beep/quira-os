# ═══════════════════════════════════════════════════════════════════════════════
# CNO-I-001 · Articulación de la Planificación con el Presupuesto y la Contratación
# Cuarto dominio incorporado. Aporta un estrés que los anteriores no ejercían: la
# MULTIPLICIDAD (1 CNO → varias RO → varias SAT). d02, d03 y d09 tenían una regla operativa
# cada uno; aquí una sola cadena jurídica sostiene DOS obligaciones operativas distintas
# (plan→POA y POA→PAC), que es como realmente opera la continuidad de la planificación.
#
# Nota de alcance (Javo · 2026-07-20): d01 ya es un DOM construido y cerrado con su PCD. Esta
# CNO/RO completa su CAPA NORMATIVA — la BRN es una capa del dominio, no el dominio entero.
#
# ESTADO: VIGENTE — aprobada formalmente por Javo el 2026-07-20 (ADR-035 §5).
#
# CORREGIDO 2026-07-23 (auditoría integral): los 7 SHA256 quedaron obsoletos tras el
# reemplazo del Corpus v1.0 el 2026-07-21 (aprobación 07-20, un día antes). Recalculados
# contra el corpus vigente. CE Art.241 (fundamento_constitucional) estaba genuinamente
# PERDIDO del corpus (no solo mal indexado) — recuperado y re-ingerido (id=22931), ver
# OBS-012. Backup: data/backups/brn_pre_correccion_sha_20260723/.
# ═══════════════════════════════════════════════════════════════════════════════
id: CNO-I-001
version: "1.0"
titulo: Articulación de la Planificación con el Presupuesto y la Contratación
objeto: >-
  el deber del GAD de planificar su desarrollo y de que esa planificación se traduzca, en cadena,
  en programación operativa anual, presupuesto y plan de contratación — de modo que lo planificado
  sea lo presupuestado y lo contratado.
dominio_normativo: planificacion_del_desarrollo

# ── La cadena · puro Derecho · SHA por eslabón (Regla 3) ──────────────────────────
cadena:
  - rol: fundamento_constitucional
    norma: CE
    articulo: "241"
    sha256: c4565a2cab21
    sumilla: "la planificación garantizará el ordenamiento territorial y será obligatoria"

  - rol: articulacion_nacional
    norma: CE
    articulo: "280"
    sha256: f78ab0db6e71
    sumilla: "el Plan Nacional de Desarrollo como instrumento al que se sujeta la planificación"

  - rol: competencia
    norma: COPLAFIP
    articulo: "12"
    sha256: ee8ddf2a336e
    sumilla: "la planificación del desarrollo y el ordenamiento territorial es competencia del GAD"

  - rol: ordenamiento_territorial
    norma: COPLAFIP
    articulo: "44"
    sha256: d8f56a1d3206
    sumilla: "disposiciones generales sobre los planes de ordenamiento territorial de los GAD"

  - rol: programacion_operativa_plazo
    norma: COOTAD
    articulo: "233"
    sha256: 1522597f54b1
    sumilla: "plazo: las dependencias preparan su programación operativa antes del 10 de septiembre"

  - rol: programacion_operativa_contenido
    norma: COOTAD
    articulo: "234"
    sha256: 236c87c6b3f9
    sumilla: "contenido: cada plan operativo anual debe contener las metas del plan de desarrollo"

  - rol: sujecion_presupuestaria
    norma: COOTAD
    articulo: "215"
    sha256: a34ebad6963c
    sumilla: "el presupuesto del GAD se ajusta a los planes de desarrollo"

  - rol: aprobacion
    norma: COOTAD
    articulo: "245"
    sha256: 78317417e719
    sumilla: "aprobación del presupuesto por el legislativo del GAD"

  - rol: contratacion
    norma: LOSNCP
    articulo: "22"
    sha256: 1d6c1b3ae153
    sumilla: "el Plan Anual de Contratación se formula conforme al plan y al presupuesto"

# ── Estado y ciclo de vida ────────────────────────────────────────────────────────
estado: vigente                   # propuesta | vigente | en_reforma | derogada
vigencia:
  desde: "2010-10-19"             # COOTAD / COPLAFIP vigentes
  hasta: null
derogaciones:
  reemplaza_a: null
  reemplazada_por: null

# ── Dependencias (MDN · 1 CNO → N RO: el estrés que aporta este dominio) ───────────
deriva_ro:
  - RO-I-001                      # articulación plan → programación operativa
  - RO-I-002                      # articulación programación operativa → contratación

# ── Validación humana (ADR-035 §5) ────────────────────────────────────────────────
validacion:
  propuesta_por: "BRN (extracción asistida)"
  validada_por: "Javo"            # ADR-035 §5 — aprobación formal
  fecha_validacion: "2026-07-20"
notas: >-
  Esta cadena no introduce una CLASE nueva de regla (sus obligaciones son de articulación y
  contenido, cercanas a d09), pero sí una topología nueva: una CNO que sostiene varias RO. Si el
  catálogo y el compilador la procesan sin cambios, queda evidencia de que el MDN soporta
  relaciones 1:N tal como el molde las describe.
