# ═══════════════════════════════════════════════════════════════════════════════
# CNO-III-001 · Traducción del Mandato Electoral a la Gestión Pública
# Segunda CNO de la BRN v2 — el EXAMEN de generalidad del molde (colega · 2026-07-18):
# NO reproduce el caso financiero. El mandato electoral es de otra naturaleza (obligaciones
# programáticas, trazabilidad, congruencia), no un umbral presupuestario. Si el mismo molde
# soporta esta cadena, el modelo BRN es transversal, no una arquitectura para finanzas.
#
# La CNO responde SOLO a: ¿qué obligación jurídica conecta el mandato electoral con la gestión
# pública? Es puro Derecho — NO contiene variable, umbral ni criterio de medición (eso es la RO).
#
# ESTADO: VIGENTE — ratificada por Javo el 2026-07-18 (ADR-035 §5). Segunda CNO promovida:
# el molde queda validado sobre DOS naturalezas distintas de regla (umbral · congruencia).
#
# CORREGIDO 2026-07-23 (auditoría integral): los 7 SHA256 quedaron obsoletos tras el
# reemplazo del Corpus v1.0 el 2026-07-21. Recalculados contra el corpus vigente, contenido
# verificado sin cambios. COOTAD Art.60 tenía 3 candidatos (ruido de chunking de otro
# documento) — resuelto por coincidencia textual con la sumilla. Backup:
# data/backups/brn_pre_correccion_sha_20260723/.
# ═══════════════════════════════════════════════════════════════════════════════
id: CNO-III-001
version: "1.0"
titulo: Traducción del Mandato Electoral a la Gestión Pública
objeto: >-
  la obligación jurídica que conecta la palabra empeñada ante el electorado (Plan de Trabajo)
  con la planificación, la ejecución y la rendición de cuentas del GAD.
dominio_normativo: mandato_electoral_y_representacion

# ── La cadena · puro Derecho · SHA por eslabón (Regla 3) ──────────────────────────
cadena:
  - rol: fundamento_constitucional
    norma: CE
    articulo: "61"
    sha256: 981cf97fbafe
    sumilla: "derechos de participación — elegir y ser elegidos: origen del mandato popular"

  - rol: compromiso
    norma: COD
    articulo: "97"
    sha256: b243e8693685
    sumilla: "el candidato inscribe su Plan de Trabajo ante el CNE — la palabra empeñada"

  - rol: investidura
    norma: COOTAD
    articulo: "60"
    sha256: 1baac1f8b508
    sumilla: "atribuciones del alcalde: dirige la gestión con que debe cumplir el mandato"

  - rol: investidura_legislativa
    norma: COOTAD
    articulo: "58"
    sha256: 240cb67911e9
    sumilla: "atribuciones de los concejales: fiscalizan y aprueban los instrumentos"

  - rol: traduccion
    norma: COPLAFIP
    articulo: "41"
    sha256: e3c9fad328f3
    sumilla: "el mandato se traduce en el plan de desarrollo (directrices del GAD)"

  - rol: traduccion_contenido
    norma: COPLAFIP
    articulo: "42"
    sha256: 349a6ad45c33
    sumilla: "contenidos mínimos del plan de desarrollo"

  - rol: rendicion
    norma: LOPC
    articulo: "89"
    sha256: 086fc826f996
    sumilla: "rendición de cuentas: el mandatario responde por el mandato ejercido"

  - rol: rendicion_sujetos
    norma: LOPC
    articulo: "90"
    sha256: 547b900b8a8f
    sumilla: "sujetos obligados a rendir cuentas — autoridades electas"

  - rol: consecuencia
    norma: CE
    articulo: "105"
    sha256: f7819a49cbe9
    sumilla: "revocatoria del mandato: la consecuencia del incumplimiento ante el electorado"

# ── Estado y ciclo de vida ────────────────────────────────────────────────────────
estado: vigente                   # propuesta | vigente | en_reforma | derogada
vigencia:
  desde: "2008-10-20"             # vigencia de la Constitución (marco del mandato)
  hasta: null
derogaciones:
  reemplaza_a: null
  reemplazada_por: null

# ── Dependencias (MDN · bidireccional) ────────────────────────────────────────────
deriva_ro:
  - RO-III-001                    # la lógica de medición del mandato vive en la RO, no aquí

# ── Validación humana (ADR-035 §5) ────────────────────────────────────────────────
validacion:
  propuesta_por: "BRN (extracción asistida)"
  validada_por: "Javo"            # ADR-035 §5 — ratificado
  fecha_validacion: "2026-07-18"
notas: >-
  Examen de generalidad: esta cadena NO desemboca en un umbral presupuestario sino en una
  obligación de congruencia y trazabilidad. Si el molde, el catálogo y el compilador la
  procesan sin cambios, el modelo BRN queda validado como arquitectura general.
