# ── Relación con la transparencia activa ──────────────────────────────────────────
# El art. 38 enlaza expresamente ambas vías, y de ahí sale el rasgo propio de esta cadena:
# la vía pasiva es el RECURSO cuando la activa no alcanza. Para los demás dominios eso
# significa que una ausencia en transparencia activa no es necesariamente el final del
# camino — es el punto donde empieza otro.
complementa:
  - CNO-VII-001                   # transparencia activa · art. 19
  - CNO-VII-002                   # obligación específica de GAD · art. 24

# ── Validación humana (ADR-035 §5) ────────────────────────────────────────────────
validacion:
  propuesta_por: "BRN (cadena verificada contra corpus 2026-08-18)"
  validada_por: null
  fecha_validacion: null
notas: >-
  Aporte de esta cadena: es la primera del catálogo cuyo hecho observable NO es un documento
  publicado sino un PROCEDIMIENTO con plazo —solicitud, respuesta, denegación motivada—. Eso
  la vuelve observable sólo cuando alguien ejerce el derecho, y por tanto su medición depende
  de un acto ciudadano que el sistema no controla. Se modela igualmente porque sin ella d07
  no puede distinguir «no está publicado» de «se pidió y no se entregó», que son hechos de
  peso jurídico muy distinto.
