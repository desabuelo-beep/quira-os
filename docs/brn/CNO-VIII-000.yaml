# ═══════════════════════════════════════════════════════════════════════════════
# CNO-VIII-000 · Marco Constitucional del Sistema de Participación Ciudadana
# CNO ARQUITECTÓNICA (no auditora). Fundamento constitucional compartido por toda la
# familia VIII. Tras el aporte de terreno de Javo (2026-07-23) el dominio se reorganiza en
# JERARQUÍA INSTITUCIONAL, no en lista de mecanismos:
#
#   000 Marco constitucional            (por qué existe · esta CNO)
#    └─ 001 Sistema Cantonal de Participación   (la estructura permanente · ordenanza)
#         └─ 002 Asamblea Ciudadana Cantonal    (el ÓRGANO ciudadano · representación territorial)
#              └─ 003 Consejo de Planificación  (delegados ciudadanos vienen de la Asamblea)
#                   └─ 004 Audiencia · 005 PP · 006 Cabildo · 007 Silla Vacía  (mecanismos)
#
# DISTINCIÓN CLAVE (aporte de Javo, verificada): la Asamblea Ciudadana NO es un mecanismo
# más — es el órgano de representación del Sistema (LOPC 56/57/61 · COOTAD 306/307). Los
# mecanismos son los instrumentos que ese órgano opera. Esa jerarquía es la de la LOPC.
#
# PRINCIPIO DE UNIVERSALIDAD (aporte de Javo): QUIRA no audita el modelo administrativo de
# cada cantón ("¿cómo participa Montecristi?") sino el cumplimiento constitucional ("¿cumplió
# el mandato?"). Por eso la representación territorial se modela como PRINCIPIO (barrios ·
# parroquias · comunas · recintos, según el territorio), no como forma única. Aplica a los 222 GAD.
#
# ESTADO: propuesta — cadena verificada contra el corpus (SHA256); ratificación de Javo pendiente.
# ═══════════════════════════════════════════════════════════════════════════════
