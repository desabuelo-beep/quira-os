# CNO-VIII-006 · Micro-CNO OPERATIVA · Cabildo Popular
# Familia CNO-VIII (d08). Se funda en CNO-VIII-000. Medida por RO-VIII-001. Evidencia
# física: Cabildo Popular 2025 (docx + pdf, texto limpio).
#
# El cabildo es DELIBERATIVO (sesión pública cantonal de convocatoria abierta), no
# resolutivo como la audiencia: la norma no le exige instrumento resolutivo equivalente al
# Art. 75 LOPC. Su verificabilidad mide realización y apertura.
#
# ESTADO: propuesta — verificada contra el corpus (SHA256); ratificación de Javo pendiente.
