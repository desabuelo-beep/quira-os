# ═══════════════════════════════════════════════════════════════════════════════
# RO-I-001 · Articulación plan → programación operativa (deriva de CNO-I-001)
# Primera de las dos RO que cuelgan de la misma cadena. Verifica el primer eslabón de la
# continuidad: que cada meta del plan de desarrollo tenga programación operativa anual.
#
# ESTADO: VIGENTE — aprobada formalmente por Javo el 2026-07-20 (ADR-035 §5).
# ═══════════════════════════════════════════════════════════════════════════════
id: RO-I-001
authority:
  parent: CNO-I-001
  constitution_articles: [1, 9]
  type: NORMATIVA
version: "1.0"
deriva_de: CNO-I-001 v1.0

# ── Definición de la métrica (qué se mide) ────────────────────────────────────────
metrica:
  nombre: Pct_Metas_Con_Programacion
  unidad: porcentaje

# ── Parámetros operativos (con qué valores) ───────────────────────────────────────
parametros:
  # El COOTAD Art. 234 exige que el plan operativo contenga las metas del plan de desarrollo:
  # es una obligación de contenido, no un umbral de rendimiento → se expresa como 100%.
  # (Misma deuda conceptual anotada en d09: `metrica.tipo` es candidato a BRN v3.)
  umbral: 100
  frecuencia: anual               # ciclo de formulación (COOTAD Art. 233 · antes del 10-sep)

# ── Método (cómo se evalúa) ───────────────────────────────────────────────────────
metodo:
  tipo: verificacion_documental
  criterios:
    - { id: meta_con_proyecto,    obligatorio: true,  descripcion: "cada meta del plan tiene al menos una línea de programación operativa que la opera" }
    - { id: dotacion_asignada,    obligatorio: true,  descripcion: "esa programación tiene asignación presupuestaria identificable" }
    - { id: responsable_definido, obligatorio: false, descripcion: "la programación identifica la dependencia responsable de ejecutarla" }

consecuencia: "Meta sin programación operativa: queda registrada como planificación sin traducción anual (observación preventiva)"

# ── Consumo ───────────────────────────────────────────────────────────────────────
# ── SAT QUE ESTA RO PRODUCE (OBS-022 · saldo de deuda BRN) ────────────────────
# ADR-038 §1b: el umbral es LÓGICA y vive aquí; SAT_Catalogo solo lo refleja.
# Mapeo verificado 2026-07-29: la nomenclatura BRN heredada (SAT-I-001) NO existe
# en el Gold Master. La señal real es SAT-0 "Coherencia POA-PAC" (OBS-016).
produce:
  - id: SAT-0
    nombre_gold_master: "Coherencia POA-PAC"
    dimension_tgi: D2
    deriva_de: CNO-I-001
    metrica: Pct_Metas_Con_Programacion
    umbral_activacion: 100          # toda meta del PDOT debe tener programación operativa
    faceta: "programación — la meta existe en el POA"
    equivalencia_heredada: SAT-I-001   # ⚠️ id BRN antiguo, no existe en el motor
    refleja_en_gold_master: "SAT_Catalogo fila 6"

consume: [ SAT-I-001 ]
opera_en: d01                     # Planificación Estratégica

# ── Estado y trazabilidad ─────────────────────────────────────────────────────────
estado: vigente
validacion:
  validada_por: "Javo"
  fecha_validacion: "2026-07-20"
