# ═══════════════════════════════════════════════════════════════════════════════
# RO-I-002 · Articulación programación operativa → contratación (deriva de CNO-I-001)
# Segunda RO de la MISMA cadena jurídica. Verifica el eslabón siguiente de la continuidad:
# que lo programado con contratación prevista conste en el Plan Anual de Contratación.
# Es la regla que sostiene la señal preventiva de coherencia entre programación y contratación.
#
# Que dos RO distintas cuelguen de una sola CNO es el estrés topológico (1:N) que aporta d01.
#
# ESTADO: VIGENTE — aprobada formalmente por Javo el 2026-07-20 (ADR-035 §5).
# ═══════════════════════════════════════════════════════════════════════════════
id: RO-I-002
version: "1.0"
deriva_de: CNO-I-001 v1.0

# ── Definición de la métrica (qué se mide) ────────────────────────────────────────
metrica:
  nombre: Pct_Coherencia_Programacion_Contratacion
  unidad: porcentaje

# ── Parámetros operativos (con qué valores) ───────────────────────────────────────
parametros:
  # LOSNCP Art. 22: el PAC se formula conforme al plan y al presupuesto — obligación de
  # correspondencia, no umbral de rendimiento (misma naturaleza que RO-I-001).
  umbral: 100
  frecuencia: anual               # el PAC es anual; el seguimiento es continuo dentro del ejercicio

# ── Método (cómo se evalúa) ───────────────────────────────────────────────────────
metodo:
  tipo: verificacion_documental
  criterios:
    - { id: linea_en_pac,        obligatorio: true,  descripcion: "cada línea de programación con contratación prevista consta en el Plan Anual de Contratación" }
    - { id: partida_coincidente, obligatorio: true,  descripcion: "la partida presupuestaria del PAC corresponde con la de la programación operativa" }
    - { id: publicacion_portal,  obligatorio: false, descripcion: "el proceso se publica en el portal de compras públicas dentro del ejercicio" }

consecuencia: "Brecha entre programación y contratación: se señala de forma preventiva antes de ejecutar, no como incumplimiento consumado"

# ── Consumo ───────────────────────────────────────────────────────────────────────
consume: [ SAT-I-002 ]
opera_en: d01                     # Planificación Estratégica

# ── Estado y trazabilidad ─────────────────────────────────────────────────────────
estado: vigente
validacion:
  validada_por: "Javo"
  fecha_validacion: "2026-07-20"
