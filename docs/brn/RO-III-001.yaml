# ═══════════════════════════════════════════════════════════════════════════════
# RO-III-001 · Regla Operativa derivada de CNO-III-001
# La lógica de medición del mandato electoral. AQUÍ se valida el diseño (colega · 2026-07-18):
# el mandato no parametriza un % presupuestario, sino un PROCEDIMIENTO DE EVALUACIÓN de
# congruencia. Pero conserva la MISMA estructura del molde (variable·umbral·periodo) para que
# el compilador la transforme sin una sola línea específica de d03 — ese es el examen.
#
# Javo (2026-07-18): todos los dominios tienen su lógica de medición; d03 no es excepción.
# Su medición: la fidelidad del mandato (congruencia promesa→plan, ponderada), umbral 85%.
#
# ESTADO: propuesta — vigente solo tras validación de Javo (ADR-035 §5).
# ═══════════════════════════════════════════════════════════════════════════════
id: RO-III-001
version: "1.0"
deriva_de: CNO-III-001 v1.0      # SIEMPRE nace de una CNO (Regla 3)

# ── La lógica de medición ─────────────────────────────────────────────────────────
variable: Pct_Fidelidad_Mandato   # congruencia ponderada promesa (Plan de Trabajo) → plan de desarrollo
umbral: 85                        # % — piso de FIDELIDAD ALTA; por debajo, atención preventiva
# CRITERIOS de evaluación (la naturaleza distinta a d02: no es un techo de gasto, es un
# procedimiento de congruencia). Son la DEFINICIÓN de la lógica; el motor ya sabe calcularla.
# El compilador NO los baja al config de ejecución — quedan en el canon/manifest para trazar.
criterios:
  congruencia: "correspondencia entre cada promesa inscrita y una meta del plan de desarrollo"
  cobertura: "proporción de promesas que hallaron correspondencia identificada"
  trazabilidad: "existencia de evidencia documental que sostiene cada correspondencia"
periodo: { frecuencia: anual }    # el mandato se evalúa por período, no mensualmente
motor: "Gold Master · fidelidad del mandato (d03)"   # el motor computa; NO consulta esta RO (ADR-039)
consecuencia: "Atención preventiva del mandato (no correctiva): el mandato está en el plan; se vigila su viaje aguas abajo"

# ── Consumo (MDN) ─────────────────────────────────────────────────────────────────
consumida_por:
  - SAT-III-001                   # la señal del mandato lleva solo este ID (ADR-038 §118)
opera_en: d03                     # Gobernanza del Mandato Electoral

# ── Estado y trazabilidad ─────────────────────────────────────────────────────────
estado: propuesta                 # propuesta | vigente | obsoleta | retirada
compilada:
  build: null
  sha_artefacto: null
validacion:
  validada_por: null              # ← Javo valida para promover a 'vigente'
  fecha_validacion: null
