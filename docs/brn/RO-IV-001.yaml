# ═══════════════════════════════════════════════════════════════════════════════
# RO-IV-001 · Regla Operativa derivada de CNO-IV-001
# La única representación operativa autorizada de la regla de asignación mínima prioritaria.
# Estructura en TRES PLANOS (colega · 2026-07-18): métrica (qué se mide) · parámetros (con qué
# valores) · método (cómo, si aplica). La RO NO conoce el motor — eso es implementación (Regla 1).
#
# ESTADO: VIGENTE — ratificada por Javo el 2026-07-18 (ADR-035 §5).
# ═══════════════════════════════════════════════════════════════════════════════
id: RO-IV-001
authority:
  parent: CNO-IV-001
  constitution_articles: [1, 9]
  type: NORMATIVA
version: "1.0"                    # sube por REFORMA del texto, NUNCA por el paso del tiempo (molde §4b)
deriva_de: CNO-IV-001 v1.0       # SIEMPRE nace de una CNO (Regla 3)

# ── Definición de la métrica (qué se mide) ────────────────────────────────────────
metrica:
  nombre: Pct_Gasto_No_Permanente
  unidad: porcentaje

# ── Parámetros operativos (con qué valores) ───────────────────────────────────────
# VIGENCIA OPERATIVA (§4b): el paso 65→70 lo prevé la propia norma (Transitoria → Art. 198.1).
# Es una TRANSICIÓN, no una reforma: tramos dentro de la MISMA RO v1.0; el runtime elige por fecha.
parametros:
  frecuencia: mensual
  seguimiento_desde: "2026-12-01"    # antes: señal preventiva (no exigible)
  vigencia_operativa:
    - { desde: "2026-02-21", hasta: "2026-12-31", umbral: 65 }   # piso transitorio (Disp. Transitoria 1ª)
    - { desde: "2027-01-01", hasta: null,         umbral: 70 }   # regla plena (Art. 198.1)

consecuencia: "Alerta fiscal preventiva"

# ── Consumo (la RO no conoce el motor · colega 2026-07-18) ─────────────────────────
consume: [ SAT-IV-001 ]           # la SAT lleva solo este ID (ADR-038 §118)
opera_en: d02                     # dominio funcional (Presupuesto & Financiamiento)

# ── Estado y trazabilidad ─────────────────────────────────────────────────────────
estado: vigente                   # propuesta | vigente | obsoleta | retirada
validacion:
  validada_por: "Javo"            # ADR-035 §5 — ratificado
  fecha_validacion: "2026-07-18"
