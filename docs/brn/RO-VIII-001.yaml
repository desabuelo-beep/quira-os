# ═══════════════════════════════════════════════════════════════════════════════
# RO-VIII-001 · Regla Operativa · INTEGRIDAD NORMATIVA del Sistema de Participación
# Primera de las TRES dimensiones de d08 (Javo · 2026-07-23):
#   1. INTEGRIDAD NORMATIVA  (esta RO)  → ¿existe / se instaló / convocó / documentó / aprobó?
#   2. Vitalidad democrática (RO-VIII-002) → ¿cuántos participaron / qué diversidad?
#   3. Efectividad/incidencia (RO-VIII-003) → ¿lo pedido se volvió POA/PAC/presupuesto/obra?
#
# ★ CORRECCIÓN (Javo · 2026-07-24 · OBS-016): la versión anterior modelaba 7 SAT
# (SAT-VIII-001..007, una por mecanismo). ERROR: las SAT no son 1:1 con mecanismos —
# son señales de alerta del Gold Master (SAT-0..VIII por dimensión TGI), y "SAT-VIII" ya
# existe en el motor (Equidad Territorial). La verificabilidad documental por instancia
# NO es una SAT: es el ESTADO DE LA EVIDENCIA. Esta RO evalúa ese estado por CRITERIOS,
# sin inventar señales. La única SAT de participación en el motor es SAT-VI (Desvío PP),
# consumida por la dimensión de efectividad (RO-VIII-003), no por esta.
#
# LÍMITE (Regla 4): NO recalcula el IGP. Produce la verificabilidad documental que lo sostiene.
#
# ESTADO: propuesta — ratificación de Javo pendiente (ADR-035 §5).
# ═══════════════════════════════════════════════════════════════════════════════
id: RO-VIII-001
authority:
  parent: CNO-VIII-000
  constitution_articles: [1, 9]
  type: NORMATIVA
version: "1.0"
dimension: integridad_normativa
deriva_de: CNO-VIII-000 v1.0
integra: [ CNO-VIII-001, CNO-VIII-002, CNO-VIII-003, CNO-VIII-004, CNO-VIII-005, CNO-VIII-006, CNO-VIII-007 ]
metrica: { nombre: Integridad_Normativa_Sistema_Participacion, unidad: porcentaje }
parametros: { umbral_alto: 85, umbral_medio: 60, frecuencia: anual }

# La integridad NO consume SAT: evalúa el estado de la evidencia documental por instancia.
consume: []

# ── Método · verificación documental, criterios por instancia (NO son señales SAT) ──
metodo:
  tipo: verificacion_documental
  nota: "cada criterio evalúa el ESTADO DE LA EVIDENCIA de una instancia/mecanismo — es verificabilidad, no una señal de alerta del motor (OBS-016)."
  criterios:
    - { instancia: sistema_cantonal,        cno: CNO-VIII-001, obligatorio: true,  norma: "COOTAD 304",       descripcion: "existe la ORDENANZA que conforma el sistema de participación" }
    - { instancia: asamblea_ciudadana,      cno: CNO-VIII-002, obligatorio: true,  norma: "LOPC 56/57 · COOTAD 306", descripcion: "el GAD reconoce/articula la Asamblea (órgano ciudadano autónomo — evidencia indirecta en actas de mecanismos)" }
    - { instancia: consejo_planificacion,   cno: CNO-VIII-003, obligatorio: true,  norma: "COPLAFIP 28/29",   descripcion: "Consejo conformado + RESOLUCIÓN favorable (evidencia en carpeta)" }
    # AUDIENCIA PÚBLICA — cadena desglosada en criterios INDEPENDIENTES (Javo · 2026-07-27):
    # una brecha documental NO anula el mecanismo. Cada criterio reporta su propio estado;
    # ninguno cancela a los demás. Poner el mecanismo en cero por una brecha puntual sería
    # castigar la evidencia en lugar de medirla (Carta Art. 4.5).
    - { instancia: audiencia_publica, criterio: convocatoria,           cno: CNO-VIII-004, obligatorio: true,  norma: "LOPC 74",   descripcion: "consta la convocatoria / atención a la solicitud ciudadana" }
    - { instancia: audiencia_publica, criterio: habilitacion_instancia, cno: CNO-VIII-004, obligatorio: true,  norma: "LOPC 73",   descripcion: "la instancia fue habilitada por la autoridad responsable" }
    - { instancia: audiencia_publica, criterio: realizacion,            cno: CNO-VIII-004, obligatorio: true,  norma: "LOPC 73",   descripcion: "la audiencia se realizó (acta como evidencia) — ACREDITADO 28/28" }
    - { instancia: audiencia_publica, criterio: presidencia_acreditada, cno: CNO-VIII-004, obligatorio: true,  norma: "LOPC 73",   descripcion: "el acta formaliza quién presidió — ★ OBS-017A: 0/28" }
    - { instancia: audiencia_publica, criterio: habilitacion_actuante,  cno: CNO-VIII-004, obligatorio: true,  norma: "COOTAD 60", descripcion: "consta el acto administrativo de delegación cuando no preside el alcalde — ★ OBS-017B: no consta" }
    - { instancia: audiencia_publica, criterio: resolucion_cierre,      cno: CNO-VIII-004, obligatorio: true,  norma: "LOPC 75",   descripcion: "consta la RESOLUCIÓN de la audiencia (mismo día o 10 días hábiles) — ★ OBS-017: 0/28" }
    - { instancia: audiencia_publica, criterio: demandas_recogidas,     cno: CNO-VIII-004, obligatorio: false, norma: "LOPC 73",   descripcion: "el acta registra las demandas ciudadanas — ACREDITADO: 28 demandas catalogadas" }
    - { instancia: audiencia_publica, criterio: compromisos_asumidos,   cno: CNO-VIII-004, obligatorio: false, norma: "LOPC 75",   descripcion: "el acta registra compromisos/acuerdos de la autoridad" }
    - { instancia: presupuesto_participativo, cno: CNO-VIII-005, obligatorio: true, norma: "LOPC 71 · COOTAD 238", descripcion: "PP formulado y articulado al plan" }
    - { instancia: cabildo_popular,         cno: CNO-VIII-006, obligatorio: false, norma: "LOPC 76",          descripcion: "cabildo realizado en convocatoria abierta" }
    - { instancia: silla_vacia,             cno: CNO-VIII-007, obligatorio: false, norma: "CE 101 · LOPC 77 · COOTAD 311", descripcion: "silla vacía en sesiones (evidencia: actas de Concejo — workstream futuro)" }

consecuencia: "Observación de verificabilidad por instancia: la no acreditación documental (p. ej. audiencia sin resolución Art. 75) se registra como PARCIAL o SIN EVIDENCIA + cita COOTAD 312. Nunca 'incumple/ilegal' (Regla 2)."
opera_en: d08
estado: propuesta
validacion: { validada_por: null, fecha_validacion: null }
