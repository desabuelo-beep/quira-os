# ═══════════════════════════════════════════════════════════════════════════════
# RO-VIII-001 · Regla Operativa · INTEGRIDAD NORMATIVA del Sistema de Participación
# Primera de las TRES dimensiones de d08 (Javo · 2026-07-23):
#   1. INTEGRIDAD NORMATIVA  (esta RO)  → ¿existe / se instaló / convocó / documentó / aprobó?
#   2. Vitalidad democrática (RO-VIII-002) → ¿cuántos participaron / qué diversidad?
#   3. Efectividad/incidencia (RO-VIII-003) → ¿lo pedido se volvió POA/PAC/presupuesto/obra?
#
# ★ CORRECCIÓN (Javo · 2026-07-24 · OBS-016): la versión anterior modelaba 7 SAT
# (SAT-VIII-001..007, una por mecanismo). ERROR: las SAT no son 1:1 con mecanismos —
# son señales de alerta del Gold Master (SAT-0..VIII por dimensión TGI), y "SAT-VIII" ya
# existe en el motor (Equidad Territorial). La verificabilidad documental por instancia
# NO es una SAT: es el ESTADO DE LA EVIDENCIA. Esta RO evalúa ese estado por CRITERIOS,
# sin inventar señales. La única SAT de participación en el motor es SAT-VI (Desvío PP),
# consumida por la dimensión de efectividad (RO-VIII-003), no por esta.
#
# LÍMITE (Regla 4): NO recalcula el IGP. Produce la verificabilidad documental que lo sostiene.
#
# ESTADO: propuesta — ratificación de Javo pendiente (ADR-035 §5).
# ═══════════════════════════════════════════════════════════════════════════════
id: RO-VIII-001
authority:
  parent: CNO-VIII-000
  constitution_articles: [1, 9]
  type: NORMATIVA
version: "1.0"
dimension: integridad_normativa
deriva_de: CNO-VIII-000 v1.0
integra: [ CNO-VIII-001, CNO-VIII-002, CNO-VIII-003, CNO-VIII-004, CNO-VIII-005, CNO-VIII-006, CNO-VIII-007 ]
metrica: { nombre: Integridad_Normativa_Sistema_Participacion, unidad: porcentaje }
parametros: { umbral_alto: 85, umbral_medio: 60, frecuencia: anual }

# La integridad NO consume SAT: evalúa el estado de la evidencia documental por instancia.
consume: []

# ═══════════════════════════════════════════════════════════════════════════════
# MATRIZ CANÓNICA DE LA CADENA PARTICIPATIVA (asesores · 2026-07-27)
# ═══════════════════════════════════════════════════════════════════════════════
# INFRAESTRUCTURA METODOLÓGICA REUTILIZABLE, no una solución de un solo uso para d08.
# Todo mecanismo participativo (audiencia · PP · cabildo · asamblea · silla vacía) se
# proyecta sobre estos MISMOS 9 nodos. El motor de verificación queda AGNÓSTICO AL
# MECANISMO: mañana se audita un Cabildo o una Asamblea con la misma canalización.
#
# Cambio de paradigma (Javo + asesores): d08 deja de evaluar "¿cumple sí/no?" y pasa a
# ser una AUDITORÍA DE INTEGRIDAD DEL PROCESO — cada nodo recibe su propia calificación
# con evidencia propia, y la falla de uno NO invalida a los demás (Carta Art. 4.5).
# Resultado posible: "el mecanismo existe, pero su integridad institucional está
# fragmentada" — mucho más fino que "cumple / no cumple".
cadena_participativa_canonica:
  - { id: C01, nodo: convocatoria,            pregunta: "¿consta la convocatoria o la atención a la solicitud ciudadana?" }
  - { id: C02, nodo: instalacion,             pregunta: "¿consta la instalación formal del acto (quórum, apertura)?" }
  - { id: C03, nodo: presidencia_acreditada,  pregunta: "¿el expediente ACREDITA formalmente qué autoridad presidió?" }
  - { id: C04, nodo: habilitacion_delegacion, pregunta: "¿consta el instrumento que habilita a quien dirigió (delegación/competencia)?" }
  - { id: C05, nodo: participacion_efectiva,  pregunta: "¿consta quiénes participaron y en qué magnitud/diversidad?" }
  - { id: C06, nodo: registro_demandas,       pregunta: "¿el expediente registra las demandas ciudadanas planteadas?" }
  - { id: C07, nodo: compromisos_asumidos,    pregunta: "¿constan los compromisos o acuerdos asumidos por la institución?" }
  - { id: C08, nodo: resolucion_cierre,       pregunta: "¿consta el instrumento resolutivo de cierre exigido por la norma?" }
  - { id: C09, nodo: publicidad_intersistemica, pregunta: "¿el acto consta de forma congruente en TODOS los sistemas oficiales (transparencia, CPCCS)?" }

# Estados posibles por nodo (Carta Art. 4.5 · cinco categorías):
#   acreditado · ausencia_documental · ausencia_habilitacion_documental ·
#   fragmentacion_intersistemica · no_aplica
# NUNCA: "incumple" / "ilegal" — eso lo determina la autoridad competente.

# ── Método · verificación documental, criterios por instancia (NO son señales SAT) ──
metodo:
  tipo: verificacion_documental
  nota: "cada criterio evalúa el ESTADO DE LA EVIDENCIA de una instancia/mecanismo — es verificabilidad, no una señal de alerta del motor (OBS-016)."
  criterios:
    - { instancia: sistema_cantonal,        cno: CNO-VIII-001, obligatorio: true,  norma: "COOTAD 304",       descripcion: "existe la ORDENANZA que conforma el sistema de participación" }
    - { instancia: asamblea_ciudadana,      cno: CNO-VIII-002, obligatorio: true,  norma: "LOPC 56/57 · COOTAD 306", descripcion: "el GAD reconoce/articula la Asamblea (órgano ciudadano autónomo — evidencia indirecta en actas de mecanismos)" }
    - { instancia: consejo_planificacion,   cno: CNO-VIII-003, obligatorio: true,  norma: "COPLAFIP 28/29",   descripcion: "Consejo conformado + RESOLUCIÓN favorable (evidencia en carpeta)" }
    # AUDIENCIA PÚBLICA — proyección sobre la matriz canónica (28 actas 2023-2025).
    # Cada nodo con estado INDEPENDIENTE: la falla de uno NO invalida a los demás.
    # Redacción según el Principio de No-Inferencia (Carta Art. 4.5): se certifica lo que
    # el expediente ACREDITA, nunca lo que se supone que ocurrió en la sala.
    - { instancia: audiencia_publica, nodo: C01, cno: CNO-VIII-004, obligatorio: true,  norma: "LOPC 74",   estado: pendiente_verificacion, descripcion: "convocatoria / atención a la solicitud ciudadana" }
    - { instancia: audiencia_publica, nodo: C02, cno: CNO-VIII-004, obligatorio: true,  norma: "LOPC 73",   estado: acreditado,             descripcion: "el acto se realizó — acreditado en 28/28 expedientes" }
    - { instancia: audiencia_publica, nodo: C03, cno: CNO-VIII-004, obligatorio: true,  norma: "LOPC 73",   estado: ausencia_documental,    descripcion: "★ OBS-017A — la documentación analizada NO ACREDITA formalmente la autoridad que presidió (0/28). No se infiere quién presidió ni su ausencia" }
    - { instancia: audiencia_publica, nodo: C04, cno: CNO-VIII-004, obligatorio: true,  norma: "COOTAD 60", estado: ausencia_habilitacion_documental, descripcion: "★ OBS-017B — no consta acto administrativo de delegación que permita reconstruir la cadena de competencia de quien dirigió" }
    - { instancia: audiencia_publica, nodo: C05, cno: CNO-VIII-004, obligatorio: false, norma: "LOPC 73",   estado: pendiente_verificacion, descripcion: "participación efectiva: magnitud y diversidad (dimensión vitalidad · RO-VIII-002)" }
    - { instancia: audiencia_publica, nodo: C06, cno: CNO-VIII-004, obligatorio: false, norma: "LOPC 73",   estado: acreditado,             descripcion: "registro de demandas — 28 demandas catalogadas (Fase 1)" }
    - { instancia: audiencia_publica, nodo: C07, cno: CNO-VIII-004, obligatorio: false, norma: "LOPC 75",   estado: pendiente_verificacion, descripcion: "compromisos/acuerdos asumidos por la institución" }
    - { instancia: audiencia_publica, nodo: C08, cno: CNO-VIII-004, obligatorio: true,  norma: "LOPC 75",   estado: ausencia_documental,    descripcion: "★ OBS-017 — no consta el instrumento resolutivo de cierre exigido (0/28)" }
    - { instancia: audiencia_publica, nodo: C09, cno: CNO-VIII-004, obligatorio: true,  norma: "LOTAIP · RES-CPCCS", estado: fragmentacion_intersistemica, descripcion: "★ el mecanismo consta como ejecutado en el informe RDC/CPCCS pero no figura en transparencia activa — pendiente de verificación en d07" }
    - { instancia: presupuesto_participativo, cno: CNO-VIII-005, obligatorio: true, norma: "LOPC 71 · COOTAD 238", descripcion: "PP formulado y articulado al plan" }
    - { instancia: cabildo_popular,         cno: CNO-VIII-006, obligatorio: false, norma: "LOPC 76",          descripcion: "cabildo realizado en convocatoria abierta" }
    - { instancia: silla_vacia,             cno: CNO-VIII-007, obligatorio: false, norma: "CE 101 · LOPC 77 · COOTAD 311", descripcion: "silla vacía en sesiones (evidencia: actas de Concejo — workstream futuro)" }

consecuencia: "Observación de verificabilidad por instancia: la no acreditación documental (p. ej. audiencia sin resolución Art. 75) se registra como PARCIAL o SIN EVIDENCIA + cita COOTAD 312. Nunca 'incumple/ilegal' (Regla 2)."
opera_en: d08
estado: propuesta
validacion: { validada_por: null, fecha_validacion: null }
