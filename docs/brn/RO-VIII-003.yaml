# ═══════════════════════════════════════════════════════════════════════════════
# RO-VIII-003 · Regla Operativa · EFECTIVIDAD / INCIDENCIA REAL (3ª dimensión de d08)
# Idea de Javo (2026-07-23) — la que cierra el modelo: no basta que el mecanismo exista
# (integridad) ni que participe gente (vitalidad); lo decisivo es si lo que la ciudadanía
# pidió EN LAS INSTANCIAS DE PARTICIPACIÓN se convirtió en POA / PAC / presupuesto / obra.
#
# ★ CORRECCIÓN DE NATURALEZA (Javo · 2026-07-23): la primera versión reusó por error
# scripts/enrich_aportes.py — pero ESE motor cruza los aportes al INFORME DE RENDICIÓN DE
# CUENTAS (H10c), que son CONTROL SOCIAL (d09), no participación. Frontera LOPC:
#   · d09 (RDC · control social)   → aportes ciudadanos AL informe de rendición.
#   · d08 (participación ciudadana) → aportes emanados DE las instancias/mecanismos:
#       actas de PP, actas de audiencias públicas, actas de cabildos populares.
# Mismo término ("aporte ciudadano"), distinta fuente y naturaleza jurídica. NO se reusa
# el motor de d09; los aportes de d08 se extraen de las actas de participación (Nivel 4).
#
# MOTOR: NO EXISTE AÚN (a diferencia de d09). Es workstream propio de d08 — extraer los
# aportes diseminados en las actas de las instancias y cruzarlos contra la ejecución
# (POA/PAC/presupuesto). Muchas actas están escaneadas (audiencias) → requieren OCR
# certificado; PP y cabildo son docx (texto). Por eso: estado = diseño, motor pendiente.
#
# DISTINCIÓN JURÍDICA (verificada) para la exigibilidad de la incorporación:
#   · PRESUPUESTO PARTICIPATIVO = VINCULANTE (COOTAD 238) → incorporación EXIGIBLE.
#   · Aportes de audiencia / cabildo = ADVISORY/deliberativo (LOPC 73-76) → se mide la
#     ACOGIDA (revela voluntad política), no como incumplimiento.
#
# DESTINO COMPARTIDO (reuso cross-dominio real): el cruce va contra POA (d01), PAC/SERCOP y
# presupuesto (d02) — la ejecución se lee una vez y varios dominios la consultan. Lo que NO
# se comparte con d09 es el ORIGEN de los aportes (ese es el error que se corrige aquí).
#
# LÍMITE (Regla 1/4): el cruce será derivación semántica (embeddings + validación experta),
# NO fórmula que el Excel recalcule; su resultado no se estampa en el Gold Master.
#
# ESTADO: propuesta · DISEÑO — motor de extracción de aportes de participación PENDIENTE.
# ═══════════════════════════════════════════════════════════════════════════════
id: RO-VIII-003
authority:
  parent: CNO-VIII-000
  constitution_articles: [1, 9]
  type: NORMATIVA
version: "1.0"
dimension: efectividad_incidencia
deriva_de: CNO-VIII-000 v1.0
metrica: { nombre: Efectividad_Incidencia_Participacion, unidad: porcentaje }
parametros: { umbral_alto: 60, umbral_medio: 40, frecuencia: anual }
# ★ CALIBRADO EMPÍRICAMENTE 2026-07-29 (antes decía "a calibrar con Javo"):
#   medición sobre demandas VINCULANTES (COOTAD 238 · las exigibles), no sobre el total.
#   162 de 191 sin correlato verificable = 84,8%.  Universo total (223) daría 80,7%, pero
#   mezclar advisory con vinculante subestima lo que la ley hace EXIGIBLE.

metodo:
  tipo: trazabilidad_documental_semiautomatica
  motor: "PENDIENTE — workstream propio de d08 (NO reusa enrich_aportes.py, que es de d09/RDC)"
  fuente_aportes:
    naturaleza: "aportes emanados de las instancias/mecanismos de participación (d08), NO del informe de RDC (d09)"
    documentos:
      - "actas de Presupuesto Participativo (docx · texto)"
      - "actas de Audiencias Públicas (PDF escaneado → OCR certificado)"
      - "actas de Cabildos Populares (docx · texto)"
      - "actas/resoluciones de la Asamblea Ciudadana y el Consejo de Planificación"
  clasificacion:
    nivel_atencion: [ atendido, por_validar, sin_correlato ]
    tiempo_respuesta: [ a_tiempo, tarde, olvidado ]
  criterios:
    - { id: aporte_pp_incorporado,  naturaleza: vinculante, norma: "COOTAD 238 · LOPC 71", descripcion: "lo priorizado en el PP se incorporó al POA/presupuesto (exigible)" }
    - { id: aporte_audiencia_acogido, naturaleza: advisory, norma: "LOPC 73-75",           descripcion: "los aportes/resoluciones de audiencias fueron acogidos en la gestión (revela voluntad política)" }
    - { id: aporte_cabildo_acogido,   naturaleza: deliberativo, norma: "LOPC 76",          descripcion: "lo deliberado en cabildos tuvo correlato en la acción del GAD" }

destino_cruce: [ d01_POA, d02_presupuesto_PAC ]   # se comparte el DESTINO, no el origen de los aportes
consecuencia: "Observación de incidencia: aporte VINCULANTE (PP) sin correlato de ejecución → no acreditación de incorporación (COOTAD 238); aporte ADVISORY sin acogida → seguimiento (no exigible). Lenguaje de administración pública, nunca acusatorio (Regla 2)."
# SAT real del Gold Master relevante a la efectividad (OBS-016): SAT-VI Desvío PP (D4).
# Hoy sin datos (Hay_Datos_PP=NO). Las SAT que falten para d08 se diseñan en fase 2.
consume: [ SAT-VI ]

# ── SAT QUE ESTA RO PRODUCE ────────────────────────────────────────────────────
# ADR-038 §1b: "una CNO todavía es Derecho; una SAT ya es control". El UMBRAL y el
# PESO son LÓGICA y por tanto viven aquí, no en SAT_Catalogo del Gold Master —
# el Excel solo REFLEJA lo que esta RO declara.
#
# ⚠️ Corrección de procedimiento (Javo · 2026-07-29): SAT-IX se había escrito
# directamente en el Excel, saltándose CNO→RO. Javo lo detectó: "¿por las SAT no
# debería pasar la BRN?". Sí debe. Queda restituida la cadena.
produce:
  - id: SAT-IX
    nombre: "Brecha de Atencion Ciudadana"
    dimension_tgi: D4                     # misma que SAT-VI (participación)
    deriva_de: CNO-VIII-005               # COOTAD 238 · verificado con SHA en el corpus
    metrica: "demandas_vinculantes_sin_correlato / demandas_vinculantes"
    umbral_activacion: 0.50
    justificacion_umbral: >-
      Si más de la mitad de lo que la ley hace EXIGIBLE (COOTAD 238) no puede
      verificarse documentalmente, el mecanismo participativo no está cumpliendo su
      función legal. Umbral conservador: no afirma desatención, afirma no-verificabilidad.
    peso_severidad: 0.05                  # igual a SAT-VI por compartir dimensión D4
    tipo: ALERTA
    medicion_2026: { valor: 0.848, numerador: 162, denominador: 191, fuente: "data/d08/trazabilidad_demandas.json" }
    frontera_interpretativa: >-
      NO acredita desatención del GAD. Acredita ausencia de habilitación documental
      (Carta Art. 4.5). OBS-021: la causa dominante es que el POA localiza el 1% del
      gasto, así que la correspondencia es inverificable por el instrumento, no negada.
    refleja_en_gold_master: "SAT_Catalogo fila 15 + H75_SAT_ENGINE"
opera_en: d08
estado: propuesta
validacion: { validada_por: null, fecha_validacion: null }
